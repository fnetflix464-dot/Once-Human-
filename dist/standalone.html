<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once Human Database</title>
<meta name="description" content="Unofficial community database for Once Human — weapons, mods, blueprints, builds, memetics, deviants, crops, bosses, regions and patch history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Irradiated-wasteland palette: warm scorched-earth ground, ember/rust primary, corroded-stardust teal secondary */
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
  --radius: 3px;
  --maxw: 1180px;
  --font-display: "Rajdhani", "Segoe UI", sans-serif;
  --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: var(--font-body);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f1e6;
    --bg-alt: #efe6d4;
    --card: #fffcf5;
    --card-hover: #fbf3e2;
    --border: #ddccaa;
    --border-soft: #e7dabf;
    --text: #241b13;
    --text-dim: #6e5c43;
    --accent: #c85a24;
    --accent-soft: #a5461a;
    --accent-2: #157a67;
    --danger: #b23f31;
  }
}

:root[data-theme="light"] {
  --bg: #f6f1e6;
  --bg-alt: #efe6d4;
  --card: #fffcf5;
  --card-hover: #fbf3e2;
  --border: #ddccaa;
  --border-soft: #e7dabf;
  --text: #241b13;
  --text-dim: #6e5c43;
  --accent: #c85a24;
  --accent-soft: #a5461a;
  --accent-2: #157a67;
  --danger: #b23f31;
}

:root[data-theme="dark"] {
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100vh;
  line-height: 1.5;
  font-family: var(--font-body);
}

h1, h2, h3, nav.tabs button, .version-pill {
  font-family: var(--font-display);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header.site-header {
  background: linear-gradient(180deg, var(--bg-alt), var(--bg));
  border-bottom: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  padding: 18px 20px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(6px);
}

.header-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.brand .version-pill {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--bg);
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 2px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-box input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius);
  min-width: 240px;
  font-size: 0.88rem;
  font-family: var(--font-body);
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

nav.tabs {
  max-width: var(--maxw);
  margin: 14px auto 0;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  padding-bottom: 0;
  scrollbar-width: thin;
}

nav.tabs button {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 9px 14px 10px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

nav.tabs button:hover { background: var(--card); color: var(--text); }

nav.tabs button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--card);
}

main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.panel { display: none; }
.panel.active { display: block; }

.panel h2 {
  margin-top: 0;
  font-size: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}

.panel > p.intro {
  color: var(--text-dim);
  max-width: 800px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-top-color 0.15s, background 0.15s;
}

.card:hover {
  border-top-color: var(--accent);
  background: var(--card-hover);
}

.card-link {
  cursor: pointer;
}
.card-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card-link h3 {
  text-decoration-line: none;
}
.card-link:hover h3 {
  text-decoration: underline;
  text-decoration-color: var(--accent);
}

.breadcrumb {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 12px;
}
.breadcrumb .sep { margin: 0 4px; opacity: 0.6; }
.breadcrumb span:last-child { color: var(--text); }

.back-link {
  display: inline-block;
  margin-top: 28px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  width: 100%;
  font-size: 0.86rem;
  font-weight: 600;
}

.card h3 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
}

.card .meta {
  font-size: 0.74rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.tag {
  display: inline-block;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  padding: 1px 8px;
  border-radius: 2px;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.tag.tier-S { color: var(--accent-soft); border-color: var(--accent-soft); }
.tag.tier-A { color: var(--accent-2); border-color: var(--accent-2); }

.card p { margin: 4px 0; font-size: 0.88rem; color: var(--text); }
.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--text-dim); }

.table-wrap { overflow-x: auto; }

table.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}

table.data-table th, table.data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

table.data-table th {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
  background: var(--bg);
}

table.data-table tbody tr:hover { background: var(--bg-alt); }

.section-block {
  margin-top: 28px;
}

.section-block h3 {
  color: var(--accent-2);
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 6px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.timeline-entry {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 24px;
  position: relative;
}

.timeline-entry::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}

.timeline-entry h3 { margin: 0 0 2px; color: var(--text); }
.timeline-entry .date { color: var(--text-dim); font-size: 0.8rem; }
.timeline-entry ul { margin-top: 8px; }

.badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 22px;
}

.hero p { color: var(--text-dim); margin: 6px 0 0; max-width: 70ch; }

.notice {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--danger);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin: 14px 0;
  color: var(--text);
  font-size: 0.92rem;
  line-height: 1.55;
}
.notice a { color: var(--danger); }

.sources-list { columns: 2; font-size: 0.85rem; color: var(--text-dim); }
.sources-list li { margin-bottom: 6px; break-inside: avoid; }

footer.site-footer {
  border-top: 1px solid var(--border);
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.76rem;
  font-family: var(--font-mono);
}

.hidden { display: none !important; }

.empty-state {
  color: var(--text-dim);
  padding: 30px;
  text-align: center;
  font-style: italic;
}

@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .search-box input { min-width: 0; width: 100%; }
  .sources-list { columns: 1; }
}

</style>
</head>
<body>

      <h1>Once Human Database</h1>
      <span class="version-pill" id="version-pill">v—</span>
    </div>
    <div class="search-box">
      <input type="search" id="global-search" placeholder="Search everything… (weapons, mods, deviants, bosses…)" autocomplete="off">
    </div>
  </div>

</header>
<main id="main"></main>

<script>window.__OH_DATA = {"armor":{"overview":"Armor covers 6 body slots — Head, Face, Torso, Legs, Hands and Feet — and its core attributes are Max HP, Damage Reduction, Pollution Resistance and Psi Intensity, on top of a Durability stat that depletes as you take damage (an armor piece breaks and becomes unusable at 0 Durability, though it can be repaired). Wearing multiple pieces from the same named Armor Set grants stacking set bonuses at 2/4/6-piece thresholds that differ per set. Once Human's full armor catalog spans 159 pieces across 20 named sets (per oncehumandb.com).","attributes":[{"name":"Max HP","description":"Flat or percentage increase to maximum health; scales with rarity and using higher-rarity hides as crafting materials."},{"name":"Damage Reduction","description":"Percentage reduction to incoming damage; also scales with hide rarity used in crafting."},{"name":"Pollution Resistance","description":"Reduces the rate you accumulate Pollution/Mental Pollution in irradiated or RaidZone areas."},{"name":"Psi Intensity","description":"Boosts status-effect (Frost/Burn/Shock etc.) potency for the wearer."},{"name":"Durability","description":"Depletes as the piece absorbs damage; upgradeable via the Gear Workbench: Customization tech node for +30% Max Durability. Reaches 0 → the piece breaks until repaired."}],"craftingNote":"Armor is crafted at the same Gear Workbench tiers as weapons (see the Stations section) using hides, fabrics and other materials — higher-rarity hides yield better HP/Damage Reduction rolls on the finished piece.","sets":[{"name":"Bastille Set","rarity":"legendary","pieces":6,"bonusCount":4,"bonus":"+10% Weapon DMG while HP is above 70%, +15% Reload Efficiency. Crouching for 0.5s enters a Bastille state for +40% Weapon DMG, at the cost of disabled sprint and doubled stamina cost for 3s after leaving it. The 4-piece bonus stacks Armor after exiting Bastille (1/sec, up to 60), each stack converting to a 1% max-HP shield on re-entering Bastille.","playstyle":"Stationary high-damage turtling."},{"name":"Heavy Duty Set","rarity":"epic","pieces":6,"bonusCount":4,"bonus":"+10% Max HP, +8% Elemental DMG. Kills grant +20% Movement Speed for 2s and +40% Elemental DMG that decays over 8s.","playstyle":"Elemental/status build sustain and mobility."},{"name":"Lonewolf Set","rarity":"legendary","pieces":6,"bonusCount":4,"bonus":"Every 2 crits stack 'Lone Shadow' (+6% Crit DMG per stack, up to 10 stacks = +60% Crit DMG). Landing a kill grants +8% Crit Rate for 2 seconds.","playstyle":"Solo crit-focused DPS."},{"name":"Renegade Set","rarity":"legendary","pieces":6,"bonusCount":4,"bonus":"Hitting the same enemy repeatedly stacks 'Archer's Focus' (+4% Weakspot DMG per stack, up to 10). Reloading refunds 0.6% of the magazine per percentage of weakspot hits from the previous magazine, up to +30%.","playstyle":"Sustained single-target weakspot damage."},{"name":"Savior Set","rarity":"legendary","pieces":6,"bonusCount":4,"bonus":"Reduces Activator/medicine cooldowns; at 3 pieces, automatically uses an Activator when needed; at 4 pieces, gains increased agility and defense after using an Activator.","playstyle":"Survivability / self-sustain."},{"name":"Stormweaver Set","rarity":"legendary","pieces":6,"bonusCount":4,"bonus":"Taking damage builds 'Powered Armor' stacks (+4% DMG Reduction each, up to 6 = 24%); rolling consumes 3 stacks to trigger an explosion that knocks back nearby enemies and heals you.","playstyle":"Damage mitigation with an offensive panic button."},{"name":"Agent Set","rarity":"epic","pieces":6,"bonusCount":4},{"name":"Blackstone Set","rarity":"legendary","pieces":6,"bonusCount":4},{"name":"Blackstone Set (Cold)","rarity":"legendary","pieces":6,"bonusCount":4,"notes":"Cold-region variant of the Blackstone Set."},{"name":"Blackstone Set (Heat)","rarity":"legendary","pieces":6,"bonusCount":4,"notes":"Heat-region variant of the Blackstone Set."},{"name":"Blast Set","rarity":"rare","pieces":6,"bonusCount":4},{"name":"Falcon Set","rarity":"epic","pieces":6,"bonusCount":4},{"name":"Gravity Tide Set","rarity":"legendary","pieces":6,"bonusCount":2,"notes":"Tied to the Gravity Abyss season (patch 2.4.1)."},{"name":"Raid Set","rarity":"rare","pieces":6,"bonusCount":4},{"name":"Rustic Set","rarity":"uncommon","pieces":5,"bonusCount":4,"notes":"Early/cheap 5-piece set."},{"name":"Scout Set","rarity":"rare","pieces":6,"bonusCount":4},{"name":"Shelterer Set","rarity":"legendary","pieces":6,"bonusCount":4},{"name":"Snow Panther Set","rarity":"epic","pieces":6,"bonusCount":1},{"name":"Snowland Rustic Set","rarity":"uncommon","pieces":5,"bonusCount":4,"notes":"Winter-region Rustic Set variant."},{"name":"Treacherous Tides Set","rarity":"legendary","pieces":6,"bonusCount":3}],"note":"The full bonus text for the last 14 sets above wasn't confirmed by the sources used to compile this database — piece count and rarity are confirmed (per oncehumandb.com), but check oncehumandb.com/armor-sets or the in-game Codex for their exact set-bonus wording."},"blueprints":{"overview":"Blueprints are formulas that must be learned before you can craft a piece of furniture, a structure, or certain gear. Once learned, a blueprint appears under the 'Special' tab of your inventory and its item becomes placeable in Build Mode.","howToObtain":["Looting chests, dumpsters and cabinets in the world (lootable containers reset on a global timer, refreshing every 4 hours).","Disassembling unwanted or duplicate blueprints at the Designer's Workstation for Formula Blueprint Fragments, which can be redeemed for new ones.","Purchasing from the in-game Shop or seasonal Shop rotations.","Rewarded from Tech Tree nodes (Combat/Production/Building branches — many nodes directly unlock a blueprint, e.g. turrets, traps, storage crates and workbenches). Before April 2026 this was the Memetic Specialization system's Building and Crafting branches.","Deviant assistance — e.g. the Logging Beaver deviant can occasionally find furniture items while foraging."],"categories":[{"id":"furniture-decor","name":"Furniture & Decor","description":"Single-use or reusable decorative furniture for territory customization — beds, seating, lighting, storage displays.","examples":["Deluxe Storage Crate (64 slots)","Special Storage Crate (64 slots)","Bed: A Place to Call Home","Bed: Heat Preservation"],"unlockedBy":"A Building-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"workstations","name":"Workstations & Production","description":"Crafting facility blueprints that unlock or upgrade production buildings.","examples":["Gear Workbench: Customization","Custom Gear Workbench","Advanced Stove: Gourmand","Kitchen Set: Gourmand","Refining Facility: Smelting","Robotics Facility: Skilled Mechanician","Synthesis Bench: Recycle & Reuse"],"unlockedBy":"Production-branch Tech Tree nodes (previously Crafting/Management memetics); see the Stations section for the Gear Workbench and cooking-station tier progression these plug into."},{"id":"power-utility","name":"Power & Utility","description":"Generators and utility structures that support a base.","examples":["Generator: Electrical Expert","Biomass Generator: Sustained Output","Hydraulic Generator: One with the Tides","Hydropower Generator","Deviant Power Generator: Stardust Unleashed","Water Pump: Underground Pump","Portable Thermostat"],"unlockedBy":"A Production-branch Tech Tree node (previously the Memetic system's Management branch)."},{"id":"defense","name":"Defense — Turrets & Traps","description":"Territory defense structures unlocked via the Tech Tree's Combat branch.","examples":["Rifle Turret: Two Birds One Stone","Shotgun Turret: Volley Fire","Gatling Cannon: Power Blast","Portable MG Turret: Shadow Shift","Claymore Mine: Frost Trap","Claymore Mine: Warrior's Resolve","Flamethrower Trap: Kebob Party","Flamethrower Trap: Scorching Blast","Stardust Barrier: Hold the Line"],"unlockedBy":"A Combat-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"farming","name":"Farming & Agriculture","description":"Planter and irrigation blueprints for growing crops (see the Crops & Ranching section).","examples":["Planter Box: Greenhouse Planting","Growshroom (Deviant-assisted auto-planting)"],"unlockedBy":"A Survival/Production-branch Tech Tree node — originally the Planting memetic plus Management-branch upgrades like Planter Box: Greenhouse Planting."},{"id":"structural","name":"Structural — Walls, Roofs, Pillars","description":"Base-building material tiers with durability bonuses from the Tech Tree's Building branch.","examples":["Wood Structures: Tough Plant","Stone Structures: Intense Defense","Basic Defense: Battle-Hardened","Reinforced Structures"],"unlockedBy":"A Building-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"drones","name":"Rosetta Drones","description":"Deployable drone blueprints for gathering, combat, exploration and territory support.","examples":["Rosetta Gathering Drone","Rosetta Firepower Drone","Rosetta Exploration Drone","Rosetta Territory Drone"],"unlockedBy":"A Combat/Building-branch Tech Tree node (previously the Memetic system's Building branch)."}],"craftingStations":"See the Stations section for the Gear Workbench, cooking-station and utility-station tiers that many of the blueprints above are crafted at or unlock.","notableConstructionUpdate":"Patch 3.0.2 (July 22, 2026) added flexible snap-point switching for walls, ceilings, roofs, stairs and pillars, giving builders finer control when placing blueprints.","techSystemNotice":"The 'unlockedBy' notes below originally pointed to the old Memetic Specialization branches (Building/Crafting/Management), which were removed in the April 8, 2026 Tech System overhaul (patch 2.3.6). These blueprints are very likely still unlockable today, just through the Tech Tree's Combat/Production/Building branches instead — the specific branch and Tech Point cost per blueprint hasn't been independently re-verified post-overhaul."},"bosses":{"overview":"The main story/world bosses in Once Human are known as 'The Great Ones' — massive creatures forged from people mutated by Stardust, each guarding a Monolith in a different region of Nalcott and requiring a team to defeat efficiently. Beyond the Great Ones, seasonal Visional Wheel content adds rotating bosses (e.g. the Riftwalker in the Gravity Abyss season) and events add limited-time bosses (e.g. the Block Wanderer).","greatOnes":[{"id":"ravenous-hunter","name":"Ravenous Hunter","level":10,"location":"Monolith of Greed, Dayton Wetlands","mechanics":"Destroy its Gatling weapon to disable its shield, then stun it and hit the yellow head weak spot.","drops":"Burn-effect weapon mods (confirmed), plus early-game crafting materials and blueprint fragments."},{"id":"treant","name":"Treant","level":20,"location":"Gaia Cliff Monolith, Broken Delta","mechanics":"Destroy the surrounding vines first, target the female humanoid figure on its back, and dodge laser beams that telegraph with a red light.","drops":"Wood/plant-themed crafting materials and blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)"},{"id":"arachsiam","name":"Arachsiam","level":30,"location":"Mirage Monolith, Iron River","mechanics":"Avoid web-cocoon and rush attacks; focus the purple pustules on its back for maximum damage.","drops":"Mid-tier crafting materials and blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)"},{"id":"rabizex","name":"Rabizex","level":40,"location":"Monolith of Thirst, Chalk Peak","mechanics":"Keep distance, use powerful weapons on its weak points, and prioritize evasion since its movements are hard to predict up close.","drops":"Shrapnel and Bounce-effect weapon mods (confirmed), plus mid-to-late-tier crafting materials and blueprint fragments."},{"id":"mensdevoran","name":"Mensdevoran (The Forsaken Giant)","level":60,"location":"Forsaken Monolith, Red Sands","mechanics":"Jump over hand-slam shockwaves, stay close to its body to dodge sweeping arm attacks, and target glowing weak spots as they appear.","drops":"Endgame crafting materials and Advanced Gear Workbench blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)"}],"seasonalAndEventBosses":[{"id":"riftwalker","name":"Riftwalker","type":"Seasonal Aerial Boss","context":"Visional Wheel S4: Gravity Abyss (patch 2.4.1) — a massive aerial Deviant fought across zero-gravity floating islands.","drops":"Abyssal Cores (epic/legendary/mythic), Abyssal Essence, and the Aero/Downstar mods."},{"id":"block-wanderer","name":"Block Wanderer","type":"Limited-time Event Boss","context":"Block Adventure event on Wish Island (patch 3.0.3, Aug 5–23 2026) — defeat blocky creatures and challenge this boss for morphed Deviation rewards.","drops":"Morphed Deviations (Zapamander, Nutcracker and Dr. Teddy variants) plus Block Adventure event currency."}],"note":"Great Ones drop core weapon-effect mod sets (confirmed for Ravenous Hunter → Burn and Rabizex → Shrapnel/Bounce) alongside crafting materials and blueprint fragments — cross-reference the Mods section for what each weapon effect actually does. Drop tables for Treant, Arachsiam and Mensdevoran weren't available in the sources used to compile this database."},"builds":{"builds":[{"id":"shrapnel-crit","name":"Shrapnel Crit Build","archetype":"shrapnel","role":"PvE — Boss Killer","summary":"Once Human's premier build for destroying the Great Ones and general PvE. Bullets fragment to tear through multiple body parts; can be specced for crit, weakspot hits, or a no-reload playstyle.","suggestedWeapons":["compound-bow","kvd-boom-boom"],"suggestedMods":["Obliterate","Shatter Them All","Shield Breaker","Shrapnel Smash","Shrapnel Souvenir"]},{"id":"power-surge","name":"Power Surge Build","archetype":"power-surge","role":"PvE — Sustained DPS","summary":"Dump full magazines into enemies to trigger bursts of Electric damage. A well-optimized version can top out around 100,000 DPS without external buffs.","suggestedWeapons":["kam-abyss-glance"],"suggestedMods":["Shock Diffusion","Shock Rampage","Static Shock","Surge Amplifier"]},{"id":"frost-vortex","name":"Frost Vortex Build","archetype":"frost-vortex","role":"PvE — Boss Sustain","summary":"Excellent against big boss enemies — the vortex feeds you health while draining theirs, making it a strong solo/duo boss-clearing build.","suggestedWeapons":["aws338-bingo"],"suggestedMods":["Cryo Blast","Frosty Blessing","Shattering Ice","Vortex Multiplier"]},{"id":"bounce","name":"Bounce Build","archetype":"bounce","role":"PvE — Crowd Damage","summary":"An underrated build where projectiles ricochet between enemies; damage gets absurd in tight corridors or dense groups of mobs.","suggestedWeapons":["kvsbr-little-jaws"],"suggestedMods":["Bounce Rampage","Super Bullet","Targeted Bounce"]},{"id":"fast-gunner-lmg","name":"Fast Gunner LMG Build","archetype":"fast-gunner","role":"PvE/PvP — Sustained Fire","summary":"Buffs a gun's damage and fire rate the longer you shoot. Best on high-magazine LMGs — a properly built MG4 Predator can unload roughly 200 rounds before needing to reload.","suggestedWeapons":["mg4-predator"],"suggestedMods":["Cowboy","Double Gunner","Fast Refurbish","Lasting Fortification","Precision Rush","Shoot Out","Shooting Blitz"]}],"note":"Builds combine a weapon effect archetype, weapon(s), mods and memetic specializations into a cohesive loadout. See the Builds & Classes section for archetype summaries and the Mods section for full mod effect details."},"classes":{"overview":"Once Human has no fixed 'class' system — instead your playstyle is defined by which Weapon Effect (the combat archetype tied to your weapons/mods) and Tech Tree branch you build around. These act as the closest equivalent to classes.","techSystemNotice":"IMPORTANT MECHANIC CHANGE: the old 'Memetic Specialization' system described below (and in the Memetics tab) was completely removed in the Tech System overhaul (patch 2.3.6, April 8, 2026). There is no more separate specialization menu, no more level-gated 'choose 1 of 4 every 5 levels', and no more Cradle/Cipher/Meme Point currency. Those effects were folded into a single Tech Tree with four branches — Survival, Production, Combat and Building — unlocked via three methods: (1) Tech Tree Allocation, spending Tech Points earned from leveling up, researching facilities/items, exploring chests, or defeating Elites; (2) Reverse Engineering, using a research bench to unlock a formula directly from a collected cultural artifact; (3) Tech Invention, experimenting with material combinations at the research bench for a variable success rate. The Gathering/Crafting/Management/Building groupings below (and in Memetics) are this database's original functional categorization of what each node does — they are NOT the current official Tech Tree branch names, and this database has not independently verified which of the four current branches each individual node now lives in. Treat the node names and effects as still broadly accurate content, but check the in-game Tech Tree for the current branch placement and unlock cost of any specific one.","weaponEffectArchetypes":[{"id":"shrapnel","name":"Shrapnel","role":"PvE burst / boss killer","summary":"Bullets fragment for extra per-part damage; considered a top pick for melting the Great Ones and general PvE."},{"id":"power-surge","name":"Power Surge","role":"Sustained DPS","summary":"Dump full magazines to build stacking Electric/Shock damage; capable of ~100,000 DPS in optimized PvE builds."},{"id":"frost-vortex","name":"Frost Vortex","role":"Boss sustain / control","summary":"Creates damaging vortexes that also return health, excellent against big single targets while keeping you alive."},{"id":"bounce","name":"Bounce","role":"Crowd control / AoE","summary":"Projectiles ricochet between enemies; shines in corridors or dense enemy groups."},{"id":"fast-gunner","name":"Fast Gunner","role":"Sustained fire LMG playstyle","summary":"Rewards continuous firing and weapon-switching with stacking damage/reload buffs; pairs best with high-magazine LMGs like the MG4 Predator."},{"id":"burn","name":"Burn","role":"Damage-over-time","summary":"Stacking burn DoT that snowballs with mods that preserve or extend stacks on kill."},{"id":"unstable-bomber","name":"Unstable Bomber","role":"Burst explosive","summary":"Builds toward bomb-like detonations, scaling well with Crit Rate."},{"id":"fortress-warfare","name":"Fortress Warfare","role":"Territory / group defense","summary":"Buffs tied to structures and holding ground, strengthened by nearby teammates."},{"id":"marked","name":"Marked / Bull's Eye","role":"Team support / debuff","summary":"Marks targets to amplify incoming damage from the whole team."}],"currentTechBranches":[{"id":"survival","name":"Survival","focus":"Basic functionality and sustenance — the current official Tech Tree branch (post April 2026)."},{"id":"production","name":"Production","focus":"Crafting capacity and material processing — the current official Tech Tree branch (post April 2026)."},{"id":"combat","name":"Combat","focus":"Fighting capabilities and enemy engagement — the current official Tech Tree branch (post April 2026)."},{"id":"building","name":"Building","focus":"Base construction and expansion — the current official Tech Tree branch (post April 2026)."}],"memeticBranches":[{"id":"gathering","name":"Gathering","focus":"Improves the yield of materials collected in the wild (ore, wood, water, crystals). Legacy grouping, superseded by the Tech Tree — see the notice above."},{"id":"crafting","name":"Crafting","focus":"Upgrades workbenches and unlocks new craftable items, weapons and gadgets. Legacy grouping, superseded by the Tech Tree — see the notice above."},{"id":"management","name":"Management","focus":"Survival-oriented upgrades: generators, cooking, temperature control, farming infrastructure. Legacy grouping, superseded by the Tech Tree — see the notice above."},{"id":"building","name":"Building","focus":"Improves crafting/production facilities, defensive structures, turrets, traps and territory tools. Legacy grouping, superseded by the Tech Tree — see the notice above."}],"note":"The four groupings above (Gathering/Crafting/Management/Building) are this database's original functional categorization, kept so the specific node effects stay browsable — but as the notice above explains, as of April 8, 2026 the actual in-game system is a single Tech Tree with different branch names (Survival/Production/Combat/Building, listed just above) unlocked through Tech Points, Reverse Engineering and Tech Invention rather than character-level gating. See the Blueprints and Builds & Classes sections for how these tie into gear and loadouts."},"crops":{"overview":"Farming is unlocked via the 'Planting' Memetic Specialization in the Logistics/Management tree. Seeds are obtained by harvesting wild plants (or from growing your own crop). Plant seeds in loamy soil or a Planter Box, water with Boiled or Pure Water (Dirty Water lowers crop Vitality), and provide light — Irrigation Systems and Grow Lights can automate this. Harvest by interacting once growth reaches 100%. Deviated (mutated) Crops can drop from regular ones and are used in special high-value recipes.","howToFarm":["Unlock the Planting memetic specialization.","Gather seeds from wild plants or from harvested crops.","Plant in loamy soil or a Planter Box.","Water with Boiled/Pure Water and ensure adequate light.","Harvest at 100% growth for the crop plus a chance at bonus seeds or a Deviated (mutated) variant."],"crops":[{"id":"beets","name":"Beets","uses":"Refined into Sugar for Sanity Pills, Stardust Energy Drink, Shattered Bread, Assorted Canned Fruit.","foundNear":"Waterways near Deadsville and Meyer's Market","usedInRecipes":["Assorted Canned Fruit","Stardust Energy Drink","Lunar Gummy","Ginger Poppers","Fruity Sanity Capsule"]},{"id":"corn","name":"Corn","uses":"Refined into Corn Oil (Shattered Bread, Canned Seafood in Oil); fermented into Corn Ale.","foundNear":"Grassy/forested areas and farms like Citrus County","usedInRecipes":["Corn Soup","Corn Oil","Cornbread","Popcorn","Stardust Italian Soup Can","Roasted Vegetables"]},{"id":"wheat","name":"Wheat","uses":"Brewed into Malt Ale; used in Hug-in-a-Bowl and Croquettes.","foundNear":"Farms and roadsides, e.g. Citrus County","usedInRecipes":["Bread","Corn Soup","Curry and Ride","Hug-in-a-Bowl","Croquette","Safety Sandwich","Stargazy Pie","Snow Mushroom Fried Rice"]},{"id":"mushrooms","name":"Mushrooms","uses":"Crafted into Yield Boost and Mutation Boost fertilizers.","foundNear":"Wooded underbrush in Iron River","usedInRecipes":["Grilled Mushrooms","Bone-In Deviated Sausage","Mixed Fried Hot Dog","Spectral Canned Mushroom"]},{"id":"scarlet-calamus","name":"Scarlet Calamus","uses":"Creates Breeding Boost fertilizer to increase seed yield.","foundNear":"Shallow waterways","usedInRecipes":["Fruit Tea (herb variant)","Ice Tea (herb variant)","Securement Soup (herb variant)"]},{"id":"peppercorn","name":"Peppercorn","uses":"Creates Preserved Deviated Chops and Securement Soup.","foundNear":"Vendor Lacey at Blackfell (limited 3 seeds/week)","usedInRecipes":["Preserved Deviated Chops","Securement Soup","Fish & Chips","Roulette Dumplings"]},{"id":"cucumber","name":"Cucumber","uses":"Fermented into Pickles; Deviated variant used for Safety Sandwich.","foundNear":"Vendor Zhao Jintan at Meyer's Market (limited 3 seeds/week)","usedInRecipes":["Fat-Burning Juice","Bacon Burger","Canned Minty Meat","Signature Ice Brew","Safety Sandwich"]},{"id":"onions","name":"Onions","uses":"Croquette ingredient; Deviated variant yields Bacon Burger and can attract the Grumpy Bulb deviant.","foundNear":"Vendor Emma Potter at Tall Grass Inn (limited 3 seeds/week)","usedInRecipes":["Croquette","Bacon Burger","Stardust Italian Soup Can"]},{"id":"morel","name":"Morel","uses":"Canned Seafood in Oil, Borscht Deluxe, Yuanbao Dumplings.","foundNear":"Randomly dropped from containers in level 35+ areas","usedInRecipes":["Canned Seafood In Oil","Borscht Deluxe","Spectral Canned Mushroom"]},{"id":"aloe-vera","name":"Aloe Vera","uses":"Signature Ice Brew, Aloe Vera Ointment, Shattered Bread.","foundNear":"Rare finds in Red Sands and Blackheart regions","usedInRecipes":["Signature Ice Brew","Crumbly Bread","Honey Glazed Meat","Stardust Raspberry Shaved Ice","Stargazy Pizza"]}],"deviantHelpers":[{"name":"Buzzy Bee","helps":"Automatically plants crops and boosts mutation probability."},{"name":"Growshroom","helps":"Auto-plants seeds and accelerates crop growth."},{"name":"Rain Man","helps":"Enhances crop vitality and provides irrigation water."}],"livestockOverview":"Ranching is a separate system from Deviants: regular animals are captured live, tamed with feed (see the Food & Cooking section → Animal Feeds), and bred at a Youngling Hut once Tameness reaches 80-100%. Animals only produce byproducts (meat, wool, milk, hides) once Tameness is 50%+, and a territory can house a maximum of 6 ranched animals. Breeding 'chances' (how many times an animal can be bred) scale with its rarity tier: S-Tier gets 7, A/B-Tier get 6, C-Tier gets 5.","livestock":[{"name":"Ram","tier":"C","products":"Wool, meat"},{"name":"Rabbit","tier":"C","products":"Meat, hide"},{"name":"Deer","tier":"B","products":"Meat, milk (female), hide"},{"name":"Bear","tier":"A","products":"Meat, hide"},{"name":"Wolf","tier":"A","products":"Meat, hide"},{"name":"Capybara","tier":"B","products":"Meat, hide","notes":"Added in the 1.2 update."},{"name":"Flamingo","tier":"B","products":"Meat, feathers","notes":"Added in the 1.2 update."},{"name":"Leopard","tier":"S","products":"Meat, hide","notes":"Added in the 1.2 update; highest breeding-chance tier."}]},"deviants":{"overview":"Deviants are sentient creatures/objects mutated by Stardust that players can capture and bond with as companions. Each Deviant falls into one of three main purposes — Combat, Territory (utility/gathering), or Crafting (produces materials) — and grants passive or active abilities. Once Human's catalog includes 80+ Deviations (per oncehumandb.com); tags like (WoT) note ones introduced in the Way of Winter update and (PvP)/(PvE) note mode-specific abilities.","categories":["Combat","Territory","Crafting"],"deviants":[{"name":"Artisan's Touch","category":"Crafting","ability":"Instantly repairs the gear with the lowest durability."},{"name":"Atomic Lighter","category":"Crafting","ability":"Creates materials for explosive tactical items."},{"name":"Atomic Snail","category":"Crafting","ability":"Generates components for elixir crafting."},{"name":"Butterfly's Emissary","category":"Combat","ability":"Rushes enemies from range and marks weak points for amplified damage."},{"name":"Buzzy Bee","category":"Territory","ability":"Enhances plant mutation probability during cultivation; can auto-plant crops at a farm.","crossRef":"Boosts crop mutation odds and can auto-plant — see the Crops & Ranching section."},{"name":"By-The-Wind","category":"Combat","ability":"Generates gravity lifts for vertical movement and flight."},{"name":"Chefosaurus Rex","category":"Territory","ability":"Boosts effectiveness of food preparation at cooking stations.","crossRef":"Improves cooking station output — see the Stations section."},{"name":"Disco Ball","category":"Crafting","ability":"Produces materials that extend whim elixir duration."},{"name":"Dr. Teddy","category":"Combat","ability":"Heals allies and revives downed teammates (PvP)."},{"name":"Dreamcatcher","category":"Crafting","ability":"Creates components for cobweb trap elixirs."},{"name":"Electric Eel","category":"Territory","ability":"Increases generator power output capacity.","crossRef":"Boosts generator capacity — see the Stations and Blueprints sections."},{"name":"Enchanting Void","category":"Combat","ability":"Amplifies melee damage taken by affected targets (PvE)."},{"name":"Extradimensional Cat","category":"Territory","ability":"Accelerates health recovery during rest periods."},{"name":"Festering Gel","category":"Combat","ability":"Creates fortifications that block ranged attacks and heal allies."},{"name":"Fetch-A-Lot Bunny","category":"Territory","ability":"Automatically harvests shrubs and vegetation."},{"name":"Flame Essence","category":"Territory","ability":"Enhances furnace production efficiency."},{"name":"Frog the Leaper","category":"Crafting","ability":"Generates jumping-enhancement elixir materials."},{"name":"Gazocchio","category":"Territory/Crafting","ability":"Guards territory and produces shadow-dispelling items (Way of Winter)."},{"name":"Gingerbread House","category":"Territory","ability":"Produces materials for object transformation items."},{"name":"Growshroom","category":"Territory","ability":"Auto-plants seeds and accelerates crop growth.","crossRef":"Auto-plants seeds and speeds crop growth — see the Crops & Ranching section."},{"name":"Grumpy Bulb","category":"Combat","ability":"Disrupts enemy hostility, causing them to infight."},{"name":"H37","category":"Territory","ability":"Explores settlements and collects loot crate resources."},{"name":"Harveseed","category":"Crafting","ability":"Generates emergency health-restoration elixir materials."},{"name":"Hug-In-A-Bowl","category":"Crafting","ability":"Produces ingredients for sanity-restoring cuisine."},{"name":"Hydronaut Fish","category":"Territory","ability":"Gathers seawater and produces fish (Way of Winter)."},{"name":"Ice Pot","category":"Crafting","ability":"Creates materials for ice-based tactical items (Way of Winter)."},{"name":"Invincible Sun","category":"Combat","ability":"Releases blazing energy rays that cause burn damage (Way of Winter)."},{"name":"Lethal Rabbit","category":"Territory","ability":"Hunts animals and extracts resources from corpses."},{"name":"Logging Beaver","category":"Territory","ability":"Efficiently fells trees and harvests lumber; can occasionally find furniture items.","crossRef":"Can occasionally turn up furniture blueprints while foraging — see the Blueprints section."},{"name":"Lonewolf's Whisper","category":"Combat","ability":"Designates targets and spawns clones upon enemy defeat."},{"name":"Masonic Pyramid","category":"Crafting","ability":"Guarantees critical hits from stealth; alerts owner to aimed attacks (PvP)."},{"name":"Mini Feaster","category":"Combat","ability":"Summons tentacles that damage enemies and boost weapon damage."},{"name":"Mini Wonder","category":"Combat","ability":"Absorbs incoming bullets and provides ally buffs (duration/cooldown rebalanced in patch 3.0.2)."},{"name":"Mr. Wish","category":"Combat","ability":"Rapidly auto-fires a gun and marks targets with enhanced damage (PvP)."},{"name":"Nutcracker","category":"Territory","ability":"Patrols and defends territory with scaling attack power."},{"name":"Orb Lightning","category":"Crafting","ability":"Enhances turret performance via crafted lightning items."},{"name":"Paper Doll","category":"Territory","ability":"Repairs damaged structures and filters during territory maintenance."},{"name":"Party Monkey","category":"Crafting","ability":"Produces materials and self-repairs, though it attracts monster aggression."},{"name":"Polar Jelly","category":"Combat","ability":"Deals frost damage and reduces enemy movement speed."},{"name":"Pup Buddy","category":"Crafting","ability":"Generates weight-capacity-enhancement elixir components."},{"name":"Pyro Dino","category":"Combat","ability":"Launches AoE blaze attacks with burn potential (fire suppression significantly reduced in patch 3.0.2)."},{"name":"Rain Man","category":"Territory","ability":"Enhances crop vitality and provides irrigation water.","crossRef":"Irrigates and boosts crop vitality — see the Crops & Ranching section."},{"name":"Rebecca","category":"Territory","ability":"Summons a musician that accelerates deviation power recovery."},{"name":"Shattered Maiden","category":"Combat","ability":"Fears and freezes enemies during combat."},{"name":"Snapshot","category":"Combat","ability":"Photographs enemies to increase damage they receive from weapons (Way of Winter)."},{"name":"Snow Globe","category":"Crafting","ability":"Produces snowball materials that cause freeze effects (PvE)."},{"name":"Snowsprite","category":"Combat","ability":"Summons frost crystals that explode for frost damage (Way of Winter)."},{"name":"Space Turner","category":"Crafting","ability":"Creates teleportation keystones for relocating teammates."},{"name":"Strange Door","category":"Crafting","ability":"Generates portal materials enabling fast travel between locations."},{"name":"Tar Pudding","category":"Territory","ability":"Extracts crude oil and operates refining facilities (Way of Winter)."},{"name":"The Digby Boy","category":"Territory","ability":"Mines ore deposits once activated at high power; strong early-game pick.","crossRef":"Strong early-game ore gatherer, pairs with gathering-boosting Tech Tree nodes (originally the Memetic system's Gathering branch) — see the Memetics section."},{"name":"Upper World Spawn","category":"Crafting","ability":"Produces materials for temporary invulnerability items (PvP)."},{"name":"Voodoo Doll","category":"Combat","ability":"Shares damage between the player and a designated ally or enemy."},{"name":"Zeno-Purifier","category":"Combat","ability":"Teleports to perform melee attacks and grants the player teleportation."},{"name":"ZapCam","category":"Territory","ability":"Scans an area for enemies/loot (duration and range extended, cooldown increased in patch 3.0.2)."},{"name":"Zapamander","category":"Combat","ability":"Morphed Deviation earnable from the Block Adventure event (patch 3.0.3)."}],"captureMethod":{"wildCapture":"Spot a Deviant as a floating orb containing the creature in the world; interact (F) to attempt capture. Each failed attempt raises your success chance, but the Deviant escapes after 3 failed tries.","bindingCapsule":"Alternatively, craft a Binding Capsule (unlocked in the Memetics menu under Logistics) to capture a Deviant more reliably.","placement":"A captured Deviant only provides its ability once placed in an Isolated Securement Unit at your territory — build multiple units to run several Deviants at once.","power":"Each Deviant has a Deviant Power meter that depletes as it works; once empty it goes inactive until it recharges (time, or resources/feed depending on the Deviant).","cookingLink":"Securement Soup and Stardust Italian Soup Can (see the Food & Cooking section) both grant +1 Deviation capture ability level, making wild captures easier while active."}},"food":{"overview":"Food and drinks restore Energy, Hydration and Sanity and can grant a temporary buff on top. Most recipes are learned from paper recipe blueprints found in the world (kitchens, settlements) and cooked at a Stove, Electric Stove, or the endgame Kitchen Set / Integrated Kitchen (see the Stations section). Many recipes support swapping in a 'Deviated' (mutated) version of an ingredient for a stronger or different bonus effect.","categories":[{"name":"Beverages","recipes":[{"name":"Boiled Water","ingredients":["Dirty Water"],"effect":"Basic hydration; safe to drink unlike Dirty Water."},{"name":"Blueberry Juice","ingredients":["Blueberry"],"effect":"Energy restoration."},{"name":"Blueberry Soda","ingredients":["Blueberry","Glass"],"effect":"Carbonated refreshment."},{"name":"Orange Juice","ingredients":["Orange"],"effect":"Citrus refreshment."},{"name":"Orange Soda","ingredients":["Orange","Glass"],"effect":"Carbonated beverage."},{"name":"Hawthorn Juice","ingredients":["Hawthorn Berry"],"effect":"Light refreshment."},{"name":"Corn Soup","ingredients":["Corn","Wheat"],"effect":"Sustenance and hydration."},{"name":"Fat-Burning Juice","ingre atch (2.3.6) — the version most guides written before early 2026 describe (pure random drops, random sub-attributes) is out of date. Under the current system: a mod's level (1-17) is the sum of its individual sub-attribute levels, and those sub-attributes are now fixed per mod rather than randomized, so progress is predictable instead of a random re-roll grind. Past Lv. 17, players chase 'Shiny' variants of a mod — same sub-attributes, stronger main attribute. Acquisition mixes random and targeted: mods still drop from dungeons and game modes (higher difficulty = better odds at high-level mods), and separately, the Shop lets you redeem Mod Dust + Energy Links for a Random Mod Crate targeting a specific level range — so you can grind toward a mod tier deliberately instead of relying purely on drops.","groups":[{"effect":"Shrapnel","description":"Bullets fragment on impact, dealing extra damage per body part hit.","mods":[{"name":"Obliterate","effect":"Shrapnel damage increases 15% per part hit."},{"name":"Shatter Them All","effect":"Shrapnel damage increases 15% per part hit."},{"name":"Shield Breaker","effect":"Hitting shielded units increases Shrapnel DMG by 60% for 1 second."},{"name":"Shrapnel Smash","effect":"Shrapnel triggers increase Crit Rate by 1%, stackable 20x for 2 seconds."},{"name":"Shrapnel Souvenir","effect":"When Shrapnel hits a Weakspot, reloads 1 bullet from reserves."}],"obtainedFrom":"Confirmed boss drop: Rabizex at the Monolith of Thirst (Chalk Peak). Also found in general Weapon Crates and Silo caches. Also obtainable in a targeted way via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate."},{"effect":"Power Surge","description":"Shots build stacks of Electric/Shock damage, exploding into a burst.","mods":[{"name":"Shock Diffusion","effect":"Power Surge spreads Shock to nearby units within 5 meters."},{"name":"Shock Rampage","effect":"Power Surge damage increases trigger factor by 10%, stackable 3x."},{"name":"Static Shock"," ier Souvenir","effect":"Triggering Unstable Bomber reloads 15% of the magazine."},{"name":"Decisive Blow","effect":"After a bullet hits a Weakspot, Unstable Bomber DMG +15% for 3 seconds."},{"name":"Heavy Explosives","effect":"Unstable Bomber impacts enemies with additional area damage."},{"name":"Reckless Bomber","effect":"For every 1% Crit Rate, Unstable Bomber DMG +0.5%."},{"name":"Super Charged","effect":"Unstable Bomber damage increases 5% per trigger, stackable 6x."}],"obtainedFrom":"Dungeons and game modes (higher difficulty = better odds at high-level copies), or targeted via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate. (No specific boss source confirmed by available sources.)"},{"effect":"Fast Gunner","description":"Rewards sustained fire and weapon switching with damage/reload buffs.","mods":[{"name":"Cowboy","effect":"Reloading boosts Fast Gunner trigger factor by 100% for 5 seconds."},{"name":"Double Gunner","effect":"Fast Gunner weapon switching increases first 6 bullets' damage by 30%."},{"name":"Fast Refurbish","effect":"Fast Gunner triggers Reload Speed +30% for 5 seconds, stackable 3x."},{"name":"Lasting Fortification","effect":"Fast Gunner max stacks increase by 1, each granting 5% Weapon DMG."},{"name":"Precision Rush","effect":"Fast Gunner rapid firing increases Weakspot DMG up to +45% over 3 seconds."},{"name":"Shoot Out","effect":"Fast Gunner grants Weapon DMG +1.5% for 10 seconds, stackable 20x."},{"name":"Shooting Blitz","effect":"Fast Gunner duration +4 seconds, Weapon DMG +15% during activation."}],"obtainedFrom":"Dungeons and game modes (higher difficulty = better odds at high-level copies), or targeted via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate. (No specific boss source confirmed by available sources.)"},{"effect":"Bounce","description":"Projectiles ricochet between enemies, excelling against groups.","mods":[{"name":"Bounce Rampage","effect":"Bounce damage increases up to 45% based on target count."},{"name":"Not Throw Away Your Shot","effect":"Bounces hit allies without damage, recovering 1 bullet."},{"name":"Super Bullet","effect":"Bounce Crit Rate +10%, Bounce Crit DMG +25%."},{"name":"Targeted Bounce","effect":"Bounce is 300% more likely to hit a Weakspot."}],"obtainedFrom":"Confirmed boss drop: Rabizex at the Monolith of Thirst (Chalk Peak). Also found in general Weapon Crates and Silo caches. Also obtainable in a targeted way via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate."},{"effect":"Fortress Warfare","description":"Territory/turtling-oriented effect tied to structures and sustained fights.","mods":[{"name":"Durable Territory","effect":"Defeating enemies extends Fortress Warfare duration, up to 5 times."},{"name":"Final Territory","effect":"After Fortress Warfare ends: Weapon DMG +10%, Movement Speed +10%."},{"name":"Portable Territory","effect":"After leaving Fortress Warfare, the status remains for 2 seconds."},{"name":"United We Stand","effect":"Fortress Warfare damage bonus increases with nearby players, up to 40%."}],"obtainedFrom":"Dungeons and game modes (higher difficulty = better odds at high-level copies), or targeted via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate. (No specific boss source confirmed by available sources.)"},{"effect":"Marked / Bull's Eye","description":"Marking enemies for bonus team damage.","mods":[{"name":"Hunters Perk","effect":"DMG dealt by Marked enemies against Metas is decreased by 20% (defensive utility)."},{"name":"Recover Mark","effect":"Defeating marked enemies grants HP +15%, Stamina +25%."},{"name":"Spreading Marks","effect":"Defeated marked enemies transfer their status to nearby enemies within 15m."},{"name":"Vulnerability Amplifier","effect":"Increases Bull's Eye Vulnerability effect by 8%."}],"obtainedFrom":"Dungeons and game modes (higher difficulty = better odds at high-level copies), or targeted via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate. (No specific boss source confirmed by available sources.)"}],"howToFarm":["Dungeons and game modes — mods drop directly from completing them, with higher difficulty giving better odds at high-level mods.","Monolith bosses (the Great Ones) sometimes favor a specific weapon-effect mod on death — confirmed for Ravenous Hunter (Burn) and Rabizex (Shrapnel/Bounce); see the Bosses section.","Shop → redeem Mod Dust + Energy Links for a Random Mod Crate targeting a specific level range — the game's 'targeted acquisition' path introduced in the Jan 21, 2026 mod system overhaul, so you're not purely at the mercy of random drops.","Mods now level via fixed sub-attributes (1-17 total); past Lv. 17 the chase becomes finding a 'Shiny' variant with a stronger main attribute instead of re-rolling sub-attributes."]},"regions":{"overview":"Once Human's world (Nalcott) is divided into major regions, each centered on a Stronghold and gated by recommended enemy level. Later seasons add separate Visional Worlds / Strange Worlds layered on top of the base map.","manibus":{"name":"Manibus (Evolution's Call)","areas":[{"stronghold":"Deadsville","biome":"Swampland & farmland","levelRange":"1-10","notes":"Starting area after the prologue."},{"stronghold":"Meyer's Market","biome":"Fishing town, industrial area, forest","levelRange":"6-10"},{"stronghold":"Greywater Camp","biome":"River and cliffs","levelRange":"20-30"},{"stronghold":"Tall Grass Inn","biome":"Forest and mountains (bears)","levelRange":"30-40","notes":"The largest area."},{"stronghold":"Blackfell","biome":"Desert city with military bases","levelRange":"40+","notes":"Final Stronghold of the region."}]},"otherNotableAreas":[{"name":"Broken Delta","notes":"Home to the Gaia Cliff Monolith and the Treant boss."},{"name":"Iron River","notes":"Home to the Mirage Monolith and the Arachsiam boss."},{"name":"Chalk Peak","notes":"Home to the Monolith of Thirst and the Rabizex boss; terrain adjusted near here in patch 2.4.1."},{"name":"Red Sands","notes":"Home to the Forsaken Monolith and Mensdevoran."},{"name":"Blackheart","notes":"Rare plant-gathering region."}],"specialWorldsAndScenarios":[{"name":"Way of Winter","type":"Seasonal Visional World","notes":"Added winter-themed Deviants (tagged WoT in this database) and mechanics."},{"name":"Gravity Abyss (Visional Wheel S4)","type":"Seasonal Visional World","notes":"Zero-gravity combat across floating islands; home of the Riftwalker boss. Added in patch 2.4.1."},{"name":"Pixel-Style Strange World / Block Island / Wish Island","type":"Strange World event","notes":"A blocky, pixel-art version of Nalcott; setting for the Block Adventure event in patch 3.0.3."},{"name":"Eternaland","type":"Endgame Scenario","notes":"Endgame scenario/mode referenced alongside Endless Dream and Evolution's Call."},{"name":"Endless Dream","type":"PvE Scenario"}]},"stations":{"overview":"Crafting stations gate what tier of gear, food or blueprint you can produce. Most stations upgrade through 2-4 tiers.","techSystemNotice":"IMPORTANT MECHANIC CHANGE: the unlock descriptions below originally cited the old Memetic system's Cradle screen and Cipher/Meme Point currency. That system was removed in the Tech System overhaul (patch 2.3.6, April 8, 2026) — stations are now unlocked through the Tech Tree instead (Tech Points from leveling/research/exploration/Elite kills, Reverse Engineering of cultural artifacts, or Tech Invention at a research bench; see the Builds & Classes tab). This database has not independently re-verified the exact current Tech Tree node/cost for each station below, so treat unlock details as approximate pre-overhaul context, not current costs. Separately, that same patch removed five intermediate-tier facilities outright — Intermediate Supplies Workbench, Intermediate Weapons Bench, Intermediate Garage, Small Synthesis Bench, and Intermediate Stove — folding their crafting formulas into the corresponding Advanced-tier facility and moving that facility's unlock earlier in the tree. The 'Electric Stove' entry below may correspond to the now-removed Intermediate Stove; its recipes are likely reachable straight from an Advanced Stove / Kitchen Set today. Crafting materials were also simplified game-wide around the same update: most fabric types collapsed into a single Cotton Fabric, parts into Standard Parts, and plastics into All-Purpose Plastic, and rare metal crystals are no longer a mandatory gear-crafting ingredient — so treat the specific material lists below as illustrative rather than exact current recipes.","weaponAndGearStations":[{"id":"gear-workbench","name":"Gear Workbench","tier":"I-II","unlock":"Early Tech Tree node (Production branch, expected). Pre-overhaul this required unlocking 'Essential Tools' then the Gear Workbench line in the old Memetics menu.","materials":["Copper Ingots","Standard Parts","Cotton Fabric","Adhesives"],"produces":"Tier I-II weapons and armor (given the blueprint + materials)."},{"id":"intermediate-gear-workbench","name":"Intermediate Gear Workbench","tier":"III-IV","unlock":"Not confirmed among the facilities removed in the April 2026 overhaul, so likely still exists as a Production-branch Tech Tree node — exact placement unconfirmed.","produces":"Tier III-IV weapons and armor."},{"id":"advanced-gear-workbench","name":"Advanced Gear Workbench","tier":"V (max)","unlock":"A Production-branch Tech Tree node; the April 2026 overhaul moved advanced-facility unlocks earlier in the tree specifically so players reach full crafting capability sooner. Exact current Tech Point cost unconfirmed.","materials":["Tungsten Ingots"],"produces":"Tier V weapons and armor (top tier), plus all lower tiers."},{"id":"designers-workstation","name":"Designer's Workstation","tier":"Utility","unlock":"Building-branch Tech Tree node (approximate).","produces":"Disassembles unwanted/duplicate blueprints into Formula Blueprint Fragments, redeemable for new blueprints."}],"cookingStations":[{"id":"stove","name":"Stove","tier":"I (basic)","produces":"Basic dishes (Roasted Meat, Grilled Fish, breads, simple soups)."},{"id":"electric-stove","name":"Electric Stove","tier":"II","unlock":"Likely superseded: 'Intermediate Stove' was one of five facilities removed outright in the April 2026 Tech System overhaul, with its recipes folded into the Advanced Stove. If this station is still distinct from that, its current Tech Tree unlock path (Survival branch, expected) is unconfirmed.","produces":"Advanced recipes, including Sanity Gummies."},{"id":"refrigerator","name":"Refrigerator","tier":"Utility","produces":"Extends food shelf life; required for certain legendary recipes."},{"id":"integrated-kitchen","name":"Integrated Kitchen / Kitchen Set","tier":"IV (max)","unlock":"A Survival/Production-branch Tech Tree node (approximate) — the best cooking station in the game. Exact current unlock cost unconfirmed post-overhaul.","produces":"The best cooking station in the game — unlocks Caviar and Butter as ingredients plus the Kitchen Set blueprint (which unlocks the Advanced Stove and further recipes)."}],"otherStations":[{"id":"planter-box","name":"Planter Box","produces":"Grows crops from seeds — see the Crops & Ranching section.","upgrade":"A Tech Tree node (Production/Survival branch, expected) increases growth speed/yield per temperature degree."},{"id":"isolated-securement-unit","name":"Isolated Securement Unit","produces":"Houses a captured Deviant so its ability becomes active — see the Deviants section."},{"id":"youngling-hut","name":"Youngling Hut","produces":"Where bred livestock offspring grow up — see the Crops & Ranching section."}]},"updates":{"current":{"version":"3.0.3","date":"2026-08-05","title":"Block Adventure & Console Launch Prep","note":"As of compile date 2026-08-19/20 this is the live version; a 3.0.3 bug-fix pass landed Aug 18, the Aug 12 patch added the Summer Echoes furniture pack (Golden Shore Pool), and a Shop-adjustments dev blog + Fair Play ban report (232 accounts, Aug 7-13) were posted Aug 19. A refund-feedback window for Summer Echoes closes Aug 19 09:00 PT with compensation by Aug 21. Two things are scheduled next: a new update on Aug 24, 4:00 PM PT, and the console (PlayStation/Xbox) launch on Aug 25, 10:00 AM PT with cross-platform account linking to carry over PC/mobile progress. Check the official news page (linked in the Sources section) for whatever landed after this was compiled."},"history":[{"version":"3.0.3","date":"2026-08-05","highlights":["Limited-time 'Block Adventure' event on Wish Island (Aug 5-23): fight blocky creatures, challenge the Block Wanderer boss, earn morphed Deviations (Zapamander, Nutcracker & Dr. Teddy variants).","Online Trading overhaul: purchase-order buying requests, reduced bind times, watchlist expanded to 20 items, trading extended to ingots, formulas, cosmetic fish and animals.","New Permanent Server Monthly Challenges with mod-acquisition rewards via Scenario Honor (30-day reset).","Console launch support announced for Aug 25 with cross-platform account linking (PC/mobile/console).","Custom Server territory settings now customizable per user role.","Lightforge Loot Crate 'Dreamtide' (mythic skins, legendary cosmetics); Block World crossover and Midsummer Fizz shop items.","First-person mode optimizations, fishing mechanic clarifications, tech interface improvements, misc. bug fixes."]},{"version":"3.0.2","date":"2026-07-22","highlights":["Territory Construction: flexible snap-point switching for walls, ceilings, roofs, stairs and pillars.","Account-wide appearance preset sharing across characters/scenarios (12-preset limit per gender).","New Item Lock system to prevent accidental discard/trade/disassembly of valuable items.","RaidZone: Mental Pollution — new zones drain mentality over time, offset by gear's Mental Resistance stat; 4 new survival suits trade defense for mental resistance.","RaidZone farming & breeding enhancements: rare plant harvesting, preferred food rewards for livestock.","Custom Server overhaul: server recommendations, exclusive gameplay tags, custom dungeon settings, benefit event (Jul 23-Aug 20).","Lightforge Loot Crate summer return (5 themes); new furniture/facility skin packs (Jul 29).","Balance: ZapCam duration/range up, cooldown up; Mini Wonder duration down, cooldown up; Pyro Dino fire suppression heavily nerfed; SN700-Finale reverb stacks reduced to 4 with adjusted damage scaling."]},{"version":"2.4.1","date":"2026-05-27","highlights":["Visional Wheel S4: Gravity Abyss — zero-gravity combat across floating islands; new Riftwalker aerial boss; Gravity Imbalance exploration, Riftwalker Relic collection, Aerial Hunt, Gravity Integrator challenge modes.","New Wishlist system for shop items with privacy controls; enhanced gifting with friend sorting, personal messages, duplicate-prevention refunds.","New rewards: Abyssal Cores (epic/legendary/mythic), Abyssal Essence, 3 new Morphed Deviations, Aero & Downstar mods, armor Shiny Mods.","Balance: AUG-Electron Cloud flexibility changed; Compound Bow-The Burden of Betrayal damage consistency/burst adjusted; Glide Pants stamina consumption changed.","Terrain adjustments west of Chalk Peak required territory relocation for affected players.","Meta Pass monthly cosmetic rotations; Custom Server 'Special Drops' mode; wedding-themed and carnival shop packs."]},{"version":"2.3.8","date":"2026-05-13","highlights":["Weapon Customization system: freely customize weapon stats and mix-and-match dozens of newly designed weapon traits."]},{"version":"2.3.6","date":"2026-04-08","highlights":["MAJOR MECHANIC CHANGE — Tech System overhaul: the entire Memetic Specialization system (level-gated, choose-1-of-4-every-5-levels, Cradle/Cipher/Meme Points) was removed and replaced by a single Tech Tree with four branches — Survival, Production, Combat, Building.","New unlock methods: Tech Tree Allocation (Tech Points from leveling, facility research, chest exploration, defeating Elites), Reverse Engineering (unlock a formula from a collected cultural artifact at a research bench), and Tech Invention (experiment with material combinations at a research bench for a variable success rate).","Product/material simplification: most fabric types collapsed into Cotton Fabric, parts into Standard Parts, plastics into All-Purpose Plastic; rare metal crystals no longer mandatory for gear crafting.","Removed 5 intermediate-tier crafting facilities (Intermediate Supplies Workbench, Intermediate Weapons Bench, Intermediate Garage, Small Synthesis Bench, Intermediate Stove) and folded their formulas into the corresponding Advanced-tier facility, moving that facility's unlock earlier in the tree.","New terraforming feature for Eternaland; refined the mod recovery period to 7 days (see the 2026-01-21 mod system entry below)."]},{"version":"n/a (dev blog + live change)","date":"2026-01-21","highlights":["MAJOR MECHANIC CHANGE — Mod System Overhaul: mods gained fixed sub-attributes (no more random rolls); a mod's level (1-17) is now the sum of its sub-attribute levels, and past Lv. 17 players chase 'Shiny' variants (same sub-attributes, stronger main attribute) instead of re-rolling.","Added targeted mod acquisition: redeem Mod Dust + Energy Links at the Shop for a Random Mod Crate targeting a specific level range, alongside the existing dungeon/game-mode drop sources.","Compensation crates (e.g. Shiny Mod Selection Crate) issued to players with many Lv. 17 mods from the old system."]}],"majorContentEras":[{"name":"Launch / Evolution's Call","notes":"Base game and the Manibus region."},{"name":"Way of Winter","notes":"Winter-themed seasonal Visional World."},{"name":"Mod System Overhaul","notes":"Fixed sub-attributes + targeted acquisition replacing the old random-roll mod system, live from Jan 21, 2026."},{"name":"Tech System Overhaul","notes":"Replaced the old Memetic Specialization system with a single 4-branch Tech Tree (Survival/Production/Combat/Building), patch 2.3.6, April 8, 2026 — see the notice on the Builds & Classes and Memetics tabs."},{"name":"Gravity Abyss (Visional Wheel S4)","notes":"Zero-gravity seasonal content, patch 2.4.1."},{"name":"Pixel-Style Strange World","notes":"Block Island / Wish Island blocky pixel-art world, tied to the 3.0.x patch line and the Block Adventure event."}]},"weapons":{"weaponTypes":[{"id":"pistol","name":"Pistol","description":"Sidearm-class weapons; fast swap, moderate damage, common as a backup slot."},{"id":"smg","name":"Submachine Gun (SMG)","description":"High fire-rate, close-range weapons with fast reloads."},{"id":"assault-rifle","name":"Assault Rifle","description":"Balanced mid-range weapons, the most versatile weapon class."},{"id":"shotgun","name":"Shotgun","description":"Multi-pellet, high burst-damage weapons for close range."},{"id":"sniper-rifle","name":"Sniper Rifle","description":"High single-shot damage, long range, weakspot-focused."},{"id":"lmg","name":"Light Machine Gun (LMG)","description":"Large magazines and sustained fire, pairs well with the Fast Gunner effect."},{"id":"bow","name":"Bow / Crossbow","description":"Silent, high per-shot damage ranged weapons, often crit-focused."},{"id":"heavy","name":"Heavy Weapon","description":"Grenade/rocket launchers and other explosive/AoE weapons."},{"id":"melee","name":"Melee Weapon","description":"Close-quarters weapons such as batons, blades, axes and pikes."}],"rarities":[{"id":"standard","name":"Standard","color":"Grey/Green"},{"id":"rare","name":"Rare","color":"Blue"},{"id":"epic","name":"Epic","color":"Purple"},{"id":"legendary","name":"Legendary","color":"Gold"}],"weapons":[{"id":"de50","name":"DE.50","type":"pistol","rarity":"rare","notes":"Base pistol chassis that named legendary variants are built from.","craftingStation":"gear-workbench","acquisition":"Craft at a Gear Workbench (Tier I-II) once you have its blueprint; blueprints for this tier drop commonly from containers and lo
