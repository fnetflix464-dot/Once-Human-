<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once Human Database</title>
<meta name="description" content="Unofficial community database for Once Human — weapons, mods, blueprints, builds, tech tree, deviants, ranching, crops, bosses, regions and patch history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Irradiated-wasteland palette: warm scorched-earth ground, ember/rust primary, corroded-stardust teal secondary */
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
  --radius: 3px;
  --maxw: 1180px;
  --font-display: "Rajdhani", "Segoe UI", sans-serif;
  --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: var(--font-body);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f1e6;
    --bg-alt: #efe6d4;
    --card: #fffcf5;
    --card-hover: #fbf3e2;
    --border: #ddccaa;
    --border-soft: #e7dabf;
    --text: #241b13;
    --text-dim: #6e5c43;
    --accent: #aa4c1f;
    --accent-soft: #a5461a;
    --accent-2: #157a67;
    --danger: #b23f31;
  }
}

:root[data-theme="light"] {
  --bg: #f6f1e6;
  --bg-alt: #efe6d4;
  --card: #fffcf5;
  --card-hover: #fbf3e2;
  --border: #ddccaa;
  --border-soft: #e7dabf;
  --text: #241b13;
  --text-dim: #6e5c43;
  --accent: #aa4c1f;
  --accent-soft: #a5461a;
  --accent-2: #157a67;
  --danger: #b23f31;
}

:root[data-theme="dark"] {
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100vh;
  line-height: 1.5;
  font-family: var(--font-body);
}

h1, h2, h3, nav.tabs button, .version-pill {
  font-family: var(--font-display);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header.site-header {
  background: linear-gradient(180deg, var(--bg-alt), var(--bg));
  border-bottom: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  padding: 18px 20px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(6px);
}

.header-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.brand .version-pill {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--bg);
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 2px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-box input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius);
  min-width: 240px;
  font-size: 0.88rem;
  font-family: var(--font-body);
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

nav.tabs {
  max-width: var(--maxw);
  margin: 14px auto 0;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  padding-bottom: 0;
  scrollbar-width: thin;
}

nav.tabs button {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 9px 14px 10px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

nav.tabs button:hover { background: var(--card); color: var(--text); }

nav.tabs button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--card);
}

main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.panel { display: none; }
.panel.active { display: block; }

.panel h2 {
  margin-top: 0;
  font-size: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}

.panel > p.intro {
  color: var(--text-dim);
  max-width: 800px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-top-color 0.15s, background 0.15s;
}

.card:hover {
  border-top-color: var(--accent);
  background: var(--card-hover);
}

.card-link {
  cursor: pointer;
}
.card-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card-link h3 {
  text-decoration-line: none;
}
.card-link:hover h3 {
  text-decoration: underline;
  text-decoration-color: var(--accent);
}

.breadcrumb {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 12px;
}
.breadcrumb .sep { margin: 0 4px; opacity: 0.6; }
.breadcrumb span:last-child { color: var(--text); }

.back-link {
  display: inline-block;
  margin-top: 28px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  width: 100%;
  font-size: 0.86rem;
  font-weight: 600;
}

.card h3 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
}

.card .meta {
  font-size: 0.74rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.tag {
  display: inline-block;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  padding: 1px 8px;
  border-radius: 2px;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.tag.tier-S { color: var(--accent-soft); border-color: var(--accent-soft); }
.tag.tier-A { color: var(--accent-2); border-color: var(--accent-2); }

.card p { margin: 4px 0; font-size: 0.88rem; color: var(--text); }
.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--text-dim); }

.table-wrap { overflow-x: auto; }

table.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}

table.data-table th, table.data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

table.data-table th {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
  background: var(--bg);
}

table.data-table tbody tr:hover { background: var(--bg-alt); }

.section-block {
  margin-top: 28px;
}

.section-block h3 {
  color: var(--accent-2);
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 6px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.timeline-entry {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 24px;
  position: relative;
}

.timeline-entry::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}

.timeline-entry h3 { margin: 0 0 2px; color: var(--text); }
.timeline-entry .date { color: var(--text-dim); font-size: 0.8rem; }
.timeline-entry ul { margin-top: 8px; }

.badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 22px;
}

.hero p { color: var(--text-dim); margin: 6px 0 0; max-width: 70ch; }

.notice {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--danger);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin: 14px 0;
  color: var(--text);
  font-size: 0.92rem;
  line-height: 1.55;
}
.notice a { color: var(--danger); }

.sources-list { columns: 2; font-size: 0.85rem; color: var(--text-dim); }
.sources-list li { margin-bottom: 6px; break-inside: avoid; }

footer.site-footer {
  border-top: 1px solid var(--border);
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.76rem;
  font-family: var(--font-mono);
}

.hidden { display: none !important; }

/* Small reusable spacing utilities — used instead of one-off inline styles
   for the handful of margin tweaks that recur across detail pages. */
.detail-meta { margin-bottom: 10px; }
.intro-tight { margin-top: 0; }
.mt-lg { margin-top: 16px; }
.mt-xs { margin: 4px 0 0; }
.mb-sm { margin-bottom: 6px; }

.empty-state {
  color: var(--text-dim);
  padding: 30px;
  text-align: center;
  font-style: italic;
}

@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .search-box input { min-width: 0; width: 100%; }
  .sources-list { columns: 1; }
}

/* ======================================================================
   Accessibility basics
   ====================================================================== */

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: var(--bg);
  padding: 10px 16px;
  z-index: 100;
  font-weight: 600;
  border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus {
  left: 0;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

/* ======================================================================
   Header brand link, menu toggle
   ====================================================================== */

a.brand, a.brand:hover {
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 1.1rem;
  line-height: 1;
  padding: 6px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-right: 8px;
}

/* ======================================================================
   Grouped navigation (desktop dropdowns)
   ====================================================================== */

nav.nav-groups {
  max-width: var(--maxw);
  margin: 14px auto 0;
  display: flex;
  gap: 4px;
  padding-bottom: 10px;
}

.nav-group { position: relative; }

.nav-group-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 9px 14px 10px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  font-family: var(--font-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.nav-group-btn:hover, .nav-group-btn.is-active-group { color: var(--accent); background: var(--card); }
.nav-group-btn::after { content: " ▾"; font-size: 0.7em; opacity: 0.7; }

.nav-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 0 0 var(--radius) var(--radius);
  min-width: 200px;
  z-index: 30;
  flex-direction: column;
  padding: 6px 0;
}
.nav-group-btn[aria-expanded="true"] + .nav-dropdown { display: flex; }

.nav-item {
  display: block;
  padding: 8px 16px;
  color: var(--text);
  font-size: 0.86rem;
  text-decoration: none;
  white-space: nowrap;
}
.nav-item:hover { background: var(--bg-alt); text-decoration: none; color: var(--accent); }
.nav-item[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* ======================================================================
   Mobile drawer
   ====================================================================== */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 39;
}

.mobile-drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: min(84vw, 320px);
  background: var(--bg-alt);
  border-right: 1px solid var(--border);
  z-index: 40;
  overflow-y: auto;
  padding-bottom: 30px;
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
}
.drawer-close {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
}
.drawer-home { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-soft); }
.drawer-group { padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
.drawer-group-label {
  padding: 6px 16px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
}
.mobile-drawer .nav-item { padding: 10px 16px; }

@media (max-width: 860px) {
  .menu-toggle { display: inline-flex; align-items: center; }
  nav.nav-groups { display: none; }
}
@media (min-width: 861px) {
  .drawer-backdrop, .mobile-drawer { display: none !important; }
}

/* ======================================================================
   Global search results dropdown
   ====================================================================== */

.search-box { position: relative; }

.search-results {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: min(420px, 92vw);
  max-height: 70vh;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: var(--radius);
  z-index: 50;
  padding: 6px 0;
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
}

.search-group { padding: 4px 0; }
.search-group + .search-group { border-top: 1px solid var(--border-soft); }
.search-group-label {
  padding: 6px 14px 2px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
}
.search-result {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 14px;
  color: var(--text);
  text-decoration: none;
  font-size: 0.88rem;
}
.search-result:hover, .search-result:focus-visible, .search-result.is-active { background: var(--bg-alt); text-decoration: none; }
.search-result.is-active { outline: 1px solid var(--accent); outline-offset: -1px; }
.search-result-sub { color: var(--text-dim); font-size: 0.76rem; white-space: nowrap; }
.search-empty { padding: 14px; color: var(--text-dim); font-style: italic; font-size: 0.86rem; }

/* ======================================================================
   Filter / sort bar
   ====================================================================== */

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 12px;
  background: var(--bg-alt);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin: 14px 0;
}

.filter-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 0.72rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.filter-field select {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 8px;
  font-size: 0.85rem;
  font-family: var(--font-body);
  text-transform: none;
  min-width: 140px;
}

.filter-clear {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius);
  padding: 7px 12px;
  font-size: 0.78rem;
  cursor: pointer;
  height: fit-content;
}
.filter-clear:hover { color: var(--danger); border-color: var(--danger); }

/* ======================================================================
   Cards: top row (icon/checkbox/favorite), rarity, PvE/PvP, obtain badges
   ====================================================================== */

.card-top-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.card-top-row h3 { margin: 0; }
.card-top-row .fav-btn { margin-left: auto; }

.stat-card { cursor: pointer; text-align: left; width: 100%; }
.stat-value { font-size: 1.8rem; color: var(--accent-2); margin: 0; }

.fav-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
}
.fav-btn.is-fav { color: var(--accent-soft); }
.fav-btn:hover { color: var(--accent); }

.type-icon {
  width: 22px;
  height: 22px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.rarity-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--text-dim);
}
.rarity-dot.rarity-standard { background: #9a9a9a; }
.rarity-dot.rarity-rare { background: #5b9bd5; }
.rarity-dot.rarity-epic { background: #b06fd6; }
.rarity-dot.rarity-legendary { background: var(--accent-soft); }

.tag-pvp-pve { color: var(--accent-2); border-color: var(--accent-2); }
.tag-pvp-pvp { color: var(--danger); border-color: var(--danger); }
.tag-pvp-both { color: var(--accent-soft); border-color: var(--accent-soft); }
.tag-pvp-unspecified { opacity: 0.7; }

.tag-obtain { color: var(--accent-2); }

.tag-change-new { color: var(--accent-2); border-color: var(--accent-2); }
.tag-change-changed { color: var(--accent-soft); border-color: var(--accent-soft); }
.tag-change-removed { color: var(--danger); border-color: var(--danger); }
.tag-change-fixed { color: var(--text-dim); }

.compare-check { margin: 0; }

/* ======================================================================
   Verification / legacy badges
   ====================================================================== */

.v-badge {
  display: inline-block;
  border-radius: 2px;
  padding: 1px 7px;
  font-size: 0.72rem;
  font-family: var(--font-mono);
  border: 1px solid currentColor;
}
.v-confirmed { color: var(--accent-2); }
.v-partial { color: var(--accent-soft); }
.v-community { color: #b06fd6; }
.v-unverified { color: var(--danger); }
.v-legacy { color: var(--text-dim); }

.notice-legacy {
  border-left-color: var(--text-dim);
  opacity: 0.92;
}

.source-block {
  background: var(--bg-alt);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin: 14px 0;
  font-size: 0.82rem;
}
.source-row { display: flex; gap: 8px; align-items: center; padding: 2px 0; flex-wrap: wrap; }
.source-label { color: var(--text-dim); font-family: var(--font-mono); text-transform: uppercase; font-size: 0.7rem; min-width: 90px; }
.source-row a.tag { color: var(--accent-2); }
.source-notes { display: block; color: var(--text-dim); font-style: italic; padding-top: 4px; }

/* ======================================================================
   Detail page head (title + favorite), loadout grid, compare table
   ====================================================================== */

.detail-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.detail-head h2 { margin: 0; border: none; padding: 0; }

.loadout-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 8px 24px;
}
.loadout-grid .section-block { margin-top: 20px; }

.compare-table th:first-child, .compare-table td:first-child {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.76rem;
  text-transform: uppercase;
  white-space: nowrap;
}

.compare-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--bg-alt);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 0.86rem;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  padding: 7px 14px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.82rem;
}
.btn-primary:hover { background: var(--accent-soft); }

/* ======================================================================
   Home page: quick tools, hero, stats
   ====================================================================== */

.hero-title { border: none; margin-bottom: 4px; font-size: 1.7rem; }
.hero-tagline { font-size: 1rem; }
.hero-search-hint { margin-top: 10px; font-size: 0.85rem; color: var(--text-dim); }

.quick-tools-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.quick-tool {
  text-align: left;
  cursor: pointer;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.quick-tool-icon { font-size: 1.6rem; }
.quick-tool h3 { margin: 2px 0 0; }
.quick-tool p { color: var(--text-dim); font-size: 0.82rem; margin: 0; }

.stats-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

/* ======================================================================
   Build Finder goal buttons
   ====================================================================== */

.goal-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}
.goal-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
}
.goal-btn:hover { border-color: var(--accent); }
.goal-btn.is-active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

/* ======================================================================
   Mobile: cards over giant tables, single-column grids, drawer nav
   ====================================================================== */

@media (max-width: 700px) {
  main { padding: 18px 14px 50px; }
  .grid { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-field select { min-width: 0; width: 100%; }

  table.data-table thead { display: none; }
  table.data-table, table.data-table tbody, table.data-table tr, table.data-table td {
    display: block;
    width: 100%;
  }
  table.data-table tr {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    padding: 8px 10px;
  }
  table.data-table td {
    border-bottom: none;
    padding: 4px 0;
  }
  table.data-table td:empty { display: none; }

  /* A td carrying data-label shows that label above its value instead of
     relying on column position (which the stacked mobile layout loses) —
     an empty data-label="" (used for a compare table's own row-label
     column) is deliberately skipped so it doesn't print a blank caption. */
  table.data-table td[data-label]:not([data-label=""])::before {
    content: attr(data-label);
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .compare-table { font-size: 0.8rem; }
  .compare-table th, .compare-table td { padding: 6px; }
}

</style>

lding Bipod"]}]},"blueprints":{"overview":"Blueprints are formulas that must be learned before you can craft a piece of furniture, a structure, or certain gear. Once learned, a blueprint appears under the 'Special' tab of your inventory and its item becomes placeable in Build Mode.","howToObtain":["Looting chests, dumpsters and cabinets in the world (lootable containers reset on a global timer, refreshing every 4 hours).","Disassembling unwanted or duplicate blueprints at the Designer's Workstation for Formula Blueprint Fragments, which can be redeemed for new ones.","Purchasing from the in-game Shop or seasonal Shop rotations.","Rewarded from Tech Tree nodes (Combat/Production/Building branches — many nodes directly unlock a blueprint, e.g. turrets, traps, storage crates and workbenches). Before April 2026 this was the Memetic Specialization system's Building and Crafting branches.","Deviant assistance — e.g. the Logging Beaver deviant can occasionally find furniture items while foraging."],"categories":[{"id":"furniture-decor","name":"Furniture & Decor","description":"Single-use or reusable decorative furniture for territory customization — beds, seating, lighting, storage displays.","examples":["Deluxe Storage Crate (64 slots)","Special Storage Crate (64 slots)","Bed: A Place to Call Home","Bed: Heat Preservation"],"unlockedBy":"A Building-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"workstations","name":"Workstations & Production","description":"Crafting facility blueprints that unlock or upgrade production buildings.","examples":["Gear Workbench: Customization","Custom Gear Workbench","Advanced Stove: Gourmand","Kitchen Set: Gourmand","Refining Facility: Smelting","Robotics Facility: Skilled Mechanician","Synthesis Bench: Recycle & Reuse"],"unlockedBy":"Production-branch Tech Tree nodes (previously Crafting/Management memetics); see the Stations section for the Gear Workbench and cooking-station tier progression these plug into."},{"id":"power-utility","name":"Power & Utility","description":"Generators and utility structures that support a base.","examples":["Generator: Electrical Expert","Biomass Generator: Sustained Output","Hydraulic Generator: One with the Tides","Hydropower Generator","Deviant Power Generator: Stardust Unleashed","Water Pump: Underground Pump","Portable Thermostat"],"unlockedBy":"A Production-branch Tech Tree node (previously the Memetic system's Management branch)."},{"id":"defense","name":"Defense — Turrets & Traps","description":"Territory defense structures unlocked via the Tech Tree's Combat branch.","examples":["Rifle Turret: Two Birds One Stone","Shotgun Turret: Volley Fire","Gatling Cannon: Power Blast","Portable MG Turret: Shadow Shift","Claymore Mine: Frost Trap","Claymore Mine: Warrior's Resolve","Flamethrower Trap: Kebob Party","Flamethrower Trap: Scorching Blast","Stardust Barrier: Hold the Line"],"unlockedBy":"A Combat-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"farming","name":"Farming & Agriculture","description":"Planter and irrigation blueprints for growing crops (see the Crops section).","examples":["Planter Box: Greenhouse Planting","Growshroom (Deviant-assisted auto-planting)"],"unlockedBy":"A Survival/Production-branch Tech Tree node — originally the Planting memetic plus Management-branch upgrades like Planter Box: Greenhouse Planting."},{"id":"structural","name":"Structural — Walls, Roofs, Pillars","description":"Base-building material tiers with durability bonuses from the Tech Tree's Building branch.","examples":["Wood Structures: Tough Plant","Stone Structures: Intense Defense","Basic Defense: Battle-Hardened","Reinforced Structures"],"unlockedBy":"A Building-branch Tech Tree node (previously the Memetic system's Building branch)."},{"id":"drones","name":"Rosetta Drones","description":"Deployable drone blueprints for gathering, combat, exploration and territory support.","examples":["Rosetta Gathering Drone","Rosetta Firepower Drone","Rosetta Exploration Drone","Rosetta Territory Drone"],"unlockedBy":"A Combat/Building-branch Tech Tree node (previously the Memetic system's Building branch)."}],"craftingStations":"See the Stations section for the Gear Workbench, cooking-station and utility-station tiers that many of the blueprints above are crafted at or unlock.","notableConstructionUpdate":"Patch 3.0.2 (July 22, 2026) added flexible snap-point switching for walls, ceilings, roofs, stairs and pillars, giving builders finer control when placing blueprints.","techSystemNotice":"The 'unlockedBy' notes below originally pointed to the old Memetic Specialization branches (Building/Crafting/Management), which were removed in the April 8, 2026 Tech System overhaul (patch 2.3.6). These blueprints are very likely still unlockable today, just through the Tech Tree's Combat/Production/Building branches instead — the specific branch and Tech Point cost per blueprint hasn't been independently re-verified post-overhaul."},"bosses":{"overview":"The main story/world bosses in Once Human are known as 'The Great Ones' — massive creatures forged from people mutated by Stardust, each guarding a Monolith in a different region of Nalcott and requiring a team to defeat efficiently. Beyond the Great Ones, seasonal Visional Wheel content adds rotating bosses (e.g. the Riftwalker in the Gravity Abyss season) and events add limited-time bosses (e.g. the Block Wanderer).","greatOnes":[{"id":"ravenous-hunter","name":"Ravenous Hunter","level":10,"location":"Monolith of Greed, Dayton Wetlands","mechanics":"Destroy its Gatling weapon to disable its shield, then stun it and hit the yellow head weak spot.","drops":"Burn-effect weapon mods (confirmed), plus early-game crafting materials and blueprint fragments.","verification":{"status":"community","sourceIds":["fandom-wiki","pcgamesn-bosses"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mechanics and location per community guides; its weapon-effect mod drop is independently confirmed."}},{"id":"treant","name":"Treant","level":20,"location":"Gaia Cliff Monolith, Broken Delta","mechanics":"Destroy the surrounding vines first, target the female humanoid figure on its back, and dodge laser beams that telegraph with a red light.","drops":"Wood/plant-themed crafting materials and blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)","verification":{"status":"community","sourceIds":["fandom-wiki","pcgamesn-bosses"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mechanics and location per community guides; its weapon-effect mod drop is independently confirmed."}},{"id":"arachsiam","name":"Arachsiam","level":30,"location":"Mirage Monolith, Iron River","mechanics":"Avoid web-cocoon and rush attacks; focus the purple pustules on its back for maximum damage.","drops":"Mid-tier crafting materials and blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)","verification":{"status":"community","sourceIds":["fandom-wiki","pcgamesn-bosses"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mechanics and location per community guides; its weapon-effect mod drop is independently confirmed."}},{"id":"rabizex","name":"Rabizex","level":40,"location":"Monolith of Thirst, Chalk Peak","mechanics":"Keep distance, use powerful weapons on its weak points, and prioritize evasion since its movements are hard to predict up close.","drops":"Shrapnel and Bounce-effect weapon mods (confirmed), plus mid-to-late-tier crafting materials and blueprint fragments.","verification":{"status":"community","sourceIds":["fandom-wiki","pcgamesn-bosses"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mechanics and location per community guides; its weapon-effect mod drop is independently confirmed."}},{"id":"mensdevoran","name":"Mensdevoran (The Forsaken Giant)","level":60,"location":"Forsaken Monolith, Red Sands","mechanics":"Jump over hand-slam shockwaves, stay close to its body to dodge sweeping arm attacks, and target glowing weak spots as they appear.","drops":"Endgame crafting materials and Advanced Gear Workbench blueprint fragments. (Its specific weapon-effect mod drop isn't confirmed by available sources.)","verification":{"status":"community","sourceIds":["fandom-wiki","pcgamesn-bosses"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mechanics and location per community guides; its weapon-effect mod drop is independently confirmed."}}],"seasonalAndEventBosses":[{"id":"riftwalker","name":"Riftwalker","type":"Seasonal Aerial Boss","context":"Visional Wheel S4: Gravity Abyss (patch 2.4.1) — a massive aerial Deviant fought across zero-gravity floating islands.","drops":"Abyssal Cores (epic/legendary/mythic), Abyssal Essence, and the Aero/Downstar mods.","verification":{"status":"community","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Seasonal/event context per community + in-game announcement text."}},{"id":"block-wanderer","name":"Block Wanderer","type":"Limited-time Event Boss","context":"Block Adventure event on Wish Island (patch 3.0.3, Aug 5–23 2026) — defeat blocky creatures and challenge this boss for morphed Deviation rewards.","drops":"Morphed Deviations (Zapamander, Nutcracker and Dr. Teddy variants) plus Block Adventure event currency.","verification":{"status":"community","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Seasonal/event context per community + in-game announcement text."}}],"note":"Great Ones drop core weapon-effect mod sets (confirmed for Ravenous Hunter → Burn and Rabizex → Shrapnel/Bounce) alongside crafting materials and blueprint fragments — cross-reference the Mods section for what each weapon effect actually does. Drop tables for Treant, Arachsiam and Mensdevoran weren't available in the sources used to compile this database."},"builds":{"mechanicNote":"Weapon effects (Shrapnel, Power Surge, Frost Vortex, Bounce, Fast Gunner, Burn, Unstable Bomber, Fortress Warfare, Marked) are granted by the mod you equip as a weapon's core-effect slot, and most can go on almost any weapon in that mod's compatible slot — they are not locked to one gun. A small number of named legendary weapons additionally have their own confirmed built-in special ability (see each weapon's own page). The 'primary weapon' below is the community-recommended pick that best exploits a given build's playstyle (fire rate, magazine size, trigger rate, etc.) — not the only weapon that can run it.","builds":[{"id":"shrapnel-crit","name":"Shrapnel Crit Build","archetype":"shrapnel","role":"PvE — Boss Killer","summary":"Once Human's premier build for destroying the Great Ones and general PvE. Bullets fragment to tear through multiple body parts; can be specced for crit, weakspot hits, or a no-reload playstyle. Aim for a Shrapnel proc chance near 50% (about 1 in every 2 shots).","primaryWeapon":"socr-last-valor","secondaryWeapons":["de50-wildfire","recurve-crossbow"],"keyStats":["Crit DMG","Weapon DMG","Max HP","Magazine Capacity","Weakspot DMG"],"suggestedMods":["Obliterate","Shatter Them All","Shield Breaker","Shrapnel Smash","Shrapnel Souvenir"],"recommendedArmor":["4pc Lonewolf Set + 1pc Bastille + Beret headpiece (Beret increases how many parts Shrapnel can hit) — a common endgame pick, ~15,000 Starchrom.","Alternative: 4pc Falcon Set for Crit DMG + 2pc Lonewolf for Crit Rate."],"recommendedFood":["Stargazy Pie","Assorted Canned Fruit","Canned Meat","Bone-In Deviated Sausage"],"gearSources":[{"name":"BlueStacks — Once Human Shrapnel Build and Guide","url":"https://www.bluestacks.com/blog/game-guides/once-human/ohn-shrapnel-build-en.html"},{"name":"GameRant — Once Human: Best Shrapnel Build","url":"https://gamerant.com/once-human-best-shrapnel-build/"}],"gearVerification":"community","verification":{"status":"community","sourceIds":["bluestacks-shrapnel","gamerant-shrapnel"],"lastVerified":"2026-08-20","verifiedPatch":"3.0.3","notes":"Armor/food/deviant recommendations traced to named community build guides (see sourceIds)."}},{"id":"power-surge","name":"Power Surge Build","archetype":"power-surge","role":"PvE — Sustained DPS","summary":"Dump full magazines into enemies to trigger bursts of Electric/Shock damage that stack on top of regular weapon damage with no real downside. Community reports of a well-optimized version topping out around 100,000 DPS circulate widely.","primaryWeapon":"mps7-outer-space","secondaryWeapons":["recurve-crossbow","de50-wildfire"],"suggestedMods":["Shock Diffusion","Shock Rampage","Static Shock","Surge Amplifier"],"dpsClaimVerification":"community","dpsClaimNote":"This ~100,000 DPS figure is a community-reported estimate, not a value this database independently measured. Exact weapon/mod combination, calibration level, food/buffs, target (training dummy vs. live boss), and game patch used to produce it are unknown — treat it as directional, not a guarantee.","recommendedArmor":["Mayfly Goggles (head) — reduces Power Surge's own damage 30% but doubles how many Shock DMG instances proc; the drawback becomes negligible once you stack enough damage buffs.","Endgame: 4pc Shelterer Set for extra Elemental DMG. Without the MPS7 – Outer Space, an alternative is Gas Mask Hood + Lonewolf Set for a SOCR Outsider variant."],"recommendedFood":[],"foodNote":"No build-specific food recommendation was found in the guides searched for this build — general Energy Drink consumables (recharge rate) were mentioned but not a specific recipe. See Food & Cooking for general Elemental/Shock-relevant options.","gearSources":[{"name":"GameLeap — Once Human Best Power Surge Build","url":"https://www.gameleap.com/articles/once-human-best-power-surge-build"},{"name":"Sportskeeda — Once Human Power Surge build guide: BiS gear, Deviant, and more","url":"https://sportskeeda.com/mmo/once-human-power-surge-build-guide-bis-gear-deviant"}],"gearVerification":"community","verification":{"status":"community","sourceIds":["gameleap-power-surge","sportskeeda-power-surge"],"lastVerified":"2026-08-20","verifiedPatch":"3.0.3","notes":"Armor/food/deviant recommendations traced to named community build guides (see sourceIds)."}},{"id":"frost-vortex","name":"Frost Vortex Build","archetype":"frost-vortex","role":"PvE — Boss Sustain","summary":"Excellent against big boss enemies — the vortex feeds you health while draining theirs, making it a strong solo/duo boss-clearing build.","primaryWeapon":"kam-abyss-glance","secondaryWeapons":["de50-wildfire"],"meleeOption":"frozen-northern-pike","suggestedMods":["Cryo Blast","Frosty Blessing","Shattering Ice","Vortex Multiplier"],"recommendedArmor":["Stealth Walker chest piece + 4pc Shelterer Set + one spare slot (e.g. Heavy Duty for its +10% Max HP 1-piece bonus)."],"recommendedFood":["Honey-Glazed Meat","Mixed Fried Hotdog","Whimsical Drink"],"foodNote":"Honey-Glazed Meat adds Crit DMG against enemies affected by Frost Vortex; Mixed Fried Hotdog supports a Bull's Eye secondary; Whimsical Drink gives +30% PSI Intensity (boosts status-effect potency, including Frost).","recommendedDeviant":"Polar Jelly (Combat Deviant) — frequently cited as important for sustaining this build.","gearSources":[{"name":"Vortex Gaming — Once Human: Frost Vortex Build Guide (KAM Abyss Glance)","url":"https://vortexgaming.io/en/postdetail/536866"},{"name":"Sportskeeda — Once Human Frost Vortex build guide: BiS gear, armor, and more","url":"https://www.sportskeeda.com/mmo/once-human-frost-vortex-build-guide-bis-gear-armor"}],"gearVerification":"community","verification":{"status":"community","sourceIds":["vortexgaming-frost-vortex","sportskeeda-frost-vortex"],"lastVerified":"2026-08-20","verifiedPatch":"3.0.3","notes":"Armor/food/deviant recommendations traced to named community build guides (see sourceIds)."}},{"id":"bounce","name":"Bounce Build","archetype":"bounce","role":"PvE — Crowd Damage","summary":"An underrated build where projectiles ricochet between enemies; damage gets absurd in tight corridors or dense groups of mobs.","primaryWeapon":"hamr-brahminy","secondaryWeapons":["de50-wildfire"],"suggestedMods":["Bounce Rampage","Super Bullet","Targeted Bounce"],"recommendedArmor":["Agent Set (Helmet/Face/Gloves/Shoes) for +10% Weakspot DMG plus its stacking Bullet Saver perk (up to +45% Weakspot DMG from precise kills).","Alternative mix: Agent + Bastille — Bastille Jacket (torso) for +10% Weapon DMG above 70% HP, Hot Dog Shorts (legs) for +2 Bounces."],"recommendedFood":["Mixed Fried Hot Dog","Assorted Canned Fruit"],"foodNote":"Both recipes boost weakspot damage; guides cite eating both together for a combined weakspot-damage increase of roughly 80%.","gearSources":[{"name":"Theria Games — Once Human Bounce Build","url":"https://theriagames.com/guide/once-human-bounce-build/"},{"name":"Game8 — Bounce Build | Once Human","url":"https://game8.co/games/Once-Human/archives/469252"}],"gearVerification":"community","verification":{"status":"community","sourceIds":["theriagames-bounce","game8-bounce"],"lastVerified":"2026-08-20","verifiedPatch":"3.0.3","notes":"Armor/food/deviant recommendations traced to named community build guides (see sourceIds)."}},{"id":"fast-gunner-lmg","name":"Fast Gunner LMG Build","archetype":"fast-gunner","role":"PvE/PvP — Sustained Fire","summary":"Buffs a gun's damage and fire rate the longer you shoot. Best on high-magazine LMGs — a properly built MG4 Predator is reported to unload roughly 200 rounds before needing to reload (community-reported figure, not independently re-measured for this database).","primaryWeapon":"mg4-predator","secondaryWeapons":[],"suggestedMods":["Cowboy","Double Gunner","Fast Refurbish","Lasting Fortification","Precision Rush","Shoot Out","Shooting Blitz"],"recommendedArmor":["4pc Lonewolf + 1pc Bastille + Oasis Mask (Wish Machine, ~8,000 Starchrom; +10 max Fast Gunner stacks, +1% damage per stack).","Alternative: 3pc Bastille for a flat +10% Fire Rate."],"recommendedFood":["Assorted Canned Fruit","Shattered Bread","Stargazy Pie","Corn Ale","Shellfish Meat"],"foodNote":"Assorted Canned Fruit gives +25% Weakspot DMG above 80% Sanity; Shattered Bread gives +10% Weapon DMG; Stargazy Pie gives +25% Crit DMG; Corn Ale locks Sanity above 80% for 30 minutes to keep the Canned Fruit bonus active; Shellfish Meat adds +5% vulnerability damage for the party.","gearSources":[{"name":"GameRant — Best Machine Gun Fast Gunner Build In Once Human","url":"https://gamerant.com/once-human-machine-gun-fast-gunner-build-guide-mods-armor-mg4-predator-lmg-bastille/"},{"name":"Upcomer — Fast Gunner LMG Build for maximum Crit damage in Once Human","url":"https://upcomer.com/fast-gunner-lmg-build-for-maximum-crit-damage-in-once-human-70k-dps/"}],"gearVerification":"community","verification":{"status":"community","sourceIds":["gamerant-fast-gunner","upcomer-fast-gunner"],"lastVerified":"2026-08-20","verifiedPatch":"3.0.3","notes":"Armor/food/deviant recommendations traced to named community build guides (see sourceIds)."}}],"note":"Builds combine a weapon effect archetype, a weapon, mods and Tech Tree nodes into a cohesive loadout. See the Builds & Classes section for archetype summaries and the Mods section for full mod effect details."},"classes":{"overview":"Once Human has no fixed 'class' system — instead your playstyle is defined by which Weapon Effect (the combat archetype tied to your weapons/mods) and Tech Tree branch you build around. These act as the closest equivalent to classes.","techSystemNotice":"IMPORTANT MECHANIC CHANGE: the old 'Memetic Specialization' system described below (and in the Memetics tab) was completely removed in the Tech System overhaul (patch 2.3.6, April 8, 2026). There is no more separate specialization menu, no more level-gated 'choose 1 of 4 every 5 levels', and no more Cradle/Cipher/Meme Point currency. Those effects were folded into a single Tech Tree with four branches — Survival, Production, Combat and Building — unlocked via three methods: (1) Tech Tree Allocation, spending Tech Points earned from leveling up, researching facilities/items, exploring chests, or defeating Elites; (2) Reverse Engineering, using a research bench to unlock a formula directly from a collected cultural artifact; (3) Tech Invention, experimenting with material combinations at the research bench for a variable success rate. The Gathering/Crafting/Management/Building groupings below (and in Memetics) are this database's original functional categorization of what each node does — they are NOT the current official Tech Tree branch names, and this database has not independently verified which of the four current branches each individual node now lives in. Treat the node names and effects as still broadly accurate content, but check the in-game Tech Tree for the current branch placement and unlock cost of any specific one.","weaponEffectArchetypes":[{"id":"shrapnel","name":"Shrapnel","role":"PvE burst / boss killer","summary":"Bullets fragment for extra per-part damage; considered a top pick for melting the Great Ones and general PvE."},{"id":"power-surge","name":"Power Surge","role":"Sustained DPS","summary":"Dump full magazines to build stacking Electric/Shock damage. Community guides report very high sustained DPS in optimized PvE builds, but the specific figures circulating (e.g. ~100,000 DPS) are not independently measured by this database — see the Power Surge Build page for the caveat."},{"id":"frost-vortex","name":"Frost Vortex","role":"Boss sustain / control","summary":"Creates damaging vortexes that also return health, excellent against big single targets while keeping you alive."},{"id":"bounce","name":"Bounce","role":"Crowd control / AoE","summary":"Projectiles ricochet between enemies; shines in corridors or dense enemy groups."},{"id":"fast-gunner","name":"Fast Gunner","role":"Sustained fire LMG playstyle","summary":"Rewards continuous firing and weapon-switching with stacking damage/reload buffs; pairs best with high-magazine LMGs like the MG4 Predator."},{"id":"burn","name":"Burn","role":"Damage-over-time","summary":"Stacking burn DoT that snowballs with mods that preserve or extend stacks on kill."},{"id":"unstable-bomber","name":"Unstable Bomber","role":"Burst explosive","summary":"Builds toward bomb-like detonations, scaling well with Crit Rate."},{"id":"fortress-warfare","name":"Fortress Warfare","role":"Territory / group defense","summary":"Buffs tied to structures and holding ground, strengthened by nearby teammates."},{"id":"marked","name":"Marked / Bull's Eye","role":"Team support / debuff","summary":"Marks targets to amplify incoming damage from the whole team."}],"note":"The four groupings above (Gathering/Crafting/Management/Building) are this database's original functional categorization, kept so the specific node effects stay browsable — but as the notice above explains, as of April 8, 2026 the actual in-game system is a single Tech Tree with different branch names (Survival/Production/Combat/Building, listed just above) unlocked through Tech Points, Reverse Engineering and Tech Invention rather than character-level gating. See the Blueprints and Builds & Classes sections for how these tie into gear and loadouts."},"crops":{"overview":"Farming lets you grow crops for cooking and crafting. Seeds are obtained by harvesting wild plants (or from growing your own crop). Plant seeds in loamy soil or a Planter Box, water with Boiled or Pure Water (Dirty Water lowers crop Vitality), and provide light — Irrigation Systems and Grow Lights can automate this. Harvest by interacting once growth reaches 100%. Deviated (mutated) Crops can drop from regular ones and are used in special high-value recipes.","howToFarm":["Unlock planting/farming capability via the Tech Tree (Survival/Production branch) — the ability to plant was previously gated behind the old Memetic system's 'Planting' specialization; see the Memetics (Legacy) page for that historical mechanic. This database has not independently re-verified the exact current Tech Tree node.","Gather seeds from wild plants or from harvested crops.","Plant in loamy soil or a Planter Box.","Water with Boiled/Pure Water and ensure adequate light.","Harvest at 100% growth for the crop plus a chance at bonus seeds or a Deviated (mutated) variant."],"crops":[{"id":"beets","name":"Beets","uses":"Refined into Sugar for Sanity Pills, Stardust Energy Drink, Shattered Bread, Assorted Canned Fruit.","foundNear":"Waterways near Deadsville and Meyer's Market","usedInRecipes":["Assorted Canned Fruit","Stardust Energy Drink","Lunar Gummy","Ginger Poppers","Fruity Sanity Capsule"]},{"id":"corn","name":"Corn","uses":"Refined into Corn Oil (Shattered Bread, Canned Seafood in Oil); fermented into Corn Ale.","foundNear":"Grassy/forested areas and farms like Citrus County","usedInRecipes":["Corn Soup","Corn Oil","Cornbread","Popcorn","Stardust Italian Soup Can","Roasted Vegetables"]},{"id":"wheat","name":"Wheat","uses":"Brewed into Malt Ale; used in Hug-in-a-Bowl and Croquettes.","foundNear":"Farms and roadsides, e.g. Citrus County","usedInRecipes":["Bread","Corn Soup","Curry and Ride","Hug-in-a-Bowl","Croquette","Safety Sandwich","Stargazy Pie","Snow Mushroom Fried Rice"]},{"id":"mushrooms","name":"Mushrooms","uses":"Crafted into Yield Boost and Mutation Boost fertilizers.","foundNear":"Wooded underbrush in Iron River","usedInRecipes":["Grilled Mushrooms","Bone-In Deviated Sausage","Mixed Fried Hot Dog","Spectral Canned Mushroom"]},{"id":"scarlet-calamus","name":"Scarlet Calamus","uses":"Creates Breeding Boost fertilizer to increase seed yield.","foundNear":"Shallow waterways","usedInRecipes":["Fruit Tea (herb variant)","Ice Tea (herb variant)","Securement Soup (herb variant)"]},{"id":"peppercorn","name":"Peppercorn","uses":"Creates Preserved Deviated Chops and Securement Soup.","foundNear":"Vendor Lacey at Blackfell (limited 3 seeds/week)","usedInRecipes":["Preserved Deviated Chops","Securement Soup","Fish & Chips","Roulette Dumplings"]},{"id":"cucumber","name":"Cucumber","uses":"Fermented into Pickles; Deviated variant used for Safety Sandwich.","foundNear":"Vendor Zhao Jintan at Meyer's Market (limited 3 seeds/week)","usedInRecipes":["Fat-Burning Juice","Bacon Burger","Canned Minty Meat","Signature Ice Brew","Safety Sandwich"]},{"id":"onions","name":"Onions","uses":"Croquette ingredient; Deviated variant yields Bacon Burger and can attract the Grumpy Bulb deviant.","foundNear":"Vendor Emma Potter at Tall Grass Inn (limited 3 seeds/week)","usedInRecipes":["Croquette","Bacon Burger","Stardust Italian Soup Can"]},{"id":"morel","name":"Morel","uses":"Canned Seafood in Oil, Borscht Deluxe, Yuanbao Dumplings.","foundNear":"Randomly dropped from containers in level 35+ areas","usedInRecipes":["Canned Seafood In Oil","Borscht Deluxe","Spectral Canned Mushroom"]},{"id":"aloe-vera","name":"Aloe Vera","uses":"Signature Ice Brew, Aloe Vera Ointment, Shattered Bread.","foundNear":"Rare finds in Red Sands and Blackheart regions","usedInRecipes":["Signature Ice Brew","Crumbly Bread","Honey Glazed Meat","Stardust Raspberry Shaved Ice","Stargazy Pizza"]}],"deviantHelpers":[{"name":"Buzzy Bee","helps":"Automatically plants crops and boosts mutation probability."},{"name":"Growshroom","helps":"Auto-plants seeds and accelerates crop growth."},{"name":"Rain Man","helps":"Enhances crop vitality and provides irrigation water."}],"deviatedCrops":{"verification":"confirmed","overview":"Once Human's crops don't have a season mechanic — any crop maturing has a chance to mutate into a 'Deviated' state instead, recognizable by a pink-purple glow. Deviated crops don't decay (regular harvests eventually spoil) and are required ingredients for a set of higher-value special recipes with stronger buffs than ordinary food.","howToIncrease":["Craft and apply Fertilizer – Mutation Boost (costs Fertilizer, Stardust Source, Mushrooms) to a planted crop.","Improved Compound Fertilizer also raises mutation odds, plus boosts overall yield.","Place the Growshroom deviant on your territory — it accelerates growth and raises mutation odds.","Place the Buzzy Bee deviant — it raises mutation odds further while a crop is growing, more effectively at high Deviant Power."],"sources":[{"name":"GameRant — How To Get Deviated Crops In Once Human","url":"https://gamerant.com/once-human-how-get-deviated-crops/"},{"name":"TheGamer — How To Get Deviated Crops Using Fertilizers In Once Human","url":"https://www.thegamer.com/once-human-how-to-get-deviated-crops-guide/"}],"note":"Sources describe mutation as a chance applied to whichever crop you're growing, not a separate named item — so this database does not list 'Deviated Beets' etc. as distinct catalog entries, and does not filter crops by a deviated/normal or seasonal dimension, since neither is a fixed property of the crop type itself."}},"deviants":{"overview":"Deviants are sentient creatures/objects mutated by Stardust that players can capture and bond with as companions. Each Deviant falls into one of three main purposes — Combat, Territory (utility/gathering), or Crafting (produces materials) — and grants passive or active abilities. Once Human's catalog includes 80+ Deviations (per oncehumandb.com); this database covers 65, including the 4 added by the 'Deviation: Survive, Capture, Preserve' scenario (Whalepup, Soul Summoner, Director Fox — Zapamander is already listed under Bosses/event content) and the 3 time-limited Palworld-collaboration companions; the '(Way of Winter)' tag notes ones introduced in that seasonal update and (PvP)/(PvE) note mode-specific abilities.","categories":["Combat","Territory","Crafting","Crossover"],"deviants":[{"name":"Artisan's Touch","category":"Crafting","ability":"Instantly repairs the gear with the lowest durability.","location":"Scorcher elite enemy defeat","locati or pieces and 773 mod combinations, mostly through named legendary/epic skin variants of the base items already listed here. This site does not claim to enumerate every one of those — where a count from oncehumandb.com is shown, it is labeled as 'live in-game total (third-party)' and kept separate from 'covered here' so the two are never confused.","verificationLegend":[{"id":"confirmed","symbol":"✓","label":"Confirmed","color":"confirmed","meaning":"Independently verified against an official source (patch notes, dev blog) or cross-checked across multiple independent community sources that agree."},{"id":"partial","symbol":"⚠","label":"Partially confirmed","color":"partial","meaning":"The core fact is sourced, but a specific detail (an exact number, a secondary effect) could not be independently re-verified."},{"id":"community","symbol":"◐","label":"Community reported","color":"community","meaning":"Reported consistently by community guides/wikis, but not found in an official source."},{"id":"unverified","symbol":"!","label":"Unverified","color":"unverified","meaning":"A plausible detail included for completeness, but not independently confirmed by any source used to compile this database. Treat with caution."},{"id":"legacy","symbol":"⧗","label":"Legacy / Historical","color":"legacy","meaning":"Describes a system or mechanic that existed in a past version of the game and has since been changed or removed. Kept for reference only — do not use for current gameplay decisions."}],"currentVsLegacySystems":[{"topic":"Progression / unlocks","current":"Tech Tree (Survival / Production / Combat / Building) — see the Tech Tree page","legacy":"Memetic Specialization (Gathering / Crafting / Management / Building, Cradle, Cipher + Meme Points) — removed April 8, 2026 (patch 2.3.6); see the Memetics (Legacy) page"},{"topic":"Mod acquisition","current":"Fixed sub-attributes (levels 1-17), Shiny mods past Lv.17, targeted Shop redemption (Mod Dust + Energy Links) alongside drops — e Shrapnel, Power Surge, Frost Vortex, Bounce, Fast Gunner, Burn, Unstable Bomber, Fortress Warfare and Marked (Bull's Eye). Once Human's full mod pool spans 773 combinations (per oncehumandb.com). Below is a curated list of named mods grouped by the weapon effect / archetype they support.","modSystemMechanics":"The mod system was overhauled on Jan 21, 2026 and refined again in the April 8, 2026 Tech System patch (2.3.6) — the version most guides written before early 2026 describe (pure random drops, random sub-attributes) is out of date. Under the current system: a mod's level (1-17) is the sum of its individual sub-attribute levels, and those sub-attributes are now fixed per mod rather than randomized, so progress is predictable instead of a random re-roll grind. Past Lv. 17, players chase 'Shiny' variants of a mod — same sub-attributes, stronger main attribute. Acquisition mixes random and targeted: mods still drop from dungeons and game modes (higher difficulty = better odds at high-level mods), and separately, the Shop lets you redeem Mod Dust + Energy Links for a Random Mod Crate targeting a specific level range — so you can grind toward a mod tier deliberately instead of relying purely on drops.","groups":[{"effect":"Shrapnel","description":"Bullets fragment on impact, dealing extra damage per body part hit.","mods":[{"name":"Obliterate","effect":"Shrapnel damage increases 15% per part hit."},{"name":"Shatter Them All","effect":"Shrapnel damage increases 15% per part hit."},{"name":"Shield Breaker","effect":"Hitting shielded units increases Shrapnel DMG by 60% for 1 second."},{"name":"Shrapnel Smash","effect":"Shrapnel triggers increase Crit Rate by 1%, stackable 20x for 2 seconds."},{"name":"Shrapnel Souvenir","effect":"When Shrapnel hits a Weakspot, reloads 1 bullet from reserves."}],"obtainedFrom":"Confirmed boss drop: Rabizex at the Monolith of Thirst (Chalk Peak). Also found in general Weapon Crates and Silo caches. Also obtainable in a targeted way via nce damage increases up to 45% based on target count."},{"name":"Not Throw Away Your Shot","effect":"Bounces hit allies without damage, recovering 1 bullet."},{"name":"Super Bullet","effect":"Bounce Crit Rate +10%, Bounce Crit DMG +25%."},{"name":"Targeted Bounce","effect":"Bounce is 300% more likely to hit a Weakspot."}],"obtainedFrom":"Confirmed boss drop: Rabizex at the Monolith of Thirst (Chalk Peak). Also found in general Weapon Crates and Silo caches. Also obtainable in a targeted way via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate.","effectVerification":{"status":"community","sourceIds":["oncehumandb","fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mod effect percentages per community sources; this group's boss drop source is independently confirmed (see obtainedFrom)."}},{"effect":"Fortress Warfare","description":"Territory/turtling-oriented effect tied to structures and sustained fights.","mods":[{"name":"Durable Territory","effect":"Defeating enemies extends Fortress Warfare duration, up to 5 times."},{"name":"Final Territory","effect":"After Fortress Warfare ends: Weapon DMG +10%, Movement Speed +10%."},{"name":"Portable Territory","effect":"After leaving Fortress Warfare, the status remains for 2 seconds."},{"name":"United We Stand","effect":"Fortress Warfare damage bonus increases with nearby players, up to 40%."}],"obtainedFrom":"Dungeons and game modes (higher difficulty = better odds at high-level copies), or targeted via the Shop by redeeming Mod Dust + Energy Links for a Random Mod Crate. (No specific boss source confirmed by available sources.)","effectVerification":{"status":"community","sourceIds":["oncehumandb","fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Mod effect percentages per community sources; no specific boss drop source is confirmed for this group (see obtainedFrom)."}},{"effect":"Marked / Bull's Eye","description":"Marking enemies for bonus team damage ss is 50%+, and a territory can house a maximum of 6 ranched animals.","breedingNote":"Each animal has a limited number of Breeding Chances (how many times it can produce offspring) that scale with its rarity tier — higher grades (A/S) generally get more chances and better odds at desirable offspring traits, but the exact number per tier wasn't independently re-confirmed for this database, so treat any specific figure you see elsewhere as more reliable than a number here.","breedingNoteVerification":"unverified","animals":[{"name":"Ram","tier":"C","products":"Wool, meat"},{"name":"Rabbit","tier":"C","products":"Meat, hide"},{"name":"Deer","tier":"B","products":"Meat, milk (female), hide"},{"name":"Bear","tier":"A","products":"Meat, hide"},{"name":"Wolf","tier":"A","products":"Meat, hide"},{"name":"Capybara","tier":"B","products":"Meat, hide","notes":"Added in the 1.2 update."},{"name":"Flamingo","tier":"B","products":"Meat, feathers","notes":"Added in the 1.2 update."},{"name":"Leopard","tier":"S","products":"Meat, hide","notes":"Added in the 1.2 update; highest breeding-chance tier."}]},"regions":{"overview":"Once Human's base map, Nalcott, is covered by the Manibus scenario (aka Evolution's Call) — not a single region itself, but an umbrella containing 6 regions, each centered on one Stronghold/settlement and gated by a recommended enemy level. Later seasons add separate Visional Worlds / Strange Worlds layered on top of this base map.","manibus":{"name":"Manibus (Evolution's Call)","regions":[{"region":"Dayton Wetlands","stronghold":"Deadsville","biome":"Swampland & farmland","levelRange":"1-10","notes":"Starting area after the prologue."},{"region":"Broken Delta","stronghold":"Meyer's Market","biome":"Fishing town, industrial area, flooded/unstable terrain","levelRange":"6-10","notes":"Home to the Gaia Cliff Monolith and the Treant boss."},{"region":"Iron River","stronghold":"Greywater Camp","biome":"River and cliffs, contaminated post-apocalyptic landscape","levelRange":"20-30","notes":"Home to the Mirage Monolith and the Arachsiam boss."},{"region":"Chalk Peak","stronghold":"Tall Grass Inn","biome":"Forest and mountains (bears)","levelRange":"30-40","notes":"The largest area; home to the Monolith of Thirst and the Rabizex boss. Terrain adjusted nearby in patch 2.4.1."},{"region":"Red Sands","stronghold":"Blackfell","biome":"Desert city with military bases","levelRange":"40-50","notes":"Home to the Forsaken Monolith and Mensdevoran; enemies here run up to level 50."},{"region":"Blackheart","stronghold":"Not independently confirmed by available sources","biome":"Northernmost region of Eastern Nalcott","levelRange":"Highest-level area besides the LEA Research Lab","notes":"Only 2 settlements; a rare plant-gathering region."}]},"specialWorldsAndScenarios":[{"name":"Way of Winter","type":"Seasonal Visional World","notes":"Added winter-themed Deviants (tagged '(Way of Winter)' in this database) and mechanics."},{"name":"Gravity Abyss (Visional Wheel S4)","type":"Seasonal Visional World","notes":"Zero-gravity combat across floating islands; home of the Riftwalker boss. Added in patch 2.4.1."},{"name":"Pixel-Style Strange World / Block Island / Wish Island","type":"Strange World event","notes":"A blocky, pixel-art version of Nalcott; setting for the Block Adventure event in patch 3.0.3."},{"name":"Eternaland","type":"Endgame Scenario","notes":"Endgame scenario/mode referenced alongside Endless Dream and Evolution's Call."},{"name":"Endless Dream","type":"PvE Scenario"}],"correctionNote":"An earlier version of this file wrongly nested Meyer's Market, Tall Grass Inn and Blackfell as flat 'areas' under one combined Manibus region, while separately listing Broken Delta, Iron River, Chalk Peak and Red Sands as unrelated 'other areas' — without noticing those are the actual regions those same strongholds belong to. Fixed by pairing each region with its real stronghold, sourced against the Once Human Fandom wiki and community area guides."},"sources":{"_comment":"Canonical source registry. Every source URL used anywhere in this database has exactly one entry here with a stable id — data records reference it by id (in a verification.sourceIds array) instead of inlining name/url again. type: 'official' = Starry Studio/NetEase-published; 'database' = a continuously-updated third-party aggregator pulling from game files; 'wiki' = community-maintained wiki; 'community' = a guide/blog/video by an individual creator or outlet.","sources":[{"id":"official-news","name":"Once Human Official Site — News & Patch Notes","url":"https://www.oncehuman.game/news/","type":"official","lastChecked":"2026-08-20"},{"id":"official-devblog-tech-1","name":"Official Dev Blog — Tech System Optimization","url":"https://www.oncehuman.game/news/devBlog/20260302/40781_1288924.html","type":"official","lastChecked":"2026-08-19"},{"id":"official-devblog-tech-2","name":"Official Dev Blog — Tech System Optimizations (iterative)","url":"https://www.oncehuman.game/news/devBlog/20260319/40781_1291998.html","type":"official","lastChecked":"2026-08-19"},{"id":"official-update-2.3.6","name":"Version 2.3.6 Update Announcement","url":"https://www.oncehuman.game/news/update/20260408/40780_1295195.html","type":"official","lastChecked":"2026-08-19"},{"id":"official-devblog-accessories","name":"Official Dev Blog — Comprehensive Optimization of Calibration & Accessories","url":"https://www.oncehuman.game/news/devBlog/20260113/40781_1281545.html","type":"official","lastChecked":"2026-08-20"},{"id":"fandom-wiki","name":"Once Human Wiki (Fandom)","url":"https://once-human.fandom.com/","type":"wiki","lastChecked":"2026-08-19"},{"id":"oncehumanwiki","name":"Once Human Wiki (oncehumanwiki.com)","url":"https://oncehumanwiki.com/","type":"wiki","lastChecked":"2026-08-19"},{"id":"game8-wiki","name":"Game8 Once Human Wiki","url":"https://game8.co/games/Once-Human","type":"wiki","lastChecked":"2026-08-19"},{"id":"oncehumandb","name":"Once Human Database (
