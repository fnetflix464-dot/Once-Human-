e-human-how-to-get-deviated-crops-guide/","type":"community","lastChecked":"2026-08-20"}]},"stations":{"overview":"Crafting stations gate what tier of gear, food or blueprint you can produce. Most stations upgrade through 2-4 tiers.","techSystemNotice":"IMPORTANT MECHANIC CHANGE: the unlock descriptions below originally cited the old Memetic system's Cradle screen and Cipher/Meme Point currency. That system was removed in the Tech System overhaul (patch 2.3.6, April 8, 2026) — stations are now unlocked through the Tech Tree instead (Tech Points from leveling/research/exploration/Elite kills, Reverse Engineering of cultural artifacts, or Tech Invention at a research bench; see the Tech Tree page). This database has not independently re-verified the exact current Tech Tree node/cost for each station below, so treat unlock details as approximate pre-overhaul context, not current costs. Separately, that same patch removed five intermediate-tier facilities outright — Intermediate Supplies Workbench, Intermediate Weapons Bench, Intermediate Garage, Small Synthesis Bench, and Intermediate Stove — folding their crafting formulas into the corresponding Advanced-tier facility and moving that facility's unlock earlier in the tree. The 'Electric Stove' entry below may correspond to the now-removed Intermediate Stove; its recipes are likely reachable straight from an Advanced Stove / Kitchen Set today. Crafting materials were also simplified game-wide around the same update: most fabric types collapsed into a single Cotton Fabric, parts into Standard Parts, and plastics into All-Purpose Plastic, and rare metal crystals are no longer a mandatory gear-crafting ingredient — so treat the specific material lists below as illustrative rather than exact current recipes.","weaponAndGearStations":[{"id":"gear-workbench","name":"Gear Workbench","tier":"I-II","unlock":"Early Tech Tree node (Production branch, expected). Pre-overhaul this required unlocking 'Essential Tools' then the Gear Workbench line in the old Memetics menu.","unlockVerification":"unverified","materials":["Copper Ingots","Standard Parts","Cotton Fabric","Adhesives"],"produces":"Tier I-II weapons and armor (given the blueprint + materials).","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}},{"id":"intermediate-gear-workbench","name":"Intermediate Gear Workbench","tier":"III-IV","unlock":"Not confirmed among the facilities removed in the April 2026 overhaul, so likely still exists as a Production-branch Tech Tree node — exact placement unconfirmed.","unlockVerification":"unverified","produces":"Tier III-IV weapons and armor.","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}},{"id":"advanced-gear-workbench","name":"Advanced Gear Workbench","tier":"V (max)","unlock":"A Production-branch Tech Tree node; the April 2026 overhaul moved advanced-facility unlocks earlier in the tree specifically so players reach full crafting capability sooner. Exact current Tech Point cost unconfirmed.","unlockVerification":"partial","materials":["Tungsten Ingots"],"produces":"Tier V weapons and armor (top tier), plus all lower tiers.","verification":{"status":"partial","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}},{"id":"designers-workstation","name":"Designer's Workstation","tier":"Utility","unlock":"Building-branch Tech Tree node (approximate).","unlockVerification":"unverified","produces":"Disassembles unwanted/duplicate blueprints into Formula Blueprint Fragments, redeemable for new blueprints.","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}}],"cookingStations":[{"id":"stove","name":"Stove","tier":"I (basic)","unlockVerification":"confirmed","produces":"Basic dishes (Roasted Meat, Grilled Fish, breads, simple soups).","verification":{"status":"confirmed","sourceIds":["official-update-2.3.6"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3"}},{"id":"electric-stove","name":"Electric Stove","tier":"II","unlock":"Likely superseded: 'Intermediate Stove' was one of five facilities removed outright in the April 2026 Tech System overhaul, with its recipes folded into the Advanced Stove. If this station is still distinct from that, its current Tech Tree unlock path (Survival branch, expected) is unconfirmed.","unlockVerification":"unverified","produces":"Advanced recipes, including Sanity Gummies.","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}},{"id":"refrigerator","name":"Refrigerator","tier":"Utility","unlockVerification":"confirmed","produces":"Extends food shelf life; required for certain legendary recipes.","verification":{"status":"confirmed","sourceIds":["official-update-2.3.6"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3"}},{"id":"integrated-kitchen","name":"Integrated Kitchen / Kitchen Set","tier":"IV (max)","unlock":"A Survival/Production-branch Tech Tree node (approximate) — the best cooking station in the game. Exact current unlock cost unconfirmed post-overhaul.","unlockVerification":"unverified","produces":"The best cooking station in the game — unlocks Caviar and Butter as ingredients plus the Kitchen Set blueprint (which unlocks the Advanced Stove and further recipes).","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}}],"otherStations":[{"id":"planter-box","name":"Planter Box","produces":"Grows crops from seeds — see the Crops section.","upgrade":"A Tech Tree node (Production/Survival branch, expected) increases growth speed/yield per temperature degree.","unlockVerification":"unverified","verification":{"status":"unverified","sourceIds":["fandom-wiki"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3","notes":"Current Tech Tree unlock branch/cost not independently re-verified post-overhaul."}},{"id":"isolated-securement-unit","name":"Isolated Securement Unit","produces":"Houses a captured Deviant so its ability becomes active — see the Deviants section.","unlockVerification":"confirmed","verification":{"status":"confirmed","sourceIds":["official-update-2.3.6"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3"}},{"id":"youngling-hut","name":"Youngling Hut","produces":"Where bred livestock offspring grow up — see the Ranching section.","unlockVerification":"confirmed","verification":{"status":"confirmed","sourceIds":["official-update-2.3.6"],"lastVerified":"2026-08-19","verifiedPatch":"3.0.3"}}]},"techtree":{"status":"current","lastVerified":"2026-08-20","overview":"The Tech Tree is Once Human's current progression system for unlocking crafting facilities, structures, gear formulas and passive bonuses. It replaced the old Memetic Specialization system entirely in the Tech System overhaul (patch 2.3.6, April 8, 2026) — see the Memetics (Legacy) page for what it replaced and why the two systems shouldn't be confused.","sources":[{"name":"Official Dev Blog — Tech System Optimization","url":"https://www.oncehuman.game/news/devBlog/20260302/40781_1288924.html"},{"name":"Official Dev Blog — Tech System Optimizations (iterative)","url":"https://www.oncehuman.game/news/devBlog/20260319/40781_1291998.html"},{"name":"Version 2.3.6 Update Announcement","url":"https://www.oncehuman.game/news/update/20260408/40780_1295195.html"}],"unlockMethods":[{"id":"allocation","name":"Tech Tree Allocation","verification":"confirmed","description":"Spend Tech Points on tree nodes. Points are earned by leveling up, repeatedly researching facilities/items, exploring mysterious chests, or defeating Elite enemies — not by character level alone.","sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]},{"id":"reverse-engineering","name":"Reverse Engineering","verification":"confirmed","description":"Use a research bench to unlock a formula directly by placing a collected cultural artifact into it — no Tech Points spent.","sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]},{"id":"tech-invention","name":"Tech Invention","verification":"confirmed","description":"Experiment with material combinations at a research bench for a variable chance to unlock a formula.","sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]}],"branches":[{"id":"survival","name":"Survival","verification":"confirmed","focus":"Basic functionality and sustenance — cooking, temperature, health/stamina utility.","likelyLegacyOverlap":["management"],"nodes":[],"sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]},{"id":"production","name":"Production","verification":"confirmed","focus":"Crafting capacity and material processing — workbenches, refining, gathering tools.","likelyLegacyOverlap":["crafting","gathering"],"nodes":[],"sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]},{"id":"combat","name":"Combat","verification":"confirmed","focus":"Fighting capability and enemy engagement — turrets, traps, combat gadgets.","likelyLegacyOverlap":["building"],"nodes":[],"sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]},{"id":"building","name":"Building","verification":"confirmed","focus":"Base construction and territory expansion — structures, drones, storage.","likelyLegacyOverlap":["building"],"nodes":[],"sourceIds":["official-devblog-tech-1","official-devblog-tech-2","official-update-2.3.6"]}],"nodeDataStatus":"unverified","nodeDataNote":"This database does not have an independently verified per-node list (name, exact Tech Point cost, prerequisite, branch placement) for the current Tech Tree — that level of detail wasn't available in the sources used to compile it. The Legacy Memetics page lists ~105 real node names and effects from the old system, most of which are believed to still exist in some form under the new branches above, but this database has not re-verified which of the 4 current branches each one now lives in or what it now costs. Treat the Legacy Memetics content as a reference for *what a node does*, not for *where it currently lives or what it currently costs*.","materialSimplification":{"verification":"confirmed","description":"The same April 2026 overhaul simplified crafting materials: most fabric types collapsed into a single Cotton Fabric, parts into Standard Parts, and plastics into All-Purpose Plastic. Rare metal crystals are no longer mandatory for gear crafting. Five intermediate-tier crafting facilities were removed outright (Intermediate Supplies Workbench, Intermediate Weapons Bench, Intermediate Garage, Small Synthesis Bench, Intermediate Stove) with their formulas folded into the corresponding Advanced-tier facility, whose unlock was moved earlier in the tree specifically so players reach full crafting capability sooner."}},"updates":{"current":{"version":"3.0.3","date":"2026-08-05","title":"Block Adventure & Console Launch Prep","note":"As of compile date 2026-08-19/20 this is the live version; a 3.0.3 bug-fix pass landed Aug 18, the Aug 12 patch added the Summer Echoes furniture pack (Golden Shore Pool), and a Shop-adjustments dev blog + Fair Play ban report (232 accounts, Aug 7-13) were posted Aug 19. A refund-feedback window for Summer Echoes closes Aug 19 09:00 PT with compensation by Aug 21. Two things are scheduled next: a new update on Aug 24, 4:00 PM PT, and the console (PlayStation/Xbox) launch on Aug 25, 10:00 AM PT with cross-platform account linking to carry over PC/mobile progress. Check the official news page (linked in the Sources section) for whatever landed after this was compiled."},"history":[{"version":"3.0.3","date":"2026-08-05","highlights":["Limited-time 'Block Adventure' event on Wish Island (Aug 5-23): fight blocky creatures, challenge the Block Wanderer boss, earn morphed Deviations (Zapamander, Nutcracker & Dr. Teddy variants).","Online Trading overhaul: purchase-order buying requests, reduced bind times, watchlist expanded to 20 items, trading extended to ingots, formulas, cosmetic fish and animals.","New Permanent Server Monthly Challenges with mod-acquisition rewards via Scenario Honor (30-day reset).","Console launch support announced for Aug 25 with cross-platform account linking (PC/mobile/console).","Custom Server territory settings now customizable per user role.","Lightforge Loot Crate 'Dreamtide' (mythic skins, legendary cosmetics); Block World crossover and Midsummer Fizz shop items.","First-person mode optimizations, fishing mechanic clarifications, tech interface improvements, misc. bug fixes."]},{"version":"3.0.2","date":"2026-07-22","highlights":["Territory Construction: flexible snap-point switching for walls, ceilings, roofs, stairs and pillars.","Account-wide appearance preset sharing across characters/scenarios (12-preset limit per gender).","New Item Lock system to prevent accidental discard/trade/disassembly of valuable items.","RaidZone: Mental Pollution — new zones drain mentality over time, offset by gear's Mental Resistance stat; 4 new survival suits trade defense for mental resistance.","RaidZone farming & breeding enhancements: rare plant harvesting, preferred food rewards for livestock.","Custom Server overhaul: server recommendations, exclusive gameplay tags, custom dungeon settings, benefit event (Jul 23-Aug 20).","Lightforge Loot Crate summer return (5 themes); new furniture/facility skin packs (Jul 29).","Balance: ZapCam duration/range up, cooldown up; Mini Wonder duration down, cooldown up; Pyro Dino fire suppression heavily nerfed; SN700-Finale reverb stacks reduced to 4 with adjusted damage scaling."]},{"version":"2.4.1","date":"2026-05-27","highlights":["Visional Wheel S4: Gravity Abyss — zero-gravity combat across floating islands; new Riftwalker aerial boss; Gravity Imbalance exploration, Riftwalker Relic collection, Aerial Hunt, Gravity Integrator challenge modes.","New Wishlist system for shop items with privacy controls; enhanced gifting with friend sorting, personal messages, duplicate-prevention refunds.","New rewards: Abyssal Cores (epic/legendary/mythic), Abyssal Essence, 3 new Morphed Deviations, Aero & Downstar mods, armor Shiny Mods.","Balance: AUG-Electron Cloud flexibility changed; Compound Bow-The Burden of Betrayal damage consistency/burst adjusted; Glide Pants stamina consumption changed.","Terrain adjustments west of Chalk Peak required territory relocation for affected players.","Meta Pass monthly cosmetic rotations; Custom Server 'Special Drops' mode; wedding-themed and carnival shop packs."]},{"version":"2.3.8","date":"2026-05-13","highlights":["Weapon Customization system: freely customize weapon stats and mix-and-match dozens of newly designed weapon traits."]},{"version":"2.3.6","date":"2026-04-08","highlights":["MAJOR MECHANIC CHANGE — Tech System overhaul: the entire Memetic Specialization system (level-gated, choose-1-of-4-every-5-levels, Cradle/Cipher/Meme Points) was removed and replaced by a single Tech Tree with four branches — Survival, Production, Combat, Building.","New unlock methods: Tech Tree Allocation (Tech Points from leveling, facility research, chest exploration, defeating Elites), Reverse Engineering (unlock a formula from a collected cultural artifact at a research bench), and Tech Invention (experiment with material combinations at a research bench for a variable success rate).","Product/material simplification: most fabric types collapsed into Cotton Fabric, parts into Standard Parts, plastics into All-Purpose Plastic; rare metal crystals no longer mandatory for gear crafting.","Removed 5 intermediate-tier crafting facilities (Intermediate Supplies Workbench, Intermediate Weapons Bench, Intermediate Garage, Small Synthesis Bench, Intermediate Stove) and folded their formulas into the corresponding Advanced-tier facility, moving that facility's unlock earlier in the tree.","New terraforming feature for Eternaland; refined the mod recovery period to 7 days (see the 2026-01-21 mod system entry below)."]},{"version":"n/a (dev blog + live change)","date":"2026-01-21","highlights":["MAJOR MECHANIC CHANGE — Mod System Overhaul: mods gained fixed sub-attributes (no more random rolls); a mod's level (1-17) is now the sum of its sub-attribute levels, and past Lv. 17 players chase 'Shiny' variants (same sub-attributes, stronger main attribute) instead of re-rolling.","Added targeted mod acquisition: redeem Mod Dust + Energy Links at the Shop for a Random Mod Crate targeting a specific level range, alongside the existing dungeon/game-mode drop sources.","Compensation crates (e.g. Shiny Mod Selection Crate) issued to players with many Lv. 17 mods from the old system."]}],"majorContentEras":[{"name":"Launch / Evolution's Call","notes":"Base game and the Manibus region."},{"name":"Way of Winter","notes":"Winter-themed seasonal Visional World."},{"name":"Mod System Overhaul","notes":"Fixed sub-attributes + targeted acquisition replacing the old random-roll mod system, live from Jan 21, 2026."},{"name":"Tech System Overhaul","notes":"Replaced the old Memetic Specialization system with a single 4-branch Tech Tree (Survival/Production/Combat/Building), patch 2.3.6, April 8, 2026 — see the notice on the Builds & C <script>
/* --- 01-utils.js --- */
// Once Human Database — shared utilities
// Everything attaches to window.OH so plain <script> tags (no build step,
// no ES modules) can share state across files in load order.
window.OH = window.OH || {};

OH.esc = function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
};

OH.slugify = function slugify(s) {
  return String(s || "")
    .toLowerCase()
    .trim()
    .replace(/[''"()!.]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-+|-+$)/g, "");
};

OH.keyFor = function keyFor(item) {
  return item.id || OH.slugify(item.name);
};

OH.capitalize = function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
};

OH.debounce = function debounce(fn, ms) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
};

// --- localStorage helpers (favorites / recently viewed) -------------------
// Every call is wrapped because localStorage can throw (private mode,
// storage disabled, quota) and a broken favorites feature should never take
// the rest of the page down with it.
OH.storage = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }
};

OH.formatList = function formatList(arr) {
  return (arr || []).map(OH.esc).join(", ");
};


/* --- 02-constants.js --- */
// Once Human Database — navigation structure & shared constants
window.OH = window.OH || {};

// Grouped navigation: DATABASE / BUILD / WORLD / INFO instead of one long
// row of 16 tabs. Each entry's `id` is the route/tab id used everywhere else
// (parseHash, DATA_FILES keys where applicable, render dispatch).
OH.NAV_GROUPS = [
  {
    id: "database",
    label: "Database",
    items: [
      { id: "weapons", label: "Weapons" },
      { id: "armor", label: "Armor" },
      { id: "mods", label: "Mods" },
      { id: "attachments", label: "Accessories" },
      { id: "deviants", label: "Deviants" },
      { id: "ranching", label: "Ranching" },
      { id: "crops", label: "Crops" },
      { id: "food", label: "Food & Cooking" },
      { id: "bosses", label: "Bosses" }
    ]
  },
  {
    id: "build",
    label: "Build",
    items: [
      { id: "buildfinder", label: "Build Finder" },
      { id: "builds", label: "Builds & Classes" },
      { id: "techtree", label: "Tech Tree" },
      { id: "memetics", label: "Memetics (Legacy)" }
    ]
  },
  {
    id: "world",
    label: "World",
    items: [
      { id: "regions", label: "Regions" },
      { id: "stations", label: "Stations" },
      { id: "blueprints", label: "Blueprints" }
    ]
  },
  {
    id: "info",
    label: "Info",
    items: [
      { id: "favorites", label: "Favorites" },
      { id: "updates", label: "Updates" },
      { id: "sources", label: "Sources" }
    ]
  }
];

// Flat lookup derived from the groups above, plus routes with no nav entry
// (home is reached via logo/search, compare is reached via the Compare
// button, not a nav link).
OH.FLAT_TABS = [{ id: "home", label: "Overview" }]
  .concat(OH.NAV_GROUPS.flatMap(g => g.items))
  .concat([{ id: "compare", label: "Compare" }]);

OH.TAB_LABELS = Object.fromEntries(OH.FLAT_TABS.map(t => [t.id, t.label]));

// Tabs whose cards open a dedicated detail page.
OH.DETAIL_TABS = new Set([
  "weapons", "armor", "attachments", "mods", "blueprints", "stations",
  "builds", "classes", "memetics", "deviants", "ranching", "crops", "food", "bosses"
]);
OH.LIST_ONLY_TABS = new Set(["regions", "updates", "sources", "favorites", "buildfinder", "techtree", "home"]);

// archetype id -> exact mods.json group.effect string (kept explicit rather
// than derived from slugify() because "Marked / Bull's Eye" doesn't

const CHANGE_TYPE_PATTERNS = [
  { id: "removed", label: "REMOVED", re: /\b(remov(ed|al)|discontinued|no longer)\b/i },
  { id: "fixed", label: "FIXED", re: /\b(bug fix|fixed|fixes|fix(es)?\b)/i },

OH.derivePvpPve = function derivePvpPve(text) {
  if (!text) return "unspecified";

OH.SEARCH_CATEGORIES = [

  { tab: "attachments", label: "Accessories" },

OH.buildSearchCorpus = function buildSearchCorpus() {
  const idx = OH.idx;
  const corpus = [];
  const push = (tab, id, title, fields, subtitle) => {
    corpus.push({ tab, id, title, subtitle: subtitle || "", haystack: [title, ...fields].filter(Boolean).join(" ␟ ").toLowerCase() });
  };

  idx.weapons.forEach(w => {
    const typeLabel = OH.idx.weaponTypeById[w.type] ? OH.idx.weaponTypeById[w.type].name : w.type;
    push("weapons", w._key, w.name, [
      w.type, typeLabel, w.rarity, w.notes, w.acquisition, (w.confirmedArchetype || []).join(" ")
    ], typeLabel);
  });

  idx.armorSets.forEach(s => push("armor", s._key, s.name, [
    s.rarity, s.playstyle, (s.bonusesByPiece || []).map(b => b.effect).join(" ")
  ], "Armor Set"));

  idx.mods.forEach(m => push("mods", m._key, m.name, [m.effect, m.groupEffect, m.groupObtainedFrom], m.groupEffect));

  idx.attachmentTypes.forEach(t => push("attachments", t._key, t.name, [t.effect, ...(t.examples || [])], "Accessory Type"));

  idx.builds.forEach(b => push("builds", b._key, b.name, [b.summary, b.role, b.archetype, ...(b.recommendedArmor || []), ...(b.recommendedFood || [])], b.role));

  idx.archetypes.forEach(a => push("classes", a._key, a.name, [a.summary, a.role], "Weapon Effect"));

  idx.deviants.forEach(v => push("deviants", v._key, v.name, [v.ability, v.category, v.crossRef, v.location], v.category));

  idx.livestock.forEach(l => push("ranching", l._key, l.name, [l.products, l.tier, l.notes], "Ranching"));

  idx.crops.forEach(c => push("crops", c._key, c.name, [c.uses, c.foundNear], "Crop"));

  idx.foodRecipes.forEach(r => push("food", r._key, r.name, [r.effect, ...(r.ingredients || []), r.category], r.category));

  idx.bosses.forEach(b => push("bosses", b._key, b.name, [b.mechanics, b.context, b.drops, b.location], b._kind === "greatOne" ? "Great One" : b.type));

  idx.blueprintCategories.forEach(c => push("blueprints", c._key, c.name, [c.description, ...(c.examples || [])], "Blueprint Category"));

  idx.stationsAll.forEach(s => push("stations", s._key, s.name, [s.produces, s.unlock], s._group));

  idx.memetics.forEach(m => push("memetics", m._key, m.name, [m.effect, m.branch], "Legacy Memetic"));

  return corpus;
};

// Small set of common weapon-category shorthand — expanding these lets
// "AR", "SR", "SMG" etc. match the full type name even though the corpus
// stores the human-readable label, not the abbreviation.
OH.SEARCH_ALIASES = {
  ar: "assault rifle", sr: "sniper rifle", sg: "shotgun",
  smg: "submachine gun", lmg: "light machine gun", mg: "machine gun"
};

// Plain Levenshtein edit distance — small dataset, no need for a library.
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const row = new Array(n + 1);
  for (let j = 0; j <= n; j++) row[j] = j;
  for (let i = 1; i <= m; i++) {
    let prevDiag = row[0];
    row[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = row[j];
      row[j] = Math.min(
        row[j] + 1,          // deletion
        row[j - 1] + 1,      // insertion
        prevDiag + (a[i - 1] === b[j - 1] ? 0 : 1) // substitution
      );
      prevDiag = tmp;
    }
  }
  return row[n];
}

// Scoring: exact title match > title starts-with > title contains > body
// contains > (only if nothing above matched anything) a fuzzy title match
// tolerant of a typo or two, so "Shrapnal"/"Pwoer Surge" still find something
// instead of the dead-end an exact-substring-only search gives.
OH.searchCorpus = function searchCorpus(corpus, query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const qExpanded = OH.SEARCH_ALIASES[q];
  const scored = [];
  for (const entry of corpus) {
    const title = entry.title.toLowerCase();
    let score = 0;
    if (title === q) score = 100;
    else if (title.startsWith(q)) score = 80;
    else if (title.includes(q)) score = 60;
    else if (entry.haystack.includes(q)) score = 30;
    else if (qExpanded && entry.haystack.includes(qExpanded)) score = 30;
    if (score > 0) scored.push({ ...entry, score });
  }
  if (scored.length) {
    scored.sort((a, b) => b.score - a.score);
    return scored;
  }
  // Nothing matched even loosely — fall back to fuzzy title matching only
  // (not the whole haystack, which would produce noisy false positives).
  // Tolerance scales gently with query length so a short query doesn't
  // fuzzy-match half the database.
  if (q.length < 3) return [];
  const maxDistance = q.length <= 5 ? 1 : q.length <= 9 ? 2 : 3;
  const fuzzy = [];
  for (const entry of corpus) {
    const title = entry.title.toLowerCase();
    // Compare against the whole title and each individual word, since a
    // typo'd single word inside a multi-word title shouldn't be penalized
    // by the length of the rest of the title.
    let best = editDistance(title, q);
    title.split(/\s+/).forEach(word => { best = Math.min(best, editDistance(word, q)); });
    if (best <= maxDistance) fuzzy.push({ ...entry, score: 20 - best });
  }
  fuzzy.sort((a, b) => b.score - a.score);
  return fuzzy;
};

OH.groupSearchResults = function groupSearchResults(results, maxPerCategory) {
  const byTab = {};
  results.forEach(r => {
    if (!byTab[r.tab]) byTab[r.tab] = [];
    byTab[r.tab].push(r);
  });
  return OH.SEARCH_CATEGORIES
    .map(cat => ({ ...cat, results: (byTab[cat.tab] || []).slice(0, maxPerCategory || 6), total: (byTab[cat.tab] || []).length }))
    .filter(cat => cat.results.length);
};

// Once Human Database — favorites + recently viewed (localStorage)
window.OH = window.OH || {};

const FAV_KEY = "oh-db:favorites:v1";
const RECENT_KEY = "oh-db:recently-viewed:v1";
const RECENT_MAX = 12;

OH.getFavorites = function getFavorites() {
  return OH.storage.get(FAV_KEY, []);
};

OH.isFavorite = function isFavorite(kind, id) {
  return OH.getFavorites().some(f => f.kind === kind && f.id === id);
};

OH.toggleFavorite = function toggleFavorite(kind, id, title) {
  const favs = OH.getFavorites();
  const idx = favs.findIndex(f => f.kind === kind && f.id === id);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.unshift({ kind, id, title, addedAt: new Date().toISOString() });
  OH.storage.set(FAV_KEY, favs);
  return idx < 0; // true if it was just added
};

OH.getRecentlyViewed = function getRecentlyViewed() {
  return OH.storage.get(RECENT_KEY, []);
};

OH.pushRecentlyViewed = function pushRecentlyViewed(kind, id, title) {
  if (!kind || !id) return;
  let list = OH.getRecentlyViewed();
  list = list.filter(r => !(r.kind === kind && r.id === id));
  list.unshift({ kind, id, title, viewedAt: new Date().toISOString() });
  list = list.slice(0, RECENT_MAX);
  OH.storage.set(RECENT_KEY, list);
};

// A favorited/recently-viewed entry only stores {kind,id,title} — this
// resolves it back to a live item from the current indexes so titles/notes
// stay in sync with the data even if it changes after the fact.
OH.resolveEntry = function resolveEntry(entry) {
  const finders = {
    weapons: OH.findWeapon, armor: OH.findArmorSet, mods: OH.findMod,
    builds: OH.findBuild, deviants: OH.findDeviant, crops: OH.findCrop,
    food: OH.findFoodRecipe, bosses: OH.findBoss
  };
  const finder = finders[entry.kind];
  const item = finder ? finder(entry.id) : null;
  return { entry, item, exists: !!item };
};

// Once Human Database — generic filter + sort framework for list pages
window.OH = window.OH || {};

// A filterConfig entry: { key, label, accessor(item) -> value|value[], options: [{value,label}] }
// Multi-value accessors (e.g. an item tagged with several archetypes) are
// supported — the item matches if the active filter value is included.
OH.getActiveFilters = function getActiveFilters(tab) {
  return OH.state.filters[tab] || {};
};
OH.setFilter = function setFilter(tab, key, value) {
  OH.state.filters[tab] = OH.state.filters[tab] || {};
  if (value === "" || value == null) delete OH.state.filters[tab][key];
  else OH.state.filters[tab][key] = value;
};
OH.clearFilters = function clearFilters(tab) {
  OH.state.filters[tab] = {};
};

OH.applyFilters = function applyFilters(items, filterConfig, activeFilters) {
  return items.filter(item => {
    return filterConfig.every(f => {
      const active = activeFilters[f.key];
      if (!active) return true;
      const val = f.accessor(item);
      if (Array.isArray(val)) return val.includes(active);
      return val === active;
    });
  });
};

OH.applySort = function applySort(items, sortConfig, activeSort) {
  if (!activeSort || !activeSort.key) return items;
  const cfg = sortConfig.find(s => s.key === activeSort.key);
  if (!cfg) return items;
  const dir = activeSort.dir === "desc" ? -1 : 1;
  return [...items].sort((a, b) => {
    const av = cfg.accessor(a), bv = cfg.accessor(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return dir * av.localeCompare(bv);
    return dir * (av - bv);
  });
};

OH.renderFilterBar = function renderFilterBar(tab, filterConfig, activeFilters, sortConfig, activeSort) {
  const esc = OH.esc;
  const hasActive = Object.keys(activeFilters).length > 0 || (activeSort && activeSort.key);
  const selects = filterConfig.map(f => `
    <label class="filter-field">
      <span>${esc(f.label)}</span>
      <select data-filter-tab="${esc(tab)}" data-filter-key="${esc(f.key)}">
        <option value="">All</option>
        ${f.options.map(o => `<option value="${esc(o.value)}" ${activeFilters[f.key] === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}
      </select>
    </label>
  `).join("");
  const sortSelect = sortConfig && sortConfig.length ? `
    <label class="filter-field">
      <span>Sort by</span>
      <select data-sort-tab="${esc(tab)}">
        <option value="">Default</option>
        ${sortConfig.map(s => `
          <option value="${esc(s.key)}:asc" ${activeSort && activeSort.key === s.key && activeSort.dir !== "desc" ? "selected" : ""}>${esc(s.label)} ↑</option>
          <option value="${esc(s.key)}:desc" ${activeSort && activeSort.key === s.key && activeSort.dir === "desc" ? "selected" : ""}>${esc(s.label)} ↓</option>
        `).join("")}
      </select>
    </label>
  ` : "";
  return `
    <div class="filter-bar" role="group" aria-label="Filter and sort">
      ${selects}
      ${sortSelect}
      ${hasActive ? `<button type="button" class="filter-clear" data-filter-clear="${esc(tab)}">Clear filters</button>` : ""}
    </div>
  `;
};

OH.wireFilterBar = function wireFilterBar(root, onChange) {
  root.querySelectorAll("[data-filter-tab]").forEach(sel => {
    sel.addEventListener("change", () => {
      OH.setFilter(sel.dataset.filterTab, sel.dataset.filterKey, sel.value);
      onChange();
    });
  });
  root.querySelectorAll("[data-sort-tab]").forEach(sel => {
    sel.addEventListener("change", () => {
      const tab = sel.dataset.sortTab;
      if (!sel.value) { OH.state.sort[tab] = null; }
      else {
        const [key, dir] = sel.value.split(":");
        OH.state.sort[tab] = { key, dir };
      }
      onChange();
    });
  });
  root.querySelectorAll("[data-filter-clear]").forEach(btn => {
    btn.addEventListener("click", () => {
      OH.clearFilters(btn.dataset.filterClear);
      OH.state.sort[btn.dataset.filterClear] = null;
      onChange();
    });
  });
};

            <div class="meta"><span class="tag">${OH.esc(b.role)}</span>${OH.pvpPveTag(b._pvpPve)}</div>
            <p>${OH.esc(b.summary)}</p>

        `).join("") || OH.emptyState(OH.state.query)}

  `;
};

OH.renderBuildDetail = function renderBuildDetail(key) {
  const b = OH.findBuild(key);
  if (!b) return null;
  OH.pushRecentlyViewed("builds", b._key, b.name);
  const arch = OH.findArchetype(b.archetype);
  const primary = b.primaryWeapon ? OH.findWeapon(b.primaryWeapon) : null;
  const secondaries = (b.secondaryWeapons || []).map(OH.findWeapon).filter(Boolean);
  const melee = b.meleeOption ? OH.findWeapon(b.meleeOption) : null;
  const weaponCard = (w, roleLabel) => `
    ${OH.cardOpen("weapons", w._key)}
      <h3>${OH.esc(w.name)}</h3>
      <div class="meta"><span class="tag">${OH.esc(roleLabel)}</span>${OH.rarityDot(w.rarity)}</div>
      <p>${OH.esc(w.notes || "")}</p>
    </div>`;
  const modLinks = (b.suggestedMods || []).map(name => {
    const found = OH.idx.mods.find(m => m.name === name);
    return found ? OH.link("mods", found._key, name) : OH.esc(name);
  });

  return `
    ${OH.breadcrumb("builds", "Builds & Classes", b.name)}
    <div class="detail-head">
      <h2>${OH.esc(b.name)}</h2>
      ${OH.favoriteButton("builds", b._key, b.name)}
    </div>
    <div class="meta detail-meta">
      <span class="tag">${OH.esc(b.role)}</span>
      ${arch ? `<span class="tag">${OH.link("classes", arch._key, arch.name)}</span>` : ""}
      ${OH.pvpPveTag(b._pvpPve)}
    </div>
    <p>${OH.esc(b.summary)}</p>
    ${b.dpsClaimNote ? OH.notice(b.dpsClaimNote) : ""}

    <div class="section-block">
      <h3>Weapons</h3>
      <div class="grid">
        ${primary ? weaponCard(primary, "Primary weapon") : ""}
        ${secondaries.map(w => weaponCard(w, "Secondary weapon")).join("")}
        ${melee ? weaponCard(melee, "Melee option") : ""}
        ${!primary && !secondaries.length && !melee ? "<p class='intro'>None listed.</p>" : ""}
      </div>
    </div>

    <div class="loadout-grid">
      <div class="section-block">
        <h3>Key stats to prioritize</h3>
        ${b.keyStats ? `<ul>${b.keyStats.map(s => `<li>${OH.esc(s)}</li>`).join("")}</ul>` : `<p class="intro">Not specified in this build's source notes.</p>`}
      </div>
      <div class="section-block">
        <h3>Suggested mods</h3>
        ${modLinks.length ? `<ul>${modLinks.map(m => `<li>${m}</li>`).join("")}</ul>` : `<p class="intro">Not specified in this build's source notes.</p>`}
      </div>
      <div class="section-block">
        <h3>Armor ${b.gearVerification ? OH.verificationBadge(b.gearVerification, { compact: true }) : ""}</h3>
        ${b.recommendedArmor && b.recommendedArmor.length
          ? `<ul>${b.recommendedArmor.map(a => `<li>${OH.esc(a)}</li>`).join("")}</ul>`
          : `<p class="intro">This database's build notes don't specify a required armor set for this build — see <a href="#armor">Armor</a> for general set-bonus options that fit the role above.</p>`}
      </div>
      <div class="section-block">
        <h3>Food &amp; buffs ${b.gearVerification && b.recommendedFood && b.recommendedFood.length ? OH.verificationBadge(b.gearVerification, { compact: true }) : ""}</h3>
        ${b.recommendedFood && b.recommendedFood.length
          ? `<ul>${b.recommendedFood.map(f => {
              const found = OH.foodRecipeByLooseName(f);
              return `<li>${found ? OH.link("food", found._key, f) : OH.esc(f)}</li>`;
            }).join("")}</ul><p class="intro">${OH.esc(b.foodNote || "")}</p>`
          : `<p class="intro">${b.foodNote ? OH.esc(b.foodNote) : `Not specified in this build's source notes — see <a href="#food">Food &amp; Cooking</a> for general buff options.`}</p>`}
      </div>
    </div>

    ${b.recommendedDeviant ? `<div class="section-block"><h3>Deviant</h3><p class="intro">${OH.esc(b.recommendedDeviant)}</p></div>` : ""}

    <div class="section-block">
      <h3>How to obtain the core weapon</h3>
      ${primary ? OH.obtainBadges(primary._obtainMethods) : `<p class="intro">No primary weapon listed.</p>`}
    </div>

    <div class="section-block">
      <h3>Data verification</h3>
      ${OH.verificationObjectBlock(b.verification)}
      <p class="intro"><strong>Patch compatibility:</strong> compiled against game version ${OH.esc(OH.state.data.meta.gameVersionAtCompile)}; not independently re-verified against every subsequent patch. Check <a href="#updates">Updates</a> for anything that might have changed this build's weapon effect or mods since.</p>
    </div>

    ${OH.backLink("builds", "Builds & Classes")}
  `;
};

OH.renderArchetypeDetail = function renderArchetypeDetail(key) {

          <thead><tr><th>Mod</th><th>Effect</th></tr></thead>
          <tbody>${group.mods.map(m => `<tr><td data-label="Mod">${OH.link("mods", group._key + "--" + OH.slugify(m.name), m.name)}</td><td data-label="Effect">${OH.esc(m.effect)}</td></tr>`).join("")}</tbody>

    ${OH.backLink("builds", "Builds & Classes")}

const BRANCH_LABELS = { gathering: "Gathering", crafting: "Crafting", management: "Management", building: "Building" };

OH.renderMemetics = function renderMemetics() {

    <p class="intro">${OH.esc(m.overview)}</p>

/* --- 11-pages-combat.js --- */
// Once Human Database — Weapons / Armor / Attachments / Mods pages
window.OH = window.OH || {};
const esc11 = OH.esc;

function matchesQuery(text) {
  if (!OH.state.query) return true;
  return String(text).toLowerCase().includes(OH.state.query);
}
function labelForType(id, types) {
  const t = types.find(t => t.id === id);
  return t ? t.name : id;
}

/* ---------------------------------------------------------------------- */
/* Weapons                                                                 */
/* ---------------------------------------------------------------------- */

const WEAPON_FILTER_CONFIG = () => [
  { key: "type", label: "Weapon Type", accessor: w => w.type, options: OH.state.data.weapons.weaponTypes.map(t => ({ value: t.id, label: t.name })) },
  { key: "rarity", label: "Rarity", accessor: w => w.rarity, options: OH.state.data.weapons.rarities.map(r => ({ value: r.id, label: r.name })) },
  { key: "tier", label: "Tier", accessor: w => w.tier, options: ["S", "A", "B", "C"].map(t => ({ value: t, label: `Tier ${t}` })) },
  { key: "archetype", label: "Weapon Effect", accessor: w => w.confirmedArchetype || [], options: OH.idx.archetypes.map(a => ({ value: a._key, label: a.name })) },
  { key: "pvpPve", label: "PvE/PvP", accessor: w => w._pvpPve, options: [{ value: "pve", label: "PvE" }, { value: "pvp", label: "PvP" }, { value: "both", label: "PvE / PvP" }, { value: "unspecified", label: "Unspecified" }] }
];
const WEAPON_SORT_CONFIG = [
  { key: "name", label: "Name", accessor: w => w.name },
  { key: "tier", label: "Tier", accessor: w => ({ S: 0, A: 1, B: 2, C: 3 }[w.tier] ?? 9) },
  { key: "rarity", label: "Rarity", accessor: w => OH.RARITY_ORDER.indexOf(w.rarity) },
  { key: "damage", label: "Damage", accessor: w => typeof w.damage === "number" ? w.damage : parseFloat(w.damage) || null },
  { key: "fireRate", label: "Fire Rate", accessor: w => w.fireRate || null }
];

OH.renderWeapons = function renderWeapons() {
  const w = OH.state.data.weapons;
  const filterConfig = WEAPON_FILTER_CONFIG();
  const active = OH.getActiveFilters("weapons");
  let items = OH.idx.weapons.filter(x => matchesQuery(x.name + x.type + (x.notes || "")));
  items = OH.applyFilters(items, filterConfig, active);
  items = OH.applySort(items, WEAPON_SORT_CONFIG, OH.state.sort.weapons);
  const compareBar = OH.renderCompareBar("weapons");
  return `
    <h2>Weapons</h2>
    <p class="intro">${esc11(w.note)}</p>
    <div class="badge-list">${w.weaponTypes.map(t => `<span class="tag" title="${esc11(t.description)}">${esc11(t.name)}</span>`).join("")}</div>
    ${OH.renderFilterBar("weapons", filterConfig, active, WEAPON_SORT_CONFIG, OH.state.sort.weapons)}
    ${compareBar}
    <div class="grid">
      ${items.map(x => `
        ${OH.cardOpen("weapons", x._key)}
          <div class="card-top-row">
            ${OH.weaponTypeIcon(x.type)}
            <input type="checkbox" class="compare-check" data-compare-kind="weapons" data-compare-id="${esc11(x._key)}" ${OH.state.compareSelection.some(c => c.kind === "weapons" && c.id === x._key) ? "checked" : ""} aria-label="Select ${esc11(x.name)} to compare">
            ${OH.favoriteButton("weapons", x._key, x.name)}
          </div>
          <h3>${esc11(x.name)}</h3>
          <div class="meta">
            ${OH.rarityDot(x.rarity)}
            <span class="tag">${esc11(labelForType(x.type, w.weaponTypes))}</span>
            <span class="tag tier-${esc11(x.tier || "")}">Tier ${esc11(x.tier || "?")}</span>
            <span class="tag">${esc11(OH.capitalize(x.rarity))}</span>
          </div>
          ${x.damage ? `<p><strong>Damage:</strong> ${esc11(x.damage)}${x.fireRate ? ` · <strong>RPM:</strong> ${esc11(x.fireRate)}` : ""}</p>` : ""}
          <p>${esc11(x.notes || "")}</p>
          <div class="meta">${OH.pvpPveTag(x._pvpPve)}</div>
        </div>
      `).join("") || OH.emptyState(OH.state.query)}
    </div>
  `;
};

OH.renderWeaponDetail = function renderWeaponDetail(key) {
  const w = OH.findWeapon(key);
  if (!w) return null;
  OH.pushRecentlyViewed("weapons", key, w.name);
  const station = OH.findStation(w.craftingStation);
  const builds = OH.buildsByWeapon(w._key);
  const archetypeCard = aid => {
    const arch = OH.findArchetype(aid);
    const group = OH.findModGroupByArchetype(aid);
    if (!arch) return "";
    return `
      <div class="card">
        <h3>${OH.link("classes", arch._key, arch.name)}</h3>
        <div class="meta"><span class="tag">${esc11(arch.role)}</span></div>
        <p>${esc11(arch.summary)}</p>
        ${group ? `<p><strong>Mods to run:</strong></p><ul>${group.mods.slice(0, 5).map(m => `<li>${OH.link("mods", OH.slugify(group.effect) + "--" + OH.slugify(m.name), m.name)} — ${esc11(m.effect)}</li>`).join("")}</ul>` : ""}
      </div>`;
  };
  const confirmedCards = (w.confirmedArchetype || []).map(archetypeCard).join("");

  return `
    ${OH.breadcrumb("weapons", "Weapons", w.name)}
    <div class="detail-head">
      <h2>${esc11(w.name)}</h2>
      ${OH.favoriteButton("weapons", w._key, w.name)}
    </div>
    <div class="meta detail-meta">
      <span class="tag">${esc11(labelForType(w.type, OH.state.data.weapons.weaponTypes))}</span>
      ${w.tier ? `<span class="tag tier-${esc11(w.tier)}">Tier ${esc11(w.tier)}</span>` : ""}
      ${OH.rarityDot(w.rarity)}<span class="tag">${esc11(OH.capitalize(w.rarity))}</span>
      ${OH.pvpPveTag(w._pvpPve)}
    </div>
    ${w.damage ? `<p><strong>Damage:</strong> ${esc11(w.damage)}${w.fireRate ? ` &middot; <strong>Fire rate:</strong> ${esc11(w.fireRate)} RPM` : ""}</p>` : ""}
    <p>${esc11(w.notes || "")}</p>
    ${w.archetypeNote ? `<p class="intro">${esc11(w.archetypeNote)}</p>` : ""}

    <div class="section-block">
      <h3>Where to get it &amp; how to craft it</h3>
      <div class="meta mb-sm">${OH.obtainBadges(w._obtainMethods)}</div>
      <p class="intro intro-tight">${esc11(w.acquisition)}</p>
      ${station ? `<div class="card"><h3>${OH.link("stations", station._key, station.name)}</h3><div class="meta"><span class="tag">Tier ${esc11(station.tier)}</span>${station.unlockVerification ? OH.verificationBadge(station.unlockVerification) : ""}</div>${station.unlock ? `<p>${esc11(station.unlock)}</p>` : ""}${station.materials ? `<p><strong>Materials:</strong> ${station.materials.map(esc11).join(", ")}</p>` : ""}<p>${esc11(station.produces)}</p></div>` : ""}
    </div>

    ${confirmedCards
      ? `<div class="section-block"><h3>Confirmed built-in weapon effect ${OH.verificationBadge("confirmed", { compact: true })}</h3><p class="intro intro-tight">This specific weapon's own kit is independently confirmed to trigger this effect.</p><div class="grid">${confirmedCards}</div></div>`
      : `<div class="section-block"><h3>Weapon effects</h3><p class="intro intro-tight">This weapon has no confirmed intrinsic weapon effect. In Once Human, effects like Shrapnel, Power Surge, Frost Vortex, Bounce, Fast Gunner, Burn, Unstable Bomber, Fortress Warfare and Marked come from whichever core-effect mod you equip — most mods fit most weapons in that slot. Browse the ${OH.link("mods", "", "Mods section")} to pick one, or the ${OH.link("builds", "", "Builds & Classes section")} for full named loadouts.</p></div>`}

    ${builds.length ? `<div class="section-block"><h3>Used in builds</h3><div class="grid">${builds.map(b => `<div class="card"><h3>${OH.link("builds", b._key, b.name)}</h3><div class="meta"><span class="tag">${esc11(b._role)}</span><span class="tag">${esc11(b.role)}</span></div><p>${esc11(b.summary)}</p></div>`).join("")}</div></div>` : ""}

    <div class="section-block">
      <h3>Data verification</h3>
      ${OH.verificationObjectBlock(w.verification)}
    </div>

    ${OH.backLink("weapons", "Weapons")}
  `;
};

function armorBonusSummary(s) {
  if (!s.bonusesByPiece || !s.bonusesByPiece.length) return "";
  return s.bonusesByPiece.map(b => `${b.pieces}pc: ${b.effect}`).join(" ");
}

const ARMOR_FILTER_CONFIG = () => [
  { key: "rarity", label: "Rarity", accessor: s => s.rarity, options: [...new Set(OH.idx.armorSets.map(s => s.rarity))].map(r => ({ value: r, label: OH.capitalize(r) })) },
  { key: "pieces", label: "Pieces", accessor: s => String(s.pieces), options: [...new Set(OH.idx.armorSets.map(s => s.pieces))].sort().map(p => ({ value: String(p), label: `${p} pieces` })) }
];

OH.renderArmor = function renderArmor() {
  const a = OH.state.data.armor;
  const filterConfig = ARMOR_FILTER_CONFIG();
  const active = OH.getActiveFilters("armor");
  let sets = OH.idx.armorSets.filter(s => matchesQuery(s.name + armorBonusSummary(s) + (s.playstyle || "")));

    <h2>Armor</h2>
    <p class="intro">${esc11(a.overview)}</p>

      <h3>Attributes</h3>
      <div class="grid">

      <p class="intro">${esc11(a.craftingNote)}</p>
      <p class="intro">${esc11(a.setBonusMechanic)}</p>
    </div>
    <div class="section-block">
      <h3>Armor Sets <span class="tag">${sets.length}</span></h3>
      ${OH.renderFilterBar("armor", filterConfig, active, null, null)}
      ${OH.renderCompareBar("armor")}
      <div class="grid">
        ${sets.map(s => `
          ${OH.cardOpen("armor", s._key)}
            <div class="card-top-row">
              <input type="checkbox" class="compare-check" data-compare-kind="armor" data-compare-id="${esc11(s._key)}" ${OH.state.compareSelection.some(c => c.kind === "armor" && c.id === s._key) ? "checked" : ""} aria-label="Select ${esc11(s.name)} to compare">
              ${OH.favoriteButton("armor", s._key, s.name)}
            </div>
            <h3>${esc11(s.name)}</h3>
            <div class="meta">${OH.rarityDot(s.rarity)}<span class="tag">${esc11(OH.capitalize(s.rarity))}</span><span class="tag">${esc11(s.pieces)}pc</span><span class="tag">${esc11(s.bonusCount)} bonus${s.bonusCount === 1 ? "" : "es"}</span></div>
            ${s.bonusesByPiece && s.bonusesByPiece.length ? `<p>${esc11(s.bonusesByPiece[s.bonusesByPiece.length - 1].effect)}</p>` : `<p class="intro mt-xs">Set bonus text not confirmed by available sources — see the note below.</p>`}
          </div>
        `).join("") || OH.emptyState(OH.state.query)}
      </div>
      <p class="intro mt-lg">${esc11(a.note)}</p>

  `;
};

OH.renderArmorSetDetail = function renderArmorSetDetail(key) {
  const s = OH.findArmorSet(key);
  if (!s) return null;
  OH.pushRecentlyViewed("armor", key, s.name);
  return `
    ${OH.breadcrumb("armor", "Armor", s.name)}
    <div class="detail-head"><h2>${esc11(s.name)}</h2>${OH.favoriteButton("armor", s._key, s.name)}</div>

const COMPARE_FINDERS = { weapons: OH.findWeapon, armor: OH.findArmorSet };

OH.renderCompareBar = function renderCompareBar(kind) {
  const sel = OH.state.compareSelection.filter(c => c.kind === kind);
  if (!sel.length) return "";
  const finder = COMPARE_FINDERS[kind] || OH.findWeapon;
  return `
    <div class="compare-bar">
      <span>Comparing: ${sel.map(c => esc11((finder(c.id) || {}).name || c.id)).join(" vs ")}</span>
      ${sel.length >= 2 ? `<button type="button" class="btn-primary" data-compare-go="${esc11(kind)}">Compare now</button>` : `<span class="intro">Pick one more to compare.</span>`}
      <button type="button" class="filter-clear" data-compare-clear="${esc11(kind)}">Clear</button>
    </div>
  `;
};

// Renders a compare table with data-label on every cell so the mobile
// stacked layout (table.data-table td{display:block}) still shows which
// value belongs to which column instead of an unlabeled stack of text.
function compareTable(rows, items, colLabelFor) {
  return `
    <div class="table-wrap"><table class="data-table compare-table">
      <thead><tr><th></th>${items.map(colLabelFor).join("")}</tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td data-label="">${esc11(r.label)}</td>
          ${items.map(it => `<td data-label="${esc11(r.label)}">${esc11(r.get(it))}</td>`).join("")}
        </tr>`).join("")}
      </tbody>
    </table></div>
  `;
}

OH.renderCompare = function renderCompare(segments) {
  const [kind, ...ids] = segments;
  if (kind === "weapons" && ids.length >= 2) {
    const items = ids.map(OH.findWeapon).filter(Boolean);
    if (items.length < 2) return `<div class="empty-state">Couldn't find those weapons to compare. ${OH.backLink("weapons", "Weapons")}</div>`;
    const rows = [
      { label: "Type", get: w => labelForType(w.type, OH.state.data.weapons.weaponTypes) },
      { label: "Tier", get: w => w.tier || "—" },
      { label: "Rarity", get: w => OH.capitalize(w.rarity) },
      { label: "Damage", get: w => w.damage ?? "—" },
      { label: "Fire Rate", get: w => w.fireRate ? w.fireRate + " RPM" : "—" },
      { label: "Confirmed effect", get: w => (w.confirmedArchetype || []).map(a => (OH.findArchetype(a) || {}).name).join(", ") || "None confirmed" },
      { label: "PvE/PvP", get: w => ({ pve: "PvE", pvp: "PvP", both: "PvE / PvP", unspecified: "Unspecified" }[w._pvpPve]) },
      { label: "Acquisition", get: w => w.acquisition }
    ];
    return `
      <h2>Compare Weapons</h2>
      ${compareTable(rows, items, w => `<th>${OH.link("weapons", w._key, w.name)}</th>`)}
      ${OH.backLink("weapons", "Weapons")}
    `;
  }
  if (kind === "armor" && ids.length >= 2) {
    const items = ids.map(OH.findArmorSet).filter(Boolean);
    if (items.length < 2) return `<div class="empty-state">Couldn't find those armor sets to compare. ${OH.backLink("armor", "Armor")}</div>`;
    const rows = [
      { label: "Rarity", get: s => OH.capitalize(s.rarity) },
      { label: "Pieces", get: s => s.pieces },
      { label: "Bonus thresholds", get: s => s.bonusCount },
      { label: "Playstyle", get: s => s.playstyle || "—" },
      { label: "Best/last bonus", get: s => (s.bonusesByPiece && s.bonusesByPiece.length) ? s.bonusesByPiece[s.bonusesByPiece.length - 1].effect : "Not confirmed" },
      { label: "Verification", get: s => (s.verification && s.verification.status) || "unverified" }
    ];
    return `
      <h2>Compare Armor</h2>
      ${compareTable(rows, items, s => `<th>${OH.link("armor", s._key, s.name)}</th>`)}
      ${OH.backLink("armor", "Armor")}
    `;
  }
  return `<div class="empty-state">Select 2 items from the Weapons or Armor page to compare. ${OH.backLink("weapons", "Weapons")}</div>`;
};

function navItemHtml(item, activeTab) {
  const current = item.id === activeTab ? ` aria-current="page"` : "";
  return `<a href="#${OH.esc(item.id)}" class="nav-item"${current}>${OH.esc(item.label)}</a>`;
}

OH.buildNav = function buildNav(activeTab) {
  const groupsEl = document.getElementById("nav-groups");
  const drawerEl = document.getElementById("mobile-drawer");
  if (groupsEl) {
    groupsEl.innerHTML = OH.NAV_GROUPS.map(g => {
      const groupHasActive = g.items.some(i => i.id === activeTab);
      return `
        <div class="nav-group">
          <button type="button" class="nav-group-btn${groupHasActive ? " is-active-group" : ""}" aria-expanded="false" aria-haspopup="true">${OH.esc(g.label)}</button>
          <div class="nav-dropdown" role="menu">
            ${g.items.map(i => navItemHtml(i, activeTab)).join("")}
          </div>
        </div>
      `;
    }).join("");
  }
  if (drawerEl) {
    drawerEl.innerHTML = `
      <div class="drawer-head">
        <span>Menu</span>
        <button type="button" class="drawer-close" id="drawer-close" aria-label="Close menu">&times;</button>
      </div>
      <a href="#home" class="nav-item drawer-home"${activeTab === "home" ? ' aria-current="page"' : ""}>Overview</a>
      ${OH.NAV_GROUPS.map(g => `
        <div class="drawer-group">
          <div class="drawer-group-label">${OH.esc(g.label)}</div>
          ${g.items.map(i => navItemHtml(i, activeTab)).join("")}
        </div>
      `).join("")}
    `;
  }
};

function closeAllDropdowns() {
  document.querySelectorAll(".nav-group-btn[aria-expanded='true']").forEach(b => b.setAttribute("aria-expanded", "false"));
}

function wireNavChrome() {
  const groupsEl = document.getElementById("nav-groups");
  if (groupsEl) {
    groupsEl.addEventListener("click", e => {
      const btn = e.target.closest(".nav-group-btn");
      if (!btn) return;
      const wasOpen = btn.getAttribute("aria-expanded") === "true";
      closeAllDropdowns();
      btn.setAttribute("aria-expanded", wasOpen ? "false" : "true");
    });
    document.addEventListener("click", e => {
      if (!groupsEl.contains(e.target)) closeAllDropdowns();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeAllDropdowns();
    });
  }

  const menuToggle = document.getElementById("menu-toggle");
  const drawer = document.getElementById("mobile-drawer");
  const backdrop = document.getElementById("drawer-backdrop");
  let lastFocusBeforeDrawer = null;

  function drawerFocusables() {
    return Array.from(drawer.querySelectorAll("a, button")).filter(el => el.offsetParent !== null);
  }
  function openDrawer() {
    lastFocusBeforeDrawer = document.activeElement;
    drawer.hidden = false;
    backdrop.hidden = false;
    menuToggle.setAttribute("aria-expanded", "true");
    const focusables = drawerFocusables();
    if (focusables.length) focusables[0].focus();
  }
  function closeDrawer() {
    drawer.hidden = true;
    backdrop.hidden = true;
    menuToggle.setAttribute("aria-expanded", "false");
    if (lastFocusBeforeDrawer && document.body.contains(lastFocusBeforeDrawer)) lastFocusBeforeDrawer.focus();
    else menuToggle.focus();
  }
  if (menuToggle) {
    menuToggle.addEventListener("click", () => {
      if (drawer.hidden) openDrawer(); else closeDrawer();
    });
  }
  if (backdrop) backdrop.addEventListener("click", closeDrawer);
  if (drawer) {
    drawer.addEventListener("click", e => {
      if (e.target.id === "drawer-close" || e.target.closest("a.nav-item")) closeDrawer();
    });
    // Escape closes the drawer; Tab/Shift+Tab wrap focus inside it while open
    // (a simple focus trap) so keyboard users never tab "through" it into
    // the page content sitting behind it.
    drawer.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
      if (e.key !== "Tab") return;
      const focusables = drawerFocusables();
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }
}

/* ---------------------------------------------------------------------- */
/* Global search (categorized cross-entity results dropdown)              */
/* ---------------------------------------------------------------------- */

let searchCorpus = [];
let searchActiveIndex = -1; // index into the flat list of currently-rendered .search-result options

function closeSearch() {
  const box = document.getElementById("search-results");
  const input = document.getElementById("global-search");
  box.hidden = true;
  input.setAttribute("aria-expanded", "false");
  input.removeAttribute("aria-activedescendant");
  searchActiveIndex = -1;
}

function searchOptionEls() {
  return Array.from(document.querySelectorAll("#search-results .search-result"));
}

function setActiveSearchOption(index) {
  const opts = searchOptionEls();
  if (!opts.length) return;
  const input = document.getElementById("global-search");
  const clamped = (index + opts.length) % opts.length;
  opts.forEach((el, i) => {
    const isActive = i === clamped;
    el.setAttribute("aria-selected", isActive ? "true" : "false");
    el.classList.toggle("is-active", isActive);
  });
  searchActiveIndex = clamped;
  input.setAttribute("aria-activedescendant", opts[clamped].id);
  opts[clamped].scrollIntoView({ block: "nearest" });
}

function renderSearchResults(query) {
  const box = document.getElementById("search-results");
  const input = document.getElementById("global-search");
  if (!query.trim()) { closeSearch(); box.innerHTML = ""; return; }
  const results = OH.searchCorpus(searchCorpus, query);
  const grouped = OH.groupSearchResults(results, 5);
  searchActiveIndex = -1;
  let optIndex = 0;
  if (!grouped.length) {
    box.innerHTML = `<div class="search-empty">No matches for &ldquo;${OH.esc(query)}&rdquo;.</div>`;
  } else {
    box.innerHTML = grouped.map(cat => `
      <div class="search-group" role="group" aria-label="${OH.esc(cat.label)}">
        <div class="search-group-label">${OH.esc(cat.label)}${cat.total > cat.results.length ? ` <span class="tag">${cat.total}</span>` : ""}</div>
        ${cat.results.map(r => `
          <a class="search-result" id="search-opt-${optIndex++}" role="option" aria-selected="false" href="#${OH.esc(cat.tab)}/${encodeURIComponent(r.id)}">
            <span class="search-result-title">${OH.esc(r.title)}</span>
            ${r.subtitle ? `<span class="search-result-sub">${OH.esc(r.subtitle)}</span>` : ""}
          </a>
        `).join("")}
      </div>
    `).join("");
  }
  box.hidden = false;
  input.setAttribute("aria-expanded", "true");
}

function wireSearch() {
  const input = document.getElementById("global-search");
  const box = document.getElementById("search-results");
  const debounced = OH.debounce(() => renderSearchResults(input.value), 120);
  input.addEventListener("input", debounced);
  input.addEventListener("focus", () => { if (input.value.trim()) renderSearchResults(input.value); });
  input.addEventListener("keydown", e => {
    const opts = searchOptionEls();
    if (e.key === "Escape") { closeSearch(); return; }
    if (!opts.length || box.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveSearchOption(searchActiveIndex + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveSearchOption(searchActiveIndex - 1); }
    else if (e.key === "Enter" && searchActiveIndex >= 0) {
      e.preventDefault();
      opts[searchActiveIndex].click();
    }
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-box")) closeSearch();
  });
  box.addEventListener("click", e => {
    if (e.target.closest(".search-result")) { closeSearch(); input.value = ""; }
  });
}

  food: () => OH.renderFood(), bosses: () => OH.renderBosses(),
  regions: () => OH.renderRegions(), updates: () => OH.renderUpdates(),
  sources: () => OH.renderSources(), favorites: () => OH.renderFavorites(),
  buildfinder: () => OH.renderBuildFinder(OH.state.buildFinderGoal)
};

const DETAIL_RENDERERS = {
  weapons: OH.renderWeaponDetail, armor: OH.renderArmorSetDetail, attachments: OH.renderAttachmentTypeDetail,
  mods: OH.renderModDetail, blueprints: OH.renderBlueprintDetail, stations: OH.renderStationDetail,
  builds: OH.renderBuildDetail, classes: OH.renderArchetypeDetail, memetics: OH.renderMemeticDetail,
  deviants: OH.renderDeviantDetail, ranching: OH.renderRanchingDetail, crops: OH.renderCropDetail,
  food: OH.renderFoodDetail, bosses: OH.renderBossDetail
};

function renderDetail(tab, id) {
  const fn = DETAIL_RENDERERS[tab];
  if (!fn) return `<div class="empty-state">Unknown page.</div>`;
  const html = fn(id);
  return html != null ? html : `<div class="empty-state">Item not found. ${OH.backLink(tab, OH.tabLabel(tab))}</div>`;
}

function render() {
  const main = document.getElementById("main");
  const panel = document.createElement("div");
  panel.className = "panel active";

  const { tab, id, segments } = OH.parseHash();
  OH.state.active = tab;
  OH.state.detailId = id;

  if (tab === "compare") {
    panel.innerHTML = OH.renderCompare(segments);
  } else if (id && (OH.DETAIL_TABS.has(tab) || tab === "classes")) {
    panel.innerHTML = renderDetail(tab, id);
  } else {
    const fn = LIST_RENDERERS[tab] || LIST_RENDERERS.home;
    panel.innerHTML = fn();
  }

  main.innerHTML = "";
  main.appendChild(panel);
  wirePanel(panel);
  OH.buildNav(OH.ROUTE_TO_NAV_TAB[tab] || tab);
  document.title = tab === "home" ? "Once Human Database" : `${OH.tabLabel(tab)} — Once Human Database`;
}

/* ---------------------------------------------------------------------- */
/* Panel-level event wiring (cards, favorites, filters, compare, goals)    */
/* ---------------------------------------------------------------------- */

const INTERACTIVE_SELECTOR = "a, button, input, select, label, textarea";

function wirePanel(root) {
  // Card / row navigation — ignore clicks that started on a nested
  // interactive control (link, button, checkbox, favorite star, select).
  root.querySelectorAll(".card-link").forEach(card => {
    const go = () => OH.navigate(card.dataset.tab, card.dataset.id);
    card.addEventListener("click", e => {
      if (e.target.closest(INTERACTIVE_SELECTOR)) return;
      go();
    });
    card.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && !e.target.closest(INTERACTIVE_SELECTOR)) {
        e.preventDefault();
        go();
      }
    });
  });

  // Plain nav buttons (home page stat cards / quick tools use data-nav-tab)
  root.querySelectorAll("[data-nav-tab]").forEach(el => {
    el.addEventListener("click", () => OH.navigate(el.dataset.navTab, null));
  });

  // Favorites
  root.querySelectorAll("[data-fav-kind]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const { favKind, favId } = btn.dataset;
      const label = btn.getAttribute("aria-label").replace(/^(Add to favorites|Remove from favorites):\s*/, "");
      OH.toggleFavorite(favKind, favId, label);
      render();
    });
  });

  // Generic filter/sort bars (data-filter-tab / data-sort-tab / data-filter-clear)
  OH.wireFilterBar(root, render);

  // Compare checkboxes + controls
  root.querySelectorAll("[data-compare-kind]").forEach(cb => {
    cb.addEventListener("change", () => {
      const { compareKind, compareId } = cb.dataset;
      const sel = OH.state.compareSelection;
      const idx = sel.findIndex(c => c.kind === compareKind && c.id === compareId);
      if (cb.checked) {
        if (idx < 0) sel.push({ kind: compareKind, id: compareId });
      } else if (idx >= 0) {
        sel.splice(idx, 1);
      }
      render();
    });
  });
  root.querySelectorAll("[data-compare-go]").forEach(btn => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.compareGo;
      const ids = OH.state.compareSelection.filter(c => c.kind === kind).map(c => c.id);
      OH.navigateSegments("compare", [kind, ...ids]);
    });
  });
  root.querySelectorAll("[data-compare-clear]").forEach(btn => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.compareClear;
      OH.state.compareSelection = OH.state.compareSelection.filter(c => c.kind !== kind);
      render();
    });
  });

  // Build Finder goal buttons
  root.querySelectorAll("[data-goal]").forEach(btn => {
    btn.addEventListener("click", () => {
      OH.state.buildFinderGoal = btn.dataset.goal;
      render();
    });
  });
  root.querySelectorAll("[data-goal-clear]").forEach(btn => {
    btn.addEventListener("click", () => {
      OH.state.buildFinderGoal = null;
      render();
    });
  });
}

/* ---------------------------------------------------------------------- */
/* Boot                                                                    */
/* ---------------------------------------------------------------------- */

async function init() {
  try {
    await OH.loadAll();
    OH.buildIndexes();
    searchCorpus = OH.buildSearchCorpus();
    document.getElementById("version-pill").textContent = "v" + OH.state.data.meta.gameVersionAtCompile;
    document.getElementById("footer").textContent =
      `${OH.state.data.meta.siteName} · unofficial fan-made reference · compiled ${OH.state.data.meta.lastCompiled} · not affiliated with Starry Studio / NetEase`;
    wireNavChrome();
    wireSearch();
    window.addEventListener("hashchange", render);
    render();
  } catch (err) {
    document.getElementById("main").innerHTML = `<div class="empty-state">Failed to load data: ${OH.esc(err.message)}<br>If you opened this file directly in a browser, serve it over HTTP instead (e.g. <code>python3 -m http.server</code>) so fetch() can read the /data JSON files.</div>`;
    console.error(err);
  }
}

document.addEventListener("DOMContentLoaded", init);

</script>
