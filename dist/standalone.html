<head>

<title>Once Human Database</title>
<meta name="description" content="Unofficial community database for Once Human — weapons, mods, blueprints, builds, memetics, deviants, crops, bosses, regions and patch history.">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Irradiated-wasteland palette: warm scorched-earth ground, ember/rust primary, corroded-stardust teal secondary */
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
  --radius: 3px;
  --maxw: 1180px;
  --font-display: "Rajdhani", "Segoe UI", sans-serif;
  --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: var(--font-body);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f1e6;
    --bg-alt: #efe6d4;
    --card: #fffcf5;
    --card-hover: #fbf3e2;
    --border: #ddccaa;
    --border-soft: #e7dabf;
    --text: #241b13;
    --text-dim: #6e5c43;
    --accent: #c85a24;
    --accent-soft: #a5461a;
    --accent-2: #157a67;
    --danger: #b23f31;
  }
}

:root[data-theme="light"] {
  --bg: #f6f1e6;
  --bg-alt: #efe6d4;
  --card: #fffcf5;
  --card-hover: #fbf3e2;
  --border: #ddccaa;
  --border-soft: #e7dabf;
  --text: #241b13;
  --text-dim: #6e5c43;
  --accent: #c85a24;
  --accent-soft: #a5461a;
  --accent-2: #157a67;
  --danger: #b23f31;
}

:root[data-theme="dark"] {
  --bg: #15100b;
  --bg-alt: #1d1610;
  --card: #241b13;
  --card-hover: #2b2016;
  --border: #3d2e1e;
  --border-soft: #2c2117;
  --text: #f2e9db;
  --text-dim: #b3a087;
  --accent: #ff7a3d;
  --accent-soft: #ffab7a;
  --accent-2: #6fd6bf;
  --danger: #e2685a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100vh;
  line-height: 1.5;
  font-family: var(--font-body);
}

h1, h2, h3, nav.tabs button, .version-pill {
  font-family: var(--font-display);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header.site-header {
  background: linear-gradient(180deg, var(--bg-alt), var(--bg));
  border-bottom: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  padding: 18px 20px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(6px);
}

.header-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.brand .version-pill {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--bg);
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 2px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-box input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius);
  min-width: 240px;
  font-size: 0.88rem;
  font-family: var(--font-body);
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

nav.tabs {
  max-width: var(--maxw);
  margin: 14px auto 0;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  padding-bottom: 0;
  scrollbar-width: thin;
}

nav.tabs button {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 9px 14px 10px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

nav.tabs button:hover { background: var(--card); color: var(--text); }

nav.tabs button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--card);
}

main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.panel { display: none; }
.panel.active { display: block; }

.panel h2 {
  margin-top: 0;
  font-size: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}

.panel > p.intro {
  color: var(--text-dim);
  max-width: 800px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-top-color 0.15s, background 0.15s;
}

.card:hover {
  border-top-color: var(--accent);
  background: var(--card-hover);
}

.card h3 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
}

.card .meta {
  font-size: 0.74rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.tag {
  display: inline-block;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  padding: 1px 8px;
  border-radius: 2px;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.tag.tier-S { color: var(--accent-soft); border-color: var(--accent-soft); }
.tag.tier-A { color: var(--accent-2); border-color: var(--accent-2); }

.card p { margin: 4px 0; font-size: 0.88rem; color: var(--text); }
.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--text-dim); }

.table-wrap { overflow-x: auto; }

table.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}

table.data-table th, table.data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

table.data-table th {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
  background: var(--bg);
}

table.data-table tbody tr:hover { background: var(--bg-alt); }

.section-block {
  margin-top: 28px;
}

.section-block h3 {
  color: var(--accent-2);
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 6px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.timeline-entry {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 24px;
  position: relative;
}

.timeline-entry::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}

.timeline-entry h3 { margin: 0 0 2px; color: var(--text); }
.timeline-entry .date { color: var(--text-dim); font-size: 0.8rem; }
.timeline-entry ul { margin-top: 8px; }

.badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 22px;
}

.hero p { color: var(--text-dim); margin: 6px 0 0; max-width: 70ch; }

.sources-list { columns: 2; font-size: 0.85rem; color: var(--text-dim); }
.sources-list li { margin-bottom: 6px; break-inside: avoid; }

footer.site-footer {
  border-top: 1px solid var(--border);
  padding: 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.76rem;
  font-family: var(--font-mono);
}

.hidden { display: none !important; }

.empty-state {
  color: var(--text-dim);
  padding: 30px;
  text-align: center;
  font-style: italic;
}

@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .search-box input { min-width: 0; width: 100%; }
  .sources-list { columns: 1; }
}

</style>
</head>

</header>
<main id="main"></main>

<script>window.__OH_DATA = {"blueprints":{"overview":"Blueprints are formulas that must be learned before you can craft a piece of furniture, a structure, or certain gear. Once learned, a blueprint appears under the 'Special' tab of your inventory and its item becomes placeable in Build Mode.","howToObtain":["Looting chests, dumpsters and cabinets in the world (lootable containers reset on a global timer, refreshing every 4 hours).","Disassembling unwanted or duplicate blueprints at the Designer's Workstation (Building tab of the Memetic menu) for Formula Blueprint Fragments, which can be redeemed for new ones.","Purchasing from the in-game Shop or seasonal Shop rotations.","Rewarded from Memetic Specializations in the Building and Crafting branches (many specializations directly unlock a blueprint, e.g. turrets, traps, storage crates and workbenches).","Deviant assistance — e.g. the Logging Beaver deviant can occasionally find furniture items while foraging."],"categories":[{"id":"furniture-decor","name":"Furniture & Decor","description":"Single-use or reusable decorative furniture for territory customization — beds, seating, lighting, storage displays.","examples":["Deluxe Storage Crate (64 slots)","Special Storage Crate (64 slots)","Bed: A Place to Call Home","Bed: Heat Preservation"]},{"id":"workstations","name":"Workstations & Production","description":"Crafting facility blueprints that unlock or upgrade production buildings.","examples":["Gear Workbench: Customization","Custom Gear Workbench","Advanced Stove: Gourmand","Kitchen Set: Gourmand","Refining Facility: Smelting","Robotics Facility: Skilled Mechanician","Synthesis Bench: Recycle & Reuse"]},{"id":"power-utility","name":"Power & Utility","description":"Generators and utility structures that support a base.","examples":["Generator: Electrical Expert","Biomass Generator: Sustained Output","Hydraulic Generator: One with the Tides","Hydropower Generator","Deviant Power Generator: Stardust Unleashed","Water Pump: Underground Pump","Portable Thermostat"]},{"id":"defense","name":"Defense — Turrets & Traps","description":"Territory defense structures unlocked via Building memetics.","examples":["Rifle Turret: Two Birds One Stone","Shotgun Turret: Volley Fire","Gatling Cannon: Power Blast","Portable MG Turret: Shadow Shift","Claymore Mine: Frost Trap","Claymore Mine: Warrior's Resolve","Flamethrower Trap: Kebob Party","Flamethrower Trap: Scorching Blast","Stardust Barrier: Hold the Line"]},{"id":"farming","name":"Farming & Agriculture","description":"Planter and irrigation blueprints for growing crops (see crops.json).","examples":["Planter Box: Greenhouse Planting","Growshroom (Deviant-assisted auto-planting)"]},{"id":"structural","name":"Structural — Walls, Roofs, Pillars","description":"Base-building material tiers with durability bonuses from Building memetics.","examples":["Wood Structures: Tough Plant","Stone Structures: Intense Defense","Basic Defense: Battle-Hardened","Reinforced Structures"]},{"id":"drones","name":"Rosetta Drones","description":"Deployable drone blueprints for gathering, combat, exploration and territory support.","examples":["Rosetta Gathering Drone","Rosetta Firepower Drone","Rosetta Exploration Drone","Rosetta Territory Drone"]}],"notableConstructionUpdate":"Patch 3.0.2 (July 22, 2026) added flexible snap-point switching for walls, ceilings, roofs, stairs and pillars, giving builders finer control when placing blueprints."},"bosses":{"overview":"The main story/world bosses in Once Human are known as 'The Great Ones' — massive creatures forged from people mutated by Stardust, each guarding a Monolith in a different region of Nalcott and requiring a team to defeat efficiently. Beyond the Great Ones, seasonal Visional Wheel content adds rotating bosses (e.g. the Riftwalker in the Gravity Abyss season) and events add limited-time bosses (e.g. the Block Wanderer).","greatOnes":[{"name":"Ravenous Hunter","level":10,"location":"Monolith of Greed, Dayton Wetlands","mechanics":"Destroy its Gatling weapon to disable its shield, then stun it and hit the yellow head weak spot."},{"name":"Treant","level":20,"location":"Gaia Cliff Monolith, Broken Delta","mechanics":"Destroy the surrounding vines first, target the female humanoid figure on its back, and dodge laser beams that telegraph with a red light."},{"name":"Arachsiam","level":30,"location":"Mirage Monolith, Iron River","mechanics":"Avoid web-cocoon and rush attacks; focus the purple pustules on its back for maximum damage."},{"name":"Rabizex","level":40,"location":"Monolith of Thirst, Chalk Peak","mechanics":"Keep distance, use powerful weapons on its weak points, and prioritize evasion since its movements are hard to predict up close."},{"name":"Mensdevoran (The Forsaken Giant)","level":60,"location":"Forsaken Monolith, Red Sands","mechanics":"Jump over hand-slam shockwaves, stay close to its body to dodge sweeping arm attacks, and target glowing weak spots as they appear."}],"seasonalAndEventBosses":[{"name":"Riftwalker","type":"Seasonal Aerial Boss","context":"Visional Wheel S4: Gravity Abyss (patch 2.4.1) — a massive aerial Deviant fought across zero-gravity floating islands."},{"name":"Block Wanderer","type":"Limited-time Event Boss","context":"Block Adventure event on Wish Island (patch 3.0.3, Aug 5–23 2026) — defeat blocky creatures and challenge this boss for morphed Deviation rewards."}],"note":"Great Ones drop core weapon-effect mod sets (e.g. Burn-focused mods drop from the Ravenous Hunter) alongside crafting materials and blueprint fragments."},"builds":{"builds":[{"id":"shrapnel-crit","name":"Shrapnel Crit Build","archetype":"shrapnel","role":"PvE — Boss Killer","summary":"Once Human's premier build for destroying the Great Ones and general PvE. Bullets fragment to tear through multiple body parts; can be specced for crit, weakspot hits, or a no-reload playstyle.","suggestedWeapons":["compound-bow","kvd-boom-boom"],"suggestedMods":["Obliterate","Shatter Them All","Shield Breaker","Shrapnel Smash","Shrapnel Souvenir"]},{"id":"power-surge","name":"Power Surge Build","archetype":"power-surge","role":"PvE — Sustained DPS","summary":"Dump full magazines into enemies to trigger bursts of Electric damage. A well-optimized version can top out around 100,000 DPS without external buffs.","suggestedWeapons":["kam-abyss-glance"],"suggestedMods":["Shock Diffusion","Shock Rampage","Static Shock","Surge Amplifier"]},{"id":"frost-vortex","name":"Frost Vortex Build","archetype":"frost-vortex","role":"PvE — Boss Sustain","summary":"Excellent against big boss enemies — the vortex feeds you health while draining theirs, making it a strong solo/duo boss-clearing build.","suggestedWeapons":["aws338-bingo"],"suggestedMods":["Cryo Blast","Frosty Blessing","Shattering Ice","Vortex Multiplier"]},{"id":"bounce","name":"Bounce Build","archetype":"bounce","role":"PvE — Crowd Damage","summary":"An underrated build where projectiles ricochet between enemies; damage gets absurd in tight corridors or dense groups of mobs.","suggestedWeapons":["kvsbr-little-jaws"],"suggestedMods":["Bounce Rampage","Super Bullet","Targeted Bounce"]},{"id":"fast-gunner-lmg","name":"Fast Gunner LMG Build","archetype":"fast-gunner","role":"PvE/PvP — Sustained Fire","summary":"Buffs a gun's damage and fire rate the longer you shoot. Best on high-magazine LMGs — a properly built MG4 Predator can unload roughly 200 rounds before needing to reload.","suggestedWeapons":["mg4-predator"],"suggestedMods":["Cowboy","Double Gunner","Fast Refurbish","Lasting Fortification","Precision Rush","Shoot Out","Shooting Blitz"]}],"note":"Builds combine a weapon effect archetype, weapon(s), mods and memetic specializations into a cohesive loadout. See classes.json for archetype summaries and mods.json for full mod effect details."},"classes":{"overview":"Once Human has no fixed 'class' system — instead your playstyle is defined by which Weapon Effect (the combat archetype tied to your weapons/mods) and Memetic Specialization branch you build around. These act as the closest equivalent to classes.","weaponEffectArchetypes":[{"id":"shrapnel","name":"Shrapnel","role":"PvE burst / boss killer","summary":"Bullets fragment for extra per-part damage; considered a top pick for melting the Great Ones and general PvE."},{"id":"power-surge","name":"Power Surge","role":"Sustained DPS","summary":"Dump full magazines to build stacking Electric/Shock damage; capable of ~100,000 DPS in optimized PvE builds."},{"id":"frost-vortex","name":"Frost Vortex","role":"Boss sustain / control","summary":"Creates damaging vortexes that also return health, excellent against big single targets while keeping you alive."},{"id":"bounce","name":"Bounce","role":"Crowd control / AoE","summary":"Projectiles ricochet between enemies; shines in corridors or dense enemy groups."},{"id":"fast-gunner","name":"Fast Gunner","role":"Sustained fire LMG playstyle","summary":"Rewards continuous firing and weapon-switching with stacking damage/reload buffs; pairs best with high-magazine LMGs like the MG4 Predator."},{"id":"burn","name":"Burn","role":"Damage-over-time","summary":"Stacking burn DoT that snowballs with mods that preserve or extend stacks on kill."},{"id":"unstable-bomber","name":"Unstable Bomber","role":"Burst explosive","summary":"Builds toward bomb-like detonations, scaling well with Crit Rate."},{"id":"fortress-warfare","name":"Fortress Warfare","role":"Territory / group defense","summary":"Buffs tied to structures and holding ground, strengthened by nearby teammates."},{"id":"marked","name":"Marked / Bull's Eye","role":"Team support / debuff","summary":"Marks targets to amplify incoming damage from the whole team."}],"memeticBranches":[{"id":"gathering","name":"Gathering","focus":"Improves the yield of materials collected in the wild (ore, wood, water, crystals)."},{"id":"crafting","name":"Crafting","focus":"Upgrades workbenches and unlocks new craftable items, weapons and gadgets."},{"id":"management","name":"Management","focus":"Survival-oriented upgrades: generators, cooking, temperature control, farming infrastructure."},{"id":"building","name":"Building","focus":"Improves crafting/production facilities, defensive structures, turrets, traps and territory tools."}],"note":"Every 5 levels starting at level 5, players unlock a Memetic Specialization node offering a choice of 4 randomly generated specializations (one per branch), for up to 10 chosen specializations by level 50. See blueprints.json / builds.json for how these tie into gear and loadouts."},"crops":{"overview":"Farming is unlocked via the 'Planting' Memetic Specialization in the Logistics/Management tree. Seeds are obtained by harvesting wild plants (or from growing your own crop). Plant seeds in loamy soil or a Planter Box, water with Boiled or Pure Water (Dirty Water lowers crop Vitality), and provide light — Irrigation Systems and Grow Lights can automate this. Harvest by interacting once growth reaches 100%. Deviated (mutated) Crops can drop from regular ones and are used in special high-value recipes.","howToFarm":["Unlock the Planting memetic specialization.","Gather seeds from wild plants or from harvested crops.","Plant in loamy soil or a Planter Box.","Water with Boiled/Pure Water and ensure adequate light.","Harvest at 100% growth for the crop plus a chance at bonus seeds or a Deviated (mutated) variant."],"crops":[{"name":"Beets","uses":"Refined into Sugar for Sanity Pills, Stardust Energy Drink, Shattered Bread, Assorted Canned Fruit.","foundNear":"Waterways near Deadsville and Meyer's Market"},{"name":"Corn","uses":"Refined into Corn Oil (Shattered Bread, Canned Seafood in Oil); fermented into Corn Ale.","foundNear":"Grassy/forested areas and farms like Citrus County"},{"name":"Wheat","uses":"Brewed into Malt Ale; used in Hug-in-a-Bowl and Croquettes.","foundNear":"Farms and roadsides, e.g. Citrus County"},{"name":"Mushrooms","uses":"Crafted into Yield Boost and Mutation Boost fertilizers.","foundNear":"Wooded underbrush in Iron River"},{"name":"Scarlet Calamus","uses":"Creates Breeding Boost fertilizer to increase seed yield.","foundNear":"Shallow waterways"},{"name":"Peppercorn","uses":"Creates Preserved Deviated Chops and Securement Soup.","foundNear":"Vendor Lacey at Blackfell (limited 3 seeds/week)"},{"name":"Cucumber","uses":"Fermented into Pickles; Deviated variant used for Safety Sandwich.","foundNear":"Vendor Zhao Jintan at Meyer's Market (limited 3 seeds/week)"},{"name":"Onions","uses":"Croquette ingredient; Deviated variant yields Bacon Burger and can attract the Grumpy Bulb deviation.","foundNear":"Vendor Emma Potter at Tall Grass Inn (limited 3 seeds/week)"},{"name":"Morel","uses":"Canned Seafood in Oil, Borscht Deluxe, Yuanbao Dumplings.","foundNear":"Randomly dropped from containers in level 35+ areas"},{"name":"Aloe Vera","uses":"Signature Ice Brew, Aloe Vera Ointment, Shattered Bread.","foundNear":"Rare finds in Red Sands and Blackheart regions"}],"deviantHelpers":[{"name":"Buzzy Bee","helps":"Automatically plants crops and boosts mutation probability."},{"name":"Growshroom","helps":"Auto-plants seeds and accelerates crop growth."},{"name":"Rain Man","helps":"Enhances crop vitality and provides irrigation water."}]},"deviants":{"overview":"Deviants are sentient creatures/objects mutated by Stardust that players can capture and bond with as companions. Each Deviant falls into one of three main purposes — Combat, Territory (utility/gathering), or Crafting (produces materials) — and grants passive or active abilities. Once Human's catalog includes 80+ Deviations (per oncehumandb.com); tags like (WoT) note ones introduced in the Way of Winter update and (PvP)/(PvE) note mode-specific abilities.","categories":["Combat","Territory","Crafting"],"deviants":[{"name":"Artisan's Touch","category":"Crafting","ability":"Instantly repairs the gear with the lowest durability."},{"name":"Atomic Lighter","category":"Crafting","ability":"Creates materials for explosive tactical items."},{"name":"Atomic Snail","category":"Crafting","ability":"Generates components for elixir crafting."},{"name":"Butterfly's Emissary","category":"Combat","ability":"Rushes enemies from range and marks weak points for amplified damage."},{"name":"Buzzy Bee","category":"Territory","ability":"Enhances plant mutation probability during cultivation; can auto-plant crops at a farm."},{"name":"By-The-Wind","category":"Combat","ability":"Generates gravity lifts for vertical movement and flight."},{"name":"Chefosaurus Rex","category":"Territory","ability":"Boosts effectiveness of food preparation at cooking stations."},{"name":"Disco Ball","category":"Crafting","ability":"Produces materials that extend whim elixir duration."},{"name":"Dr. Teddy","category":"Combat","ability":"Heals allies and revives downed teammates (PvP)."},{"name":"Dreamcatcher","category":"Crafting","ability":"Creates components for cobweb trap elixirs."},{"name":"Electric Eel","category":"Territory","ability":"Increases generator power output capacity."},{"name":"Enchanting Void","category":"Combat","ability":"Amplifies melee damage taken by affected targets (PvE)."},{"name":"Extradimensional Cat","category":"Territory","ability":"Accelerates health recovery during rest periods."},{"name":"Festering Gel","category":"Combat","ability":"Creates fortifications that block ranged attacks and heal allies."},{"name":"Fetch-A-Lot Bunny","category":"Territory","ability":"Automatically harvests shrubs and vegetation."},{"name":"Flame Essence","category":"Territory","ability":"Enhances furnace production efficiency."},{"name":"Frog the Leaper","category":"Crafting","ability":"Generates jumping-enhancement elixir materials."},{"name":"Gazocchio","category":"Territory/Crafting","ability":"Guards territory and produces shadow-dispelling items (Way of Winter)."},{"name":"Gingerbread House","category":"Territory","ability":"Produces materials for object t :"S","notes":"Top-tier legendary assault rifle."},{"id":"socr-outsider","name":"SOCR — Outsider","type":"assault-rifle","rarity":"legendary","tier":"B","notes":"High damage with decent fire rate and magazine size."},{"id":"kam","name":"KAM","type":"assault-rifle","rarity":"rare","notes":"Base assault rifle chassis."},{"id":"kam-crank","name":"KAM — Crank","type":"assault-rifle","rarity":"epic","notes":"Moderate fire-rate KAM variant."},{"id":"kam-abyss-glance","name":"KAM — Abyss Glance","type":"assault-rifle","rarity":"legendary","tier":"A","damage":39,"fireRate":600,"notes":"Legendary assault rifle, balanced damage and fire rate."},{"id":"m416","name":"M416","type":"assault-rifle","rarity":"rare","notes":"Standard assault rifle."},{"id":"aug","name":"AUG","type":"assault-rifle","rarity":"rare","notes":"Standard assault rifle."},{"id":"aug-electron-cloud","name":"AUG — Electron Cloud","type":"assault-rifle","rarity":"epic","notes":"Named AUG variant; flexibility adjusted in patch 2.4.1's balance pass."},{"id":"db12","name":"DB12","type":"shotgun","rarity":"rare","notes":"Base shotgun chassis."},{"id":"db12-backfire","name":"DB12 — Backfire","type":"shotgun","rarity":"epic","notes":"Named DB12 variant."},{"id":"db12-raining-cash","name":"DB12 — Raining Cash","type":"shotgun","rarity":"legendary","tier":"A","damage":"55x5 pellets","notes":"Legendary shotgun, strong burst close-range damage."},{"id":"dbsg-doombringer","name":"DBSG — Doombringer","type":"shotgun","rarity":"legendary","notes":"Named legendary shotgun."},{"id":"s870-sandstorm","name":"S870 — Sandstorm","type":"shotgun","rarity":"epic","notes":"Named shotgun variant."},{"id":"aws338","name":"AWS.338","type":"sniper-rifle","rarity":"rare","notes":"Base sniper rifle chassis; the community also references a legendary variant of this line as 'Bullseye' or 'Bingo' depending on the source/version."},{"id":"aws338-bingo","name":"AWS.338 — Bingo","type":"sniper-rifle","rarity":"legendary","tier":"A","damage":316,"notes":"Legendary sniper rifle, very high per-shot damage for weakspot hunting."},{"id":"aws338-black-panther","name":"AWS.338 — Black Panther","type":"sniper-rifle","rarity":"legendary","notes":"Named AWS.338 variant."},{"id":"sn700","name":"SN700","type":"sniper-rifle","rarity":"rare","notes":"Accessible early-game sniper rifle chassis."},{"id":"sn700-finale","name":"SN700 — Finale","type":"sniper-rifle","rarity":"legendary","tier":"A","notes":"Reverb-stacking legendary sniper; rebalanced in patch 3.0.2 (reverb stacks reduced to 4, damage scaling adjusted)."},{"id":"sn700-gulped-lore","name":"SN700 — Gulped Lore","type":"sniper-rifle","rarity":"epic","notes":"Named SN700 variant, useful vs. bosses."},{"id":"hamr","name":"HAMR","type":"sniper-rifle","rarity":"rare","notes":"Base sniper rifle chassis."},{"id":"hamr-brahminy","name":"HAMR — Brahminy","type":"sniper-rifle","rarity":"legendary","notes":"Named HAMR variant."},{"id":"hamr-crumble","name":"HAMR — Crumble","type":"sniper-rifle","rarity":"epic","notes":"Named HAMR variant, boss-oriented."},{"id":"mg4","name":"MG4","type":"lmg","rarity":"rare","damage":25,"fireRate":700,"notes":"Base LMG, 75-round magazine."},{"id":"mg4-predator","name":"MG4 — Predator","type":"lmg","rarity":"epic","tier":"A","damage":32,"fireRate":700,"notes":"Signature weapon for Fast Gunner builds; 75-round mag lets players fire roughly 200 rounds before reloading when built around Fast Gunner."},{"id":"kvd","name":"KVD","type":"lmg","rarity":"rare","notes":"Base LMG chassis."},{"id":"kvd-boom-boom","name":"KVD — Boom! Boom!","type":"lmg","rarity":"legendary","tier":"S","damage":44,"fireRate":500,"notes":"100-round magazine; considered one of the two strongest weapons in the game."},{"id":"wrath-of-hades","name":"Wrath Of Hades","type":"lmg","rarity":"legendary","damage":44,"fireRate":700,"notes":"75-round magazine legendary LMG."},{"id":"mr-squid","name":"Mr. Squid","type":"lmg","rarity":"legendary","damage":44,"fireRate":700,"notes":"7 "melee","rarity":"standard","notes":"Early/utility melee weapon, doubles as a light source."},{"id":"wrench","name":"Wrench","type":"melee","rarity":"standard","notes":"Early/utility melee weapon."},{"id":"camping-knife","name":"Camping Knife","type":"melee","rarity":"standard","notes":"Early/utility melee weapon."},{"id":"mgl","name":"MGL","type":"heavy","rarity":"epic","damage":277,"tier":"B","notes":"Grenade launcher, strong against grouped enemies and structures."},{"id":"rpg7","name":"RPG7 Rocket Launcher","type":"heavy","rarity":"epic","notes":"Heavy artillery, high single-target/structure damage."}],"note":"Once Human's full arsenal spans 126+ individual weapons (per oncehumandb.com) once every named legendary variant of each base chassis (DE.50, R500, MPS5/7, KV-SBR, SOCR, KAM, DB12, AWS.338, SN700, HAMR, MG4, KVD, etc.) is counted separately. The list above is a broad, sourced cross-section across all 9 weapon categories and every rarity tier — base chassis plus their notable named variants — rather than a literal enumeration of all 126+ entries. Turret/emplacement 'heavy weapons' like Gatling Cannons and plasma-round turrets are catalogued under Blueprints → Defense instead, since they're placed structures rather than carried weapons."}};</script>
<script>
// Once Human Database — client-side app
// Loads /data/*.json and renders tabbed, searchable panels. No build step required.

const DATA_FILES = {
  meta: "data/meta.json",
  weapons: "data/weapons.json",
  mods: "data/mods.json",
  blueprints: "data/blueprints.json",
  builds: "data/builds.json",
  classes: "data/classes.json",
  memetics: "data/memetics.json",
  deviants: "data/deviants.json",
  crops: "data/crops.json",
  bosses: "data/bosses.json",
  regions: "data/regions.json",
  updates: "data/updates.json"
};

const TABS = [
  { id: "home", label: "Overview" },
  { id: "weapons", label: "Weapons" },
  { id: "mods", label: "Mods" },
  { id: "blueprints", label: "Blueprints" },
  { id: "builds", label: "Builds & Classes" },
  { id: "memetics", label: "Memetics" },
  { id: "deviants", label: "Deviants (Animals)" },
  { id: "crops", label: "Crops" },
  { id: "bosses", label: "Bosses" },
  { id: "regions", label: "Regions" },
  { id: "updates", label: "Updates" },
  { id: "sources", label: "Sources" }
];

const state = { data: {}, active: "home", query: "" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function loadAll() {
  // Standalone/preview builds may embed the data directly on window.__OH_DATA
  // (see build-artifact.js) so the page works without a fetch()-capable server.
  if (window.__OH_DATA) {
    state.data = window.__OH_DATA;
    return;
  }
  const entries = Object.entries(DATA_FILES);
  const results = await Promise.all(entries.map(async ([key, path]) => {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`Failed to load ${path}: ${res.status}`);
    return [key, await res.json()];
  }));
  results.forEach(([key, val]) => { state.data[key] = val; });
}

function buildTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.className = t.id === state.active ? "active" : "";
    btn.addEventListener("click", () => setActive(t.id));
    nav.appendChild(btn);
  });
}

function setActive(id) {
  state.active = id;
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === id);
  });
  render();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function matchesQuery(text) {
  if (!state.query) return true;
  return String(text).toLowerCase().includes(state.query);
}

function render() {
  const main = document.getElementById("main");
  const renderers = {
    home: renderHome,
    weapons: renderWeapons,
    mods: renderMods,
    blueprints: renderBlueprints,
    builds: renderBuilds,
    memetics: renderMemetics,
    deviants: renderDeviants,
    crops: renderCrops,
    bosses: renderBosses,
    regions: renderRegions,
    updates: renderUpdates,
    sources: renderSources
  };
  main.innerHTML = "";
  const panel = document.createElement("div");
  panel.className = "panel active";
  panel.innerHTML = renderers[state.active]();
  main.appendChild(panel);
}

function renderHome() {
  const meta = state.data.meta;
  const counts = {
    weapons: state.data.weapons.weapons.length,
    mods: state.data.mods.groups.reduce((a, g) => a + g.mods.length, 0),
    deviants: state.data.deviants.deviants.length,
    crops: state.data.crops.crops.length,
    bosses: state.data.bosses.greatOnes.length,
    builds: state.data.builds.builds.length,
    memetics: Object.values(state.data.memetics.branches).reduce((a, arr) => a + arr.length, 0)
  };
  return `
    <div class="hero">
      <h2 style="border:none;margin-bottom:4px;">${esc(meta.siteName)}</h2>
      <p>${esc(meta.description)}</p>
      <p><strong>Compiled:</strong> ${esc(meta.lastCompiled)} against game version <strong>${esc(meta.gameVersionAtCompile)}</strong>.</p>
    </div>
    <div class="grid">
      ${statCard("Weapons", counts.weapons, "weapons")}
      ${statCard("Named Mods", counts.mods, "mods")}
      ${statCard("Deviants (Animals)", counts.deviants, "deviants")}
      ${statCard("Crops", counts.crops, "crops")}
      ${statCard("Great Ones (Bosses)", counts.bosses, "bosses")}
      ${statCard("Builds", counts.builds, "builds")}
      ${statCard("Memetic Specializations", counts.memetics, "memetics")}
      ${statCard("Blueprint Categories", state.data.blueprints.categories.length, "blueprints")}
    </div>
    <div class="section-block">
      <h3>⚠️ About this database</h3>
      <p class="intro">${esc(meta.disclaimer)}</p>
    </div>
  `;
}

function statCard(label, value, tab) {
  return `<div class="card" style="cursor:pointer" onclick="window.__ohNav('${tab}')">
    <div class="meta">${esc(label)}</div>
    <h3 style="font-size:1.8rem;color:var(--accent-2)">${value}</h3>
  </div>`;
}
window.__ohNav = setActive;

function renderWeapons() {
  const w = state.data.weapons;
  const items = w.weapons.filter(x => matchesQuery(x.name + x.type + (x.notes || "")));
  return `
    <h2>Weapons</h2>
    <p class="intro">${esc(w.note)}</p>
    <div class="badge-list">${w.weaponTypes.map(t => `<span class="tag" title="${esc(t.description)}">${esc(t.name)}</span>`).join("")}</div>
    <div class="grid">
      ${items.map(x => `
        <div class="card">
          <h3>${esc(x.name)}</h3>
          <div class="meta">
            <span class="tag">${esc(labelForType(x.type, w.weaponTypes))}</span>
            <span class="tag tier-${esc(x.tier || "")}">Tier ${esc(x.tier || "?")}</span>
            <span class="tag">${esc(capitalize(x.rarity))}</span>
          </div>
          ${x.damage ? `<p><strong>Damage:</strong> ${esc(x.damage)}${x.fireRate ? ` · <strong>RPM:</strong> ${esc(x.fireRate)}` : ""}</p>` : ""}
          <p>${esc(x.notes || "")}</p>
        </div>
      `).join("") || emptyState()}
    </div>
  `;
}
function labelForType(id, types) {
  const t = types.find(t => t.id === id);
  return t ? t.name : id;
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function renderMods() {
  const m = state.data.mods;
  const groups = m.groups
    .map(g => ({ ...g, mods: g.mods.filter(x => matchesQuery(x.name + x.effect + g.effect)) }))
    .filter(g => g.mods.length || matchesQuery(g.effect));
  return `
    <h2>Mods</h2>
    <p class="intro">${esc(m.overview)}</p>
    ${groups.map(g => `
      <div class="section-block">
        <h3>${esc(g.effect)}</h3>
        <p class="intro" style="margin-top:0">${esc(g.description)}</p>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Mod</th><th>Effect</th></tr></thead>
          <tbody>
            ${g.mods.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.effect)}</td></tr>`).join("")}
          </tbody>
        </table></div>
      </div>
    `).join("") || emptyState()}
  `;
}

function renderBlueprints() {
  const b = state.data.blueprints;
  const cats = b.categories.filter(c => matchesQuery(c.name + c.description + c.examples.join(" ")));
  return `
    <h2>Blueprints</h2>
    <p class="intro">${esc(b.overview)}</p>
    <div class="section-block">
      <h3>How to obtain blueprints</h3>
      <ul>${b.howToObtain.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="grid">
      ${cats.map(c => `
        <div class="card">
          <h3>${esc(c.name)}</h3>
          <p>${esc(c.description)}</p>
          <ul>${c.examples.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
        </div>
      `).join("") || emptyState()}
    </div>
    <p class="intro" style="margin-top:18px"><strong>Recent change:</strong> ${esc(b.notableConstructionUpdate)}</p>
  `;
}

function renderBuilds() {
  const builds = state.data.builds.builds.filter(x => matchesQuery(x.name + x.summary + x.role));
  const classes = state.data.classes;
  return `
    <h2>Builds &amp; Classes</h2>
    <p class="intro">${esc(classes.overview)}</p>
    <div class="section-block">
      <h3>Weapon Effect Archetypes ("Classes")</h3>
      <div class="grid">
        ${classes.weaponEffectArchetypes.filter(a => matchesQuery(a.name + a.summary)).map(a => `
          <div class="card">
            <h3>${esc(a.name)}</h3>
            <div class="meta"><span class="tag">${esc(a.role)}</span></div>
            <p>${esc(a.summary)}</p>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="section-block">
      <h3>Memetic Branches</h3>
      <div class="grid">
        ${classes.memeticBranches.map(b => `
          <div class="card"><h3>${esc(b.name)}</h3><p>${esc(b.focus)}</p></div>
        `).join("")}
      </div>
      <p class="intro">${esc(classes.note)}</p>
    </div>
    <div class="section-block">
      <h3>Named Builds</h3>
      <div class="grid">
        ${builds.map(x => `
          <div class="card">
            <h3>${esc(x.name)}</h3>
            <div class="meta"><span class="tag">${esc(x.role)}</span></div>
            <p>${esc(x.summary)}</p>
            <p><strong>Weapons:</strong> ${x.suggestedWeapons.map(esc).join(", ")}</p>
            <ul>${x.suggestedMods.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
          </div>
        `).join("") || emptyState()}
      </div>
    </div>
  `;
}

function renderMemetics() {
  const branches = state.data.memetics.branches;
  const branchLabels = { gathering: "Gathering", crafting: "Crafting", management: "Management", building: "Building" };
  return `
    <h2>Memetic Specializations</h2>
    <p class="intro">${esc(state.data.memetics.overview)}</p>
    ${Object.entries(branches).map(([key, list]) => {
      const filtered = list.filter(x => matchesQuery(x.name + x.effect));
      if (!filtered.length) return "";
      return `
        <div class="section-block">
          <h3>${esc(branchLabels[key] || key)} <span class="tag">${filtered.length}</span></h3>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Specialization</th><th>Effect</th></tr></thead>
            <tbody>${filtered.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.effect)}</td></tr>`).join("")}</tbody>
          </table></div>
        </div>
      `;
    }).join("") || emptyState()}
  `;
}

function renderDeviants() {
  const d = state.data.deviants;
  const items = d.deviants.filter(x => matchesQuery(x.name + x.category + x.ability));
  return `
    <h2>Deviants (Animals / Companions)</h2>
    <p class="intro">${esc(d.overview)}</p>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Name</th><th>Category</th><th>Ability</th></tr></thead>
      <tbody>
        ${items.map(x => `<tr><td>${esc(x.name)}</td><td><span class="tag">${esc(x.category)}</span></td><td>${esc(x.ability)}</td></tr>`).join("")}
      </tbody>
    </table></div>
    ${!items.length ? emptyState() : ""}
  `;
}

function renderCrops() {
  const c = state.data.crops;
  const items = c.crops.filter(x => matchesQuery(x.name + x.uses + x.foundNear));
  return `
    <h2>Crops &amp; Farming</h2>
    <p class="intro">${esc(c.overview)}</p>
    <div class="section-block">
      <h3>How to farm</h3>
      <ul>${c.howToFarm.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="grid">
      ${items.map(x => `
        <div class="card">
          <h3>${esc(x.name)}</h3>
          <p><strong>Uses:</strong> ${esc(x.uses)}</p>
          <p><strong>Found near:</strong> ${esc(x.foundNear)}</p>
        </div>
      `).join("") || emptyState()}
    </div>
    <div class="section-block">
      <h3>Deviant helpers</h3>
      <div class="grid">
        ${c.deviantHelpers.map(x => `<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.helps)}</p></div>`).join("")}
      </div>
    </div>
  `;
}

function renderBosses() {
  const b = state.data.bosses;
  const great = b.greatOnes.filter(x => matchesQuery(x.name + x.location + x.mechanics));
  const seasonal = b.seasonalAndEventBosses.filter(x => matchesQuery(x.name + x.context));
  return `
    <h2>Bosses</h2>
    <p class="intro">${esc(b.overview)}</p>
    <div class="section-block">
      <h3>The Great Ones</h3>
      <div class="grid">
        ${great.map(x => `
          <div class="card">
            <h3>${esc(x.name)}</h3>
            <div class="meta"><span class="tag">Lv ${esc(x.level)}</span><span class="tag">${esc(x.location)}</span></div>
            <p>${esc(x.mechanics)}</p>
          </div>
        `).join("") || emptyState()}
      </div>
    </div>
    <div class="section-block">
      <h3>Seasonal &amp; Event Bosses</h3>
      <div class="grid">
        ${seasonal.map(x => `
          <div class="card">
            <h3>${esc(x.name)}</h3>
            <div class="meta"><span class="tag">${esc(x.type)}</span></div>
            <p>${esc(x.context)}</p>
          </div>
        `).join("")}
      </div>
    </div>
    <p class="intro" style="margin-top:14px">${esc(b.note)}</p>
  `;
}

function renderRegions() {
  const r = state.data.regions;
  return `
    <h2>Regions</h2>
    <p class="intro">${esc(r.overview)}</p>
    <div class="section-block">
      <h3>${esc(r.manibus.name)}</h3>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Stronghold</th><th>Biome</th><th>Level Range</th><th>Notes</th></tr></thead>
        <tbody>
          ${r.manibus.areas.map(a => `<tr><td>${esc(a.stronghold)}</td><td>${esc(a.biome)}</td><td>${esc(a.levelRange)}</td><td>${esc(a.notes || "")}</td></tr>`).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="section-block">
      <h3>Other Notable Areas</h3>
      <div class="grid">
        ${r.otherNotableAreas.map(a => `<div class="card"><h3>${esc(a.name)}</h3><p>${esc(a.notes)}</p></div>`).join("")}
      </div>
    </div>
    <div class="section-block">
      <h3>Special Worlds &amp; Scenarios</h3>
      <div class="grid">
        ${r.specialWorldsAndScenarios.map(a => `
          <div class="card">
            <h3>${esc(a.name)}</h3>
            <div class="meta"><span class="tag">${esc(a.type)}</span></div>
            <p>${esc(a.notes || "")}</p>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderUpdates() {
  const u = state.data.updates;
  return `
    <h2>Updates &amp; Patch History</h2>
    <p class="intro"><strong>Current version:</strong> ${esc(u.current.version)} (${esc(u.current.date)}) — ${esc(u.current.title)}</p>
    <p class="intro">${esc(u.current.note)}</p>
    <div class="section-block">
      ${u.history.map(h => `
        <div class="timeline-entry">
          <h3>v${esc(h.version)}</h3>
          <div class="date">${esc(h.date)}</div>
          <ul>${h.highlights.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        </div>
      `).join("")}
    </div>
    <div class="section-block">
      <h3>Major Content Eras</h3>
      <div class="grid">
        ${u.majorContentEras.map(e => `<div class="card"><h3>${esc(e.name)}</h3><p>${esc(e.notes)}</p></div>`).join("")}
      </div>
    </div>
  `;
}

function renderSources() {
  const meta = state.data.meta;
  return `
    <h2>Sources</h2>
    <p class="intro">${esc(meta.disclaimer)}</p>
    <ul class="sources-list">
      ${meta.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join("")}
    </ul>
  `;
}

function emptyState() {
  return `<div class="empty-state">No matches for “${esc(state.query)}” in this section.</div>`;
}

function wireSearch() {
  const input = document.getElementById("global-search");
  input.addEventListener("input", () => {
    state.query = input.value.trim().toLowerCase();
    render();
  });
}

async function init() {
  try {
    await loadAll();
    document.getElementById("version-pill").textContent = "v" + state.data.meta.gameVersionAtCompile;
    document.getElementById("footer").textContent =
      `${state.data.meta.siteName} · unofficial fan-made reference · compiled ${state.data.meta.lastCompiled} · not affiliated with Starry Studio / NetEase`;
    buildTabs();
    wireSearch();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML = `<div class="empty-state">Failed to load data: ${esc(err.message)}<br>If you opened this file directly in a browser, serve it over HTTP instead (e.g. <code>python3 -m http.server</code>) so fetch() can read the /data JSON files.</div>`;
    console.error(err);
  }
}

init();

</script>
</body>
</html>
